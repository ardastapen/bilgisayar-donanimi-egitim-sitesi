    ],
    steps: [
      /* ---- Adım 1: Motivasyon ---- */
      { id: 'neden', tag: 'Motivasyon', title: 'Neden önemli?', minutes: 1, html: `
        <div class="grid cols-2">
          <div class="card"><h3 class="mt0">🧩 Bilmece 1</h3><p>Aynı Windows programı hem Intel hem AMD işlemcili bir bilgisayarda çalışıyor. Ama biri diğerinden daha hızlı. <b>Aynı programı çalıştırabiliyorlarsa neden hızları farklı?</b></p></div>
          <div class="card"><h3 class="mt0">🎥 Bilmece 2</h3><p>Görüntülü görüşmede aynı anda uygulama mantığı, görüntü çizimi, yapay zekâ ile arka plan ayırma ve video sıkıştırma yapılıyor. <b>Bu işlerin hepsini tek bir birim mi yapıyor?</b></p></div>
        </div>
        <p>İkisinin cevabı da <b>bilgisayar mimarisinde</b>. Bu modülde bilgisayarın “nasıl düşündüğünü” — komutları nereden alıp nasıl yürüttüğünü — kendi elinle çalıştıracağın bir mini işlemciyle göreceksin.</p>` },

      /* ---- Adım 2: Mimari, ISA, mikromimari ---- */
      { id: 'isa', tag: 'Temel kavramlar', title: 'Mimari, ISA ve mikromimari', minutes: 3, init: initLevels, html: `
        <p><span class="term">Bilgisayar mimarisi</span>, bir sistemin yazılım tarafından görülen davranışını ve bileşenlerin birlikte nasıl çalıştığını açıklayan üst düzey tasarım çerçevesidir. <span class="term">Bilgisayar organizasyonu</span> ise bu mimarinin belirli bir donanımda hangi bileşen ve bağlantılarla gerçekleştirildiğine odaklanır.</p>
        <div class="grid cols-2">
          <div class="card"><h3 class="mt0">📜 ISA (Komut Seti Mimarisi)</h3><p class="mt0">Yazılım ile işlemci arasındaki <b>sözleşme</b>. İşlemcinin desteklediği <b>makine komutlarını</b>, programcının görebildiği <b>yazmaçları</b>, veri tiplerini, bellek adresleme modelini ve ayrıcalık düzeylerini tanımlar.</p></div>
          <div class="card"><h3 class="mt0">🏗️ Mikromimari</h3><p class="mt0">Aynı ISA’nın işlemci içinde <b>nasıl gerçekleştirildiği</b>: pipeline uzunluğu, komut çözme birimleri, önbellek düzeni, branch predictor (dallanma tahmincisi), yürütme birimleri, çekirdek organizasyonu, güç yönetimi.</p></div>
        </div>
        <p><b>Bilmece 1’in cevabı:</b> Aynı x86-64 programının farklı nesil Intel ve AMD işlemcilerde çalışabilmesinin nedeni <b>ISA uyumluluğudur</b>. Performanslarının farklı olmasının önemli bir nedeni ise <b>mikromimari farklarıdır</b>.</p>
        <div class="box analogy"><div class="box-title">🗣️ Günlük hayattan: Aynı dili konuşan iki kişi</div>
          <p>İki kişi Türkçe konuşuyor (aynı <b>ISA</b>). Söylenen her cümleyi ikisi de anlıyor. Ama biri cevabı daha hızlı düşünüyor, çünkü beyni farklı çalışıyor (farklı <b>mikromimari</b>).</p>
          <span class="limit">İnsanlar dili esnek yorumlar; ISA ise kesin bir sözleşmedir. Bir makine komutunun anlamı, o ISA’yı destekleyen her işlemcide aynıdır.</span></div>
        <div class="box warn"><div class="box-title">⚠️ Karıştırma</div><p>“3 nm” veya “Intel 18A” gibi <b>üretim teknolojisi</b> fiziksel gerçekleme düzeyindedir; ISA’yı tanımlamaz. Aynı ISA farklı üretim süreçlerinde, farklı çekirdek sayılarında ve güç hedefleriyle uygulanabilir.</p></div>
        <h3>Soyutlama düzeyleri</h3>
        <p>Bir bilgisayar aynı anda birden çok düzeyde incelenebilir. Bir düzeyde doğru olan açıklama başka düzeyde eksik kalabilir; iyi bir açıklama <b>hangi düzeyde konuştuğunu</b> belirtir.</p>
        <div class="lab"><div class="lab-head">🔬 Laboratuvar: Yukarıdan aşağıya in <span class="chip">tıkla</span></div><div class="lab-body" id="m2Levels"></div></div>` },

      /* ---- Adım 3: Von Neumann ve Harvard ---- */
      { id: 'vonneumann', tag: 'Temel kavramlar', title: 'Stored-program, Von Neumann ve Harvard', minutes: 3, init: initArchDemo, html: `
        <p>Eskiden programlamak; kabloları yeniden bağlamak, anahtarları ayarlamak gibi <b>fiziksel</b> işler gerektirebiliyordu. <span class="term">Stored-program (saklı program)</span> ilkesi, <b>program komutlarının da veri gibi bellekte saklanabilmesidir</b>. Böylece bilgisayarın davranışı, devreyi değiştirmeden yazılımla değiştirilebildi.</p>
        <h3>Von Neumann modeli</h3>
        <ul>
          <li><b>CPU:</b> <span class="term">Kontrol birimi</span> komutların sırasını ve denetim sinyallerini yönetir; <span class="term">ALU</span> (Aritmetik Mantık Birimi) toplama, çıkarma, karşılaştırma ve mantıksal işlemleri yapar; <span class="term">yazmaçlar</span> küçük ve çok hızlı saklama alanlarıdır.</li>
          <li><b>Ana bellek:</b> Çalışan programları <b>ve</b> verileri birlikte tutar.</li>
          <li><b>Giriş/çıkış:</b> Bilgisayarın çevresiyle etkileşimi sağlar.</li>
        </ul>
        <p>Komutlar ve veriler <b>aynı bellek ve iletişim yolunu</b> paylaşır. İşlemci çok hızlı olsa bile ihtiyaç duyduğu komut veya veri zamanında gelmezse bekler. Bu sınıra <span class="term">Von Neumann darboğazı</span> denir. Önbellekler, önceden getirme (prefetching), daha geniş ve hızlı bağlantılar, paralel yürütme ve ayrı komut/veri önbellekleri bu etkiyi azaltır.</p>
        <h3>Harvard ve modified Harvard</h3>
        <p><span class="term">Harvard mimarisinde</span> komutlar ve veriler için <b>ayrı bellekler ve ayrı yollar</b> vardır; işlemci aynı anda komut ve veri erişimi yapabilir. Mikrodenetleyicilerde ve DSP’lerde (Sayısal Sinyal İşlemcisi) yaygındır. Günümüz genel amaçlı CPU’ları ise <span class="term">modified (değiştirilmiş) Harvard</span> yaklaşımını kullanır: yazılım tek ve ortak bir adres alanı görür, ama çekirdeğe yakın <b>L1 düzeyinde komut önbelleği ve veri önbelleği ayrıdır</b>.</p>
        <div class="lab"><div class="lab-head">🎬 Animasyon: Tek yol mu, iki yol mu?</div><div class="lab-body" id="m2Arch"></div></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Özellik</th><th>Von Neumann</th><th>Harvard / Modified Harvard</th></tr></thead>
          <tbody>
            <tr><td>Komut ve veri belleği</td><td>Kavramsal olarak ortak bellek</td><td>Harvard’da ayrı; modified Harvard’da bazı seviyelerde (L1) ayrı</td></tr>
            <tr><td>Veri yolu</td><td>Komut ve veri erişimleri aynı altyapıyı paylaşabilir</td><td>Komut/veri erişimleri ayrıştırılabilir</td></tr>
            <tr><td>Esneklik</td><td>Genel amaçlı programlama için yüksek</td><td>Saf Harvard daha özel amaçlı; modified Harvard modern CPU’larda yaygın</td></tr>
            <tr><td>Tipik kullanım</td><td>Genel amaçlı bilgisayarların sistem modeli</td><td>Mikrodenetleyici, DSP; modern CPU önbellek yapıları</td></tr>
          </tbody></table></div>
        <div class="box analogy"><div class="box-title">📦 Günlük hayattan: Depo ve raflar</div>
          <p>Bir atölyede hem <b>tarifler</b> (komutlar) hem <b>malzemeler</b> (veriler) aynı depoda, tek bir kapıdan getiriliyor: Von Neumann. Kapıda sıra oluşuyor: darboğaz. Modified Harvard’da depo yine ortak, ama tezgâhın hemen yanında <b>iki küçük raf</b> var: biri tarifler, biri malzemeler için. Usta ikisinden aynı anda alabiliyor.</p>
          <span class="limit">Gerçek bilgisayarda “raflar” (önbellekler) içeriğini otomatik doldurur ve depo ile tezgâh arasındaki hız farkı atölyedekinden çok daha belirgindir. Ayrıca gerçek bir işlemciye tek kelimelik etiket vermek yetersizdir; hangi düzeye bakıldığı belirtilmelidir.</span></div>` },

      /* ---- Adım 4: Getir–Çöz–Yürüt ---- */
      { id: 'fde', tag: 'Etkileşimli açıklama', title: 'Getir–çöz–yürüt: Mini işlemciyi çalıştır', minutes: 4, init: initCpuSim, html: `
        <p>İşlemcinin temel davranışı <span class="term">getir–çöz–yürüt (fetch–decode–execute)</span> döngüsüyle anlatılır:</p>
        <ol>
          <li><b>Getir:</b> <span class="term">Program sayacı (PC)</span> sıradaki komutun adresini tutar. Komut bellek hiyerarşisinden alınıp <span class="term">komut yazmacına (IR)</span> aktarılır.</li>
          <li><b>Çöz:</b> Kontrol birimi komutun hangi işlemi ve hangi operandları (işlenecek değerleri) istediğini belirler.</li>
          <li><b>Yürüt:</b> ALU, yükleme/saklama birimi veya başka bir yürütme birimi işlemi yapar; sonuç yazmaca ya da belleğe yazılır.</li>
        </ol>
        <div class="lab"><div class="lab-head">🔬 Laboratuvar: C = A + B programını çalıştır <span class="chip">adım adım</span></div><div class="lab-body" id="m2Cpu"></div></div>
        <div class="box note"><div class="box-title">ℹ️ Gerçek işlemciler daha karmaşık</div>
          <p>Gerçek komut adları ISA’ya göre değişir; buradaki LOAD/ADD/STORE soyut bir örnektir. Modern işlemciler birden fazla komutu <b>boru hattında</b> (pipeline) aynı anda farklı aşamalarda tutabilir, komutları iç işlemlere dönüştürebilir ve güvenli olduğu ölçüde farklı sırada yürütebilir. Ayrıca <b>dallanma</b> komutları PC’yi değiştirir, <b>kesmeler</b> akışı geçici olarak başka koda yönlendirir, yetkisiz bellek erişimi <b>istisna</b> oluşturur. Yine de getir–çöz–yürüt güçlü bir başlangıç modelidir.</p></div>` },

      /* ---- Adım 5: ISA aileleri ve veri akışı ---- */
      { id: 'aileler', tag: 'Temel kavramlar', title: 'ISA aileleri ve sistemde veri akışı', minutes: 3, html: `
        <p>Bir programın çalışabilmesi için yazılımın hedeflediği ISA ile işlemcinin desteklediği ISA <b>uyumlu</b> olmalıdır. Güncel dünyada üç önemli aile var:</p>
        <div class="table-wrap"><table>
          <thead><tr><th>ISA ailesi</th><th>Yaklaşım</th><th>Lisans / standart</th><th>Yaygın kullanım</th></tr></thead>
          <tbody>
            <tr><td><b>x86-64</b><br><span class="muted" style="font-size:.85rem">(AMD64 / Intel 64)</span></td><td>CISC (Karmaşık Komut Setli Bilgisayar) kökenli; 1970’lerin sonundan beri geriye dönük uyumlulukla büyüdü</td><td>Üretici kontrollü / çapraz lisanslı</td><td>Masaüstü, dizüstü, iş istasyonu, sunucu</td></tr>
            <tr><td><b>Arm64</b><br><span class="muted" style="font-size:.85rem">(AArch64)</span></td><td>RISC (Azaltılmış Komut Setli Bilgisayar): küçük, optimize komut kümeleri</td><td>Arm lisanslı mimari ve IP çekirdek modeli</td><td>Mobil cihaz, dizüstü, sunucu, gömülü</td></tr>
            <tr><td><b>RISC-V</b></td><td>RISC tabanlı, <b>modüler</b>: temel ISA standart uzantılarla genişletilir</td><td><b>Açık standart</b>; spesifikasyonlar herkese açık yayımlanır</td><td>Mikrodenetleyici, eğitim, gömülü, hızlandırıcı ve gelişen genel amaçlı sistemler</td></tr>
          </tbody></table></div>
        <div class="box warn"><div class="box-title">⚠️ RISC–CISC konusunda yaygın yanılgı</div>
          <p>“RISC her zaman daha hızlıdır” veya “CISC mutlaka daha çok güç tüketir” <b>doğru değildir</b>. Performansı ISA etiketinden çok mikromimari, üretim teknolojisi, önbellek, güç bütçesi, derleyici ve iş yükü belirler. Güncel x86 çekirdekleri karmaşık komutları içsel mikro işlemlere dönüştürebilir; modern RISC ISA’ları da gelişmiş vektör ve matris uzantıları içerebilir.</p></div>
        <h3>Bir program çalıştırıldığında veri nereden nereye gider?</h3>
        <ol>
          <li>Programın çalıştırılabilir dosyası SSD gibi <b>kalıcı depolamada</b> bulunur.</li>
          <li>İşletim sistemi gerekli kod ve verileri <b>RAM</b>’e yükler.</li>
          <li><b>CPU</b> ISA komutlarını getirir ve yürütür; sık kullanılanlar <b>önbelleklerde</b> tutulur.</li>
          <li>Grafik işleri <b>GPU</b>’ya, uygun yapay zekâ işleri <b>NPU</b> veya GPU’ya aktarılabilir.</li>
          <li><b>Giriş-çıkış denetleyicileri</b> ağ, depolama, klavye, ekran gibi aygıtlarla iletişim kurar.</li>
          <li>Sonuçlar RAM’de tutulur, ekranda gösterilir, ağdan gönderilir veya depolamaya yazılır.</li>
        </ol>
        <div class="box summary"><div class="box-title">🔑 Temel ilke</div><p>Depolama <b>kapasite</b> sağlar; RAM <b>çalışma alanı</b> sağlar; CPU/GPU/NPU <b>hesaplama</b> yapar; ara bağlantılar bu birimlerin <b>veri alışverişini</b> mümkün kılar. Sistem performansı, bu zincirdeki en yavaş veya en yoğun kullanılan bileşenden etkilenebilir.</p></div>
        <div class="table-wrap"><table>
          <thead><tr><th>Bileşen</th><th>Temel görev</th><th>Bu sitede ayrıntısı</th></tr></thead>
          <tbody>
            <tr><td>CPU</td><td>Genel amaçlı komut yürütme, kontrol akışı ve hesaplama</td><td>Modül 5</td></tr>
            <tr><td>Anakart / yonga seti</td><td>Bileşenleri fiziksel ve mantıksal olarak bağlayan platform</td><td>Modül 6</td></tr>
            <tr><td>Ana bellek (RAM)</td><td>Aktif program ve verilerin düşük gecikmeli geçici saklanması</td><td>Modül 7</td></tr>
            <tr><td>Depolama</td><td>Dosyaların ve yazılımların kalıcı saklanması</td><td>Modül 8</td></tr>
            <tr><td>Sistem ara bağlantıları</td><td>Bileşenler arasında veri, adres ve kontrol iletimi</td><td>Bu modül + Modül 6</td></tr>
            <tr><td>GPU / NPU</td><td>Grafik, paralel hesaplama ve yapay zekâ hızlandırma</td><td>Bu modül + Modül 5</td></tr>
            <tr><td>Güç</td><td>Elektrik enerjisini uygun biçimde sağlamak</td><td>Modül 3–4</td></tr>
          </tbody></table></div>` },

      /* ---- Adım 6: Bellek hiyerarşisi ve veri yolları ---- */
      { id: 'hiyerarsi', tag: 'Temel kavramlar', title: 'Bellek hiyerarşisi ve veri yolları', minutes: 3, init: initPyramid, html: `
        <p>Tüm veriyi en hızlı bellekte tutmak fiziksel ve ekonomik olarak mümkün değil. Bu yüzden bilgisayarlar, işlemciye çok yakın <b>küçük ve hızlı</b> yapılardan <b>büyük fakat daha yavaş</b> katmanlara uzanan bir <span class="term">bellek hiyerarşisi</span> kullanır.</p>
        <div class="lab"><div class="lab-head">🔺 Laboratuvar: Bellek piramidi <span class="chip">tıkla</span></div><div class="lab-body" id="m2Pyr"></div></div>
        <div class="box analogy"><div class="box-title">🍲 Günlük hayattan: Mutfak</div>
          <p>Elinde tuttuğun kaşık ve malzeme <b>yazmaç</b>; ocağın hemen yanındaki baharat rafı <b>önbellek</b>; üzerinde çalıştığın geniş <b>tezgâh RAM</b>; kiler ya da dolap ise <b>SSD/HDD</b>. Sık kullandığını yakında tutarsın, az kullandığını uzakta.</p>
          <span class="limit">Mutfakta işin bitince tezgâh kendiliğinden boşalmaz; RAM ise elektrik kesildiğinde içeriğini kaybeder (uçucu). Ayrıca bilgisayarda katmanlar arası kopyalama otomatik yapılır ve SSD’nin gecikmesi RAM’e göre çok daha yüksektir.</span></div>
        <h3>Yerellik ilkesi: hiyerarşi neden işe yarar?</h3>
        <ul>
          <li><span class="term">Zamansal yerellik:</span> Yakın zamanda kullanılan veri kısa süre içinde yeniden kullanılır. <i>Örnek: Bir döngüde aynı değişkenin tekrar tekrar kullanılması.</i></li>
          <li><span class="term">Mekânsal yerellik:</span> Erişilen adresin yakınındaki adreslere de kısa sürede erişilir. <i>Örnek: Bir dizinin ardışık elemanlarının okunması.</i></li>
        </ul>
        <p>“Program SSD’dedir” ifadesi programın <b>kalıcı kopyasını</b>, “program çalışırken RAM’dedir” ifadesi <b>aktif çalışma durumunu</b> anlatır. CPU komut ve verilere çoğunlukla doğrudan depolamadan değil, yazmaçlar ve önbellekler üzerinden erişir.</p>
        <h3>Veri yolları: klasik model ve bugün</h3>
        <p>Klasik açıklamada <span class="term">veri yolu (bus)</span> bileşenler arasındaki ortak iletişim yapısıdır: <b>veri yolu</b> taşınan veriyi, <b>adres yolu</b> erişilecek konumu, <b>kontrol yolu</b> okuma/yazma, kesme ve zamanlama bilgisini taşır. Bu üçlü öğretici bir modeldir; ama modern bilgisayarlar çoğunlukla tek ve ortak paralel hatlar yerine <b>özel bellek kanalları</b> ve <b>yüksek hızlı, seri, noktadan noktaya</b> bağlantılar kullanır.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Bağlantı</th><th>Temel rol</th><th>Örnek kullanım</th></tr></thead>
          <tbody>
            <tr><td><b>DDR / LPDDR bellek kanalı</b></td><td>İşlemci/SoC ile ana bellek arasında yüksek bant genişlikli iletişim</td><td>Masaüstü DDR5; mobil LPDDR5/5X</td></tr>
            <tr><td><b>PCI Express (PCIe)</b></td><td>Genel amaçlı, yüksek hızlı, seri ve noktadan noktaya G/Ç bağlantısı</td><td>Ekran kartı, NVMe SSD, ağ kartı</td></tr>
            <tr><td><b>CXL</b></td><td>Önbellek tutarlılığı ve bellek/aygıt paylaşımı</td><td>Sunucu, hızlandırıcı, bellek genişletme</td></tr>
            <tr><td><b>UCIe</b></td><td>Aynı paketteki chiplet’ler arasında açık standart bağlantı</td><td>Çok yongalı paketler</td></tr>
          </tbody></table></div>
        <div class="box warn"><div class="box-title">⚠️ İki yaygın yanılgı</div>
          <p><b>“Paralel bağlantı her zaman daha hızlıdır”</b> doğru değildir: Çok yüksek hızlarda paralel hatlar arasındaki zamanlama farkları ve sinyal bütünlüğü sorunları büyür. Bu yüzden güncel yüksek hızlı arayüzlerin çoğu <b>seri ve paket tabanlıdır</b>.</p>
          <p><b>GT/s ≠ GB/s:</b> GT/s (saniyede giga-aktarım) ham aktarım oranıdır; GB/s veri miktarıdır. Kodlama ve protokol yükleri gerçek bant genişliğini etkiler.</p></div>
        <p class="footnote">Hafta 1 notuna göre PCIe 7.0 (2025) 128 GT/s ham hız tanımlar; x16 bağlantıda çift yönlü toplam 512 GB/s sınıfına ulaşır. CXL 4.0 128 GT/s’ye, UCIe 3.0 paket içinde 64 GT/s’ye kadar çıkar. Hafta 5 ve 7 notları ise daha yeni <b>PCIe 7.1</b> belirtiminin 17 Eylül 2026’da yayımlandığını belirtir. Bunlar standartların <b>üst sınırlarıdır</b>; satılan her bilgisayar bu nesilleri kullanmaz.</p>` },

      /* ---- Adım 7: Heterojen hesaplama ---- */
      { id: 'heterojen', tag: 'Temel kavramlar + oyun', title: 'Heterojen hesaplama: CPU, GPU, NPU, SoC, chiplet', minutes: 3, init: initDispatch, html: `
        <p><span class="term">Heterojen hesaplama</span>, farklı paralellik, gecikme ve enerji özelliklerine sahip işleri CPU, GPU, NPU ve özel medya motorları gibi <b>farklı birimlere yönlendirmektir</b>. Amaç “en güçlü” tek birimi seçmek değil, işi <b>yapısına en uygun</b> birimde çalıştırmaktır.</p>
        <div class="grid cols-2">
          <div class="card"><b>CPU</b><p class="mt0">İşletim sistemi, uygulama mantığı, dallanması yoğun ve hızlı tepki gerektiren görevler. Esnek.</p></div>
          <div class="card"><b>GPU</b> (Grafik İşlem Birimi)<p class="mt0">Binlerce benzer işlemin paralel yürütüldüğü grafik, bilimsel hesaplama ve birçok makine öğrenmesi işi.</p></div>
          <div class="card"><b>NPU</b> (Sinirsel İşlem Birimi)<p class="mt0">Yapay zekâ çıkarımındaki matris/tensör işlemlerini düşük güçle yürütmek için özelleşmiş.</p></div>
          <div class="card"><b>Medya motoru</b><p class="mt0">Video kodlama/çözmeyi genel amaçlı çekirdeklerden daha verimli yapar.</p></div>
        </div>
        <div class="lab"><div class="lab-head">🎮 Oyun: İşi doğru birime gönder</div><div class="lab-body" id="m2Dispatch"></div></div>
        <p><b>Uzmanlaşmanın bedeli:</b> Bir işi hızlandırıcıya göndermek; veriyi hazırlamak, işi başlatmak ve sonucu paylaşmak gibi ek gecikme ve veri hareketi doğurur. Küçük bir işte bu hazırlık maliyeti, kazancı aşabilir.</p>
        <h3>SoC ve chiplet aynı şey değil</h3>
        <div class="grid cols-2">
          <div class="card"><b>SoC (Yonga Üzerinde Sistem)</b><p class="mt0">CPU, GPU, bellek denetleyicisi, medya motoru, güvenlik ve G/Ç gibi işlevlerin <b>tek yonga veya sıkı bütünleşmiş bir pakette</b> toplanması. Telefonlarda uzun süredir yaygın; enerji verimliliği ve kompaktlık nedeniyle dizüstü ve mini-PC’lerde de önem kazandı. → <i>İşlevsel bütünleşme</i></p></div>
          <div class="card"><b>Chiplet</b><p class="mt0">İşlemcinin tamamını tek büyük silikon kalıp yerine, <b>birden fazla küçük yonga parçasından</b> gelişmiş bir pakette birleştirmek (ör. AMD Zen). → <i>Fiziksel paketleme ve tasarım parçalanması</i></p></div>
        </div>
        <p>Modern bir paket <b>her iki yaklaşımı birlikte</b> taşıyabilir. <span class="term">Bütünleşik</span> GPU/NPU, CPU ile aynı yonga/paket içindedir ve çoğu tasarımda sistem belleğini paylaşır; <span class="term">ayrık</span> GPU ise kendi yongası ve çoğunlukla kendi video belleği olan ayrı bir aygıttır. Hiçbiri mutlak olarak “daha iyi” değildir: kullanım amacı, enerji bütçesi, maliyet ve yükseltilebilirlik belirleyicidir.</p>
        <h3>Bilgisayar türleri</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Tür</th><th>Temel özellik</th><th>Tipik kullanım</th></tr></thead>
          <tbody>
            <tr><td>Masaüstü PC</td><td>Yükseltilebilirlik, geniş soğutma ve güç alanı</td><td>Ofis, eğitim, oyun, yazılım geliştirme</td></tr>
            <tr><td>Dizüstü</td><td>Taşınabilirlik; batarya, güç ve ısı sınırları</td><td>Mobil üretkenlik, saha çalışması</td></tr>

            <tr><td>Sunucu</td><td>Sürekli çalışma, uzaktan yönetim, yüksek G/Ç ve bellek</td><td>Web, veritabanı, sanallaştırma, bulut</td></tr>
            <tr><td>Mini-PC / SFF</td><td>Kompakt hacimde genel amaçlı hesaplama</td><td>Ofis, kiosk, laboratuvar</td></tr>
            <tr><td>Tek kart bilgisayar (SBC)</td><td>Tek kart üzerinde işlemci, bellek, G/Ç</td><td>Eğitim, prototipleme</td></tr>

            <tr><td>Akıllı telefon / tablet</td><td>Yüksek SoC bütünleşmesi, enerji verimliliği</td><td>İletişim, medya, uygulamalar</td></tr>

      /* ---- Adım 8: Performans, örnek, özet ---- */
      { id: 'ozet', tag: 'Örnek ve özet', title: 'Performansı doğru okumak + özet', minutes: 2, html: `
        <p>Donanım ürünleri sıkça tek bir sayıyla karşılaştırılır (GHz, çekirdek sayısı, GB, TOPS…). Oysa performans <b>çok boyutludur</b>:</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Ölçüt</th><th>Ne ifade eder?</th><th>Tek başına neden yetmez?</th></tr></thead>

            <tr><td>Saat frekansı (GHz)</td><td>Saniyedeki saat çevrimi sayısı</td><td>Bir çevrimde yapılan iş (IPC) ve mimari farklı olabilir</td></tr>
            <tr><td>IPC</td><td>Çevrim başına yürütülen komut</td><td>İş yüküne ve ölçüm yöntemine bağlı</td></tr>

            <tr><td>TOPS</td><td>Saniyede trilyon işlem (AI hızlandırıcılar)</td><td>Veri tipi, hassasiyet, model, yazılım farklı olabilir</td></tr>

          </tbody></table></div>
        <div class="box summary"><div class="box-title">🔑 Performans ilkesi</div><p>Gerçek performans = <b>iş yükü + donanım + yazılım + güç/ısı sınırları</b> birlikte değerlendirilerek ölçülür.</p></div>

          <p><b>Ölçüm uyarısı:</b> Bu TOPS değerleri üreticilerin tepe değerleridir. Veri hassasiyeti, model, bellek bant genişliği ve sürücüler değiştiği için TOPS tek başına “hangisi daha hızlı?” sorusunu cevaplamaz. Önemli olan ürün adlarını ezberlemek değil; bugünkü bilgisayarın artık “CPU + RAM + disk” diye yeterince açıklanamadığını görmektir.</p></div>

              <line x1="30" y1="96" x2="50" y2="96" stroke="var(--ink)" stroke-width="4"/><line x1="34" y1="112" x2="46" y2="112" stroke="var(--ink)" stroke-width="2"/>
              <text x="40" y="75" text-anchor="middle" font-size="13" fill="var(--bad)" font-weight="800">+</text><text x="40" y="146" text-anchor="middle" font-size="15" fill="var(--info)" font-weight="800">−</text>
              <text x="-4" y="110" font-size="12" fill="var(--ink)" data-r="ulab">12 V</text></g>
            <g><circle cx="160" cy="30" r="17" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/><text x="160" y="35" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)">A</text></g>
            <rect data-r="res" x="262" y="72" width="36" height="66" rx="5" fill="#d6c7a8" stroke="var(--ink)" stroke-width="2"/>
            <text x="304" y="110" font-size="12" fill="var(--ink)" data-r="rlab">12 Ω</text>
            <g data-r="dots"></g>
            <text x="160" y="200" text-anchor="middle" font-size="11" fill="var(--muted)" data-r="dir">Elektronlar − uçtan + uca; klasik akım yönü + uçtan − uca</text>
          </svg>
        </div>
        <div>
          <label class="field">Gerilim U: <span data-r="Uv"></span><input type="range" data-k="U" min="0" max="24" step="0.5"></label>
          <label class="field">Akım I: <span data-r="Iv"></span><input type="range" data-k="I" min="0.05" max="5" step="0.05"></label>
          <label class="field">Direnç R: <span data-r="Rv"></span><input type="range" data-k="R" min="1" max="100" step="1"></label>
          <label class="field">Direncin güç değeri (standart)
            <select data-r="pr"><option value="0.25">1/4 W (çeyrek watt)</option><option value="0.5">1/2 W (yarım watt)</option><option value="1">1 W</option><option value="2">2 W</option><option value="5">5 W</option><option value="10">10 W</option><option value="20" selected>20 W</option></select></label>
        </div>
      </div>
      <div class="readouts">
        <div class="readout"><div class="k">Akım (ampermetre)</div><div class="v" data-r="I"></div></div>
        <div class="readout"><div class="k">Gerilim</div><div class="v" data-r="U"></div></div>
        <div class="readout"><div class="k">Direnç</div><div class="v" data-r="R"></div></div>
        <div class="readout"><div class="k">Güç P = U · I</div><div class="v" data-r="P"></div></div>
      </div>
      <p class="live" data-r="msg" aria-live="polite"></p>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    const sl = (k) => $(`input[data-k="${k}"]`, host);
    ['U', 'I', 'R'].forEach((k) => { sl(k).value = v[k]; });
    function compute() {
      if (mode === 'I') v.I = v.R ? v.U / v.R : 0;
      if (mode === 'U') v.U = v.I * v.R;
      if (mode === 'R') v.R = v.I ? v.U / v.I : 0;
    }
    function paint() {
      compute();
      ['U', 'I', 'R'].forEach((k) => {
        const s = sl(k);
        s.disabled = k === mode;
        if (k === mode) s.value = clamp(v[k], +s.min, +s.max);
      });
      $$('[data-m]', host).forEach((b) => { b.setAttribute('aria-pressed', String(b.dataset.m === mode)); b.classList.toggle('primary', b.dataset.m === mode); });
      R('Uv').textContent = n2(v.U) + ' V' + (mode === 'U' ? ' (hesaplanan)' : '');
      R('Iv').textContent = n2(v.I, 3) + ' A' + (mode === 'I' ? ' (hesaplanan)' : '');
      R('Rv').textContent = n2(v.R) + ' ' + OHM + (mode === 'R' ? ' (hesaplanan)' : '');
      R('I').textContent = n2(v.I, 3) + ' A';
      R('U').textContent = n2(v.U) + ' V';
      R('R').textContent = n2(v.R) + ' ' + OHM;
      const P = v.U * v.I, rating = +R('pr').value;
      R('P').textContent = n2(P) + ' W';
      R('ulab').textContent = n2(v.U, 1) + ' V';
      R('rlab').textContent = n2(v.R, 1) + ' ' + OHM;
      const ratio = rating ? P / rating : 0;
      R('res').setAttribute('fill', ratio > 1 ? '#e04a2f' : ratio > 0.8 ? '#f0a24a' : '#d6c7a8');
      const formula = mode === 'I' ? `I = U / R = ${n2(v.U)} / ${n2(v.R)} = <b>${n2(v.I, 3)} A</b>` : mode === 'U' ? `U = I · R = ${n2(v.I, 3)} · ${n2(v.R)} = <b>${n2(v.U)} V</b>` : `R = U / I = ${n2(v.U)} / ${n2(v.I, 3)} = <b>${n2(v.R)} ${OHM}</b>`;
      R('msg').innerHTML = `${formula}. Güç: P = U · I = <b>${n2(P)} W</b>. ` + (ratio > 1
        ? `⚠️ <b>Direncin güç değeri (${R('pr').selectedOptions[0].textContent.split(' (')[0]}) aşıldı!</b> Düşük güçlü direnç yüksek akımlı devrede ısınır ve bozulur. Daha yüksek watt’lık direnç seç.`
        : ratio > 0.8 ? 'Sınırda: direnç güç değerine yakın çalışıyor, ısınır.' : 'Direnç güvenli aralıkta çalışıyor.');
    }
    host.addEventListener('input', (e) => {
      const k = e.target.dataset.k;
      if (k) { v[k] = parseFloat(e.target.value); paint(); }
      if (e.target === R('pr')) paint();
    });
    R('pr').addEventListener('change', paint);
    host.addEventListener('click', (e) => {
      const b = e.target.closest('[data-m]');
      if (!b) return;
      ['U', 'I', 'R'].forEach((k) => { v[k] = parseFloat(sl(k).value); });
      mode = b.dataset.m; paint();
    });
    paint();

    /* Elektron noktaları: dikdörtgen çevre boyunca, − uçtan çıkıp + uca döner */
    const dotsG = R('dots');
    const P0 = { x: 40, y: 30, w: 240, h: 150 };
    const per = 2 * (P0.w + P0.h);
    const N = 18;
    dotsG.innerHTML = Array.from({ length: N }, () => '<circle r="4" fill="var(--info)"/>').join('');
    const dots = $$('circle', dotsG);
    function pt(s) { // s: 0..per, sol alt köşeden (pilin − ucu tarafı) saat yönünün tersine
      s = ((s % per) + per) % per;
      const { x, y, w, h } = P0;
      if (s < w) return [x + s, y + h];             // alt kenar → sağa
      if (s < w + h) return [x + w, y + h - (s - w)]; // sağ kenar ↑
      if (s < 2 * w + h) return [x + w - (s - w - h), y]; // üst kenar ←
      return [x, y + (s - 2 * w - h)];              // sol kenar ↓ (pile + uçtan girer)
    }
    let off = 0, last = performance.now();
    function frame(t) {
      if (!alive(tok) || !document.body.contains(host)) return;
      const dt = Math.min(0.05, (t - last) / 1000); last = t;
      if (!Motion.reduced()) off += clamp(v.I, 0, 5) * 45 * dt;
      dots.forEach((d, i) => { const [x, y] = pt(off + (i * per) / N); d.setAttribute('cx', x); d.setAttribute('cy', y); });
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

        g = `<path d="M30 78 V30 H${xs[xs.length - 1]} M30 122 V170 H${xs[xs.length - 1]}" ${W}/>` + xs.map((x, i) => `<path d="M${x} 30 V170" ${W}/>` + vres(x, 100, 'R' + (i + 1), '')).join('') +
          xs.map((x, i) => `<text x="${x}" y="190" text-anchor="middle" font-size="11" fill="var(--muted)">${n2(out.I[i], 3)} A</text>`).join('');
      } else {
        g = `<path d="M30 78 V30 H360 M30 122 V170 H360 M300 30 V170 M420 30 V170 M360 30 H420 M360 170 H420" ${W}/>` + res(160, 30, 'R1', sub(0)) + vres(300, 100, 'R2', '') + vres(420, 100, 'R3', '') +
          `<text x="300" y="190" text-anchor="middle" font-size="11" fill="var(--muted)">${n2(out.I[1], 3)} A</text><text x="420" y="190" text-anchor="middle" font-size="11" fill="var(--muted)">${n2(out.I[2], 3)} A</text>`;
      }
      R('svg').innerHTML = `<svg viewBox="0 0 490 200" role="img" aria-label="${st.type} bağlı devre şeması" style="width:100%">${g}${batt}</svg>`;
    }
    function paint() {
      const r = st.r.map((x) => Math.max(0.1, x || 0.1));
      const k = st.type === 'karisik' ? 3 : (st.use3 ? 3 : 2);
      let RT, U = [], I = [], msg = '';
      if (st.type === 'seri') {
        RT = r.slice(0, k).reduce((a, b) => a + b, 0);
        const IT = st.U / RT;
        for (let i = 0; i < k; i++) { I[i] = IT; U[i] = IT * r[i]; }
        msg = `<b>Seri:</b> R<sub>T</sub> = ${r.slice(0, k).map((x) => n2(x)).join(' + ')} = <b>${n2(RT)} Ω</b> (toplam direnç artar). Akım her yerde aynı: I = ${n2(st.U)} / ${n2(RT)} = <b>${n2(IT, 3)} A</b>.<br>Kirchhoff gerilim kanunu: ${U.map((x) => n2(x)).join(' + ')} = <b>${n2(U.reduce((a, b) => a + b, 0))} V</b> = U<sub>T</sub> ✓`;
      } else if (st.type === 'paralel') {
        RT = 1 / r.slice(0, k).reduce((a, b) => a + 1 / b, 0);
        for (let i = 0; i < k; i++) { U[i] = st.U; I[i] = st.U / r[i]; }
        const IT = I.reduce((a, b) => a + b, 0);
        msg = `<b>Paralel:</b> 1/R<sub>T</sub> = ${r.slice(0, k).map((x) => '1/' + n2(x)).join(' + ')} → R<sub>T</sub> = <b>${n2(RT)} Ω</b> (toplam direnç azalır, en küçük dirençten bile küçük). Her dirençte gerilim aynı: <b>${n2(st.U)} V</b>.<br>Kirchhoff akım kanunu: ${I.map((x) => n2(x, 3)).join(' + ')} = <b>${n2(IT, 3)} A</b> = I<sub>T</sub> ✓`;
      } else {
        const Rp = 1 / (1 / r[1] + 1 / r[2]);
        RT = r[0] + Rp;
        const IT = st.U / RT;
        U[0] = IT * r[0]; I[0] = IT;
        U[1] = U[2] = IT * Rp; I[1] = U[1] / r[1]; I[2] = U[2] / r[2];
        msg = `<b>Karışık:</b> Önce paralel kısım sadeleşir: R2 ∥ R3 = <b>${n2(Rp)} Ω</b>. Sonra seri: R<sub>T</sub> = ${n2(r[0])} + ${n2(Rp)} = <b>${n2(RT)} Ω</b>. I<sub>T</sub> = <b>${n2(IT, 3)} A</b>.<br>Gerilim: ${n2(U[0])} + ${n2(U[1])} = ${n2(U[0] + U[1])} V ✓ · Akım: ${n2(I[1], 3)} + ${n2(I[2], 3)} = ${n2(I[1] + I[2], 3)} A ✓`;
      }
      const IT = st.U / RT;
      R('rows').innerHTML = Array.from({ length: k }, (_, i) => `<tr><td>R${i + 1}</td><td>${n2(r[i])} Ω</td><td>${n2(U[i])} V</td><td>${n2(I[i], 3)} A</td><td>${n2(U[i] * I[i])} W</td></tr>`).join('') +
        `<tr><th>Toplam</th><th>${n2(RT)} Ω</th><th>${n2(st.U)} V</th><th>${n2(IT, 3)} A</th><th>${n2(st.U * IT)} W</th></tr>`;
      R('msg').innerHTML = msg;
      draw({ U, I });
    }
    host.addEventListener('input', (e) => {
      const k = e.target.dataset.k;
      if (!k) return;
      if (k === 'U') st.U = Math.max(0, parseFloat(e.target.value) || 0);
      else if (k === 'use3') st.use3 = e.target.checked;
      else st.r[+k.slice(1)] = parseFloat(e.target.value) || 0.1;
      sync(); paint();
    });
    host.addEventListener('click', (e) => {
      const t = e.target.closest('[data-t]'), p = e.target.closest('[data-p]');
      if (t) { st.type = t.dataset.t; if (st.type === 'karisik') st.use3 = true; }
      else if (p) {
        const [ty, U, a, b, c] = p.dataset.p.split(',');
        st.type = ty; st.U = +U; st.r = [+a, +b, +c || 10]; st.use3 = +c > 0;
      } else return;
      sync(); paint();
    });
    sync(); paint();
  }

  function initMeter(root) {
    const host = $('#m3Meter', root);
    const tok = NAV_TOKEN;
    const PARTS = {
      sigorta: { name: 'Sigorta', ico: '🧯', states: ['ok', 'bad'],
        read: (s) => s === 'ok' ? '0,2 Ω' : '∞ Ω',
        rule: 'Sağlam sigorta tam iletkendir (≈ 0 Ω). Atık sigortada tel erimiştir: açık devre (sonsuz direnç).' },
      bobin: { name: 'Bobin', ico: '🌀', states: ['ok', 'bad'],
        read: (s) => s === 'ok' ? '14,6 Ω' : '∞ Ω',
        rule: 'Bobin bakır telden sarılı olduğu için direnci genellikle 100 Ω’dan küçüktür. Sonsuzdan farklı bir değer → sağlam; sonsuz → tel kopuk. Gözle yanık izi de kontrol edilir.' },
      diyot: { name: 'Diyot', ico: '▶|', states: ['ok', 'open', 'short'],
        read: (s, rev) => s === 'ok' ? (rev ? '∞ Ω' : '1,2 kΩ') : s === 'open' ? '∞ Ω' : '0,4 Ω',
        rule: 'Diyot akımı tek yönde geçirir: Bir yönde değer göstermeli, uçlar ters çevrilince hiçbir değer göstermemeli (sonsuz). İki yönde de sonsuz veya iki yönde de değer → arızalı.' },
      kond: { name: 'Kondansatör', ico: '⊣⊢', states: ['ok', 'open', 'short'],
        read: null,
        rule: 'Önce uçlar kısa devre edilerek yük boşaltılır. Sağlam kondansatörde gösterge önce çok büyük (sonsuz) değerden başlayıp hızla azalır, sonra şarj tamamlanınca tekrar sonsuza çıkar. Sürekli 0 Ω (kısa devre) veya hiç değişmeyen ∞ → sorunlu.' }
    };
    let part = 'sigorta', state = 'ok', reversed = false, measured = 0, safe = false, discharged = false, answered = false;
    host.innerHTML = `
      <p class="lab-hint">Bir eleman seç. Gizli olarak sağlam ya da arızalı olabilir. Ölçüm kurallarına uyarak ölç ve kararını ver.</p>
      <div class="btn-row" role="group" aria-label="Test edilecek eleman">
        ${Object.entries(PARTS).map(([k, p]) => `<button type="button" class="btn small" data-part="${k}">${p.ico} ${p.name}</button>`).join('')}
      </div>
      <div class="grid cols-2">
        <div style="text-align:center">
          <div aria-hidden="true" style="display:inline-block;background:#2b3a33;border-radius:18px;padding:14px 18px;box-shadow:var(--shadow)">
            <div style="background:#b9c9a0;color:#1b2a12;font-family:var(--mono);font-size:2rem;font-weight:800;min-width:190px;padding:8px 12px;border-radius:8px;text-align:right" data-r="lcd">----</div>
            <div style="color:#cfe;font-size:.75rem;margin-top:6px">Ω OHMMETRE KADEMESİ</div>
          </div>
          <p class="muted" style="font-size:.85rem" data-r="probes">Kırmızı prob → sol uç · Siyah prob → sağ uç</p>
        </div>
        <div>
          <label class="field" style="flex-direction:row;align-items:center;gap:8px;font-weight:600"><input type="checkbox" data-r="safe"> Devrenin enerjisi kesildi, eleman devreden söküldü</label>
          <div class="btn-row">
            <button type="button" class="btn small" data-a="discharge">⚡ Uçları kısa devre et (boşalt)</button>
            <button type="button" class="btn small primary" data-a="measure">📏 Ölç</button>
            <button type="button" class="btn small" data-a="reverse">⇄ Probları ters çevir</button>
          </div>
          <p class="muted" style="font-size:.85rem;margin:0">Kararın:</p>
          <div class="btn-row" style="margin-top:4px">
            <button type="button" class="btn small know" data-a="ok">✓ Sağlam</button>
            <button type="button" class="btn small again" data-a="bad">✗ Arızalı</button>
            <button type="button" class="btn small ghost" data-a="new">↺ Yeni eleman</button>
          </div>
        </div>
      </div>
      <div class="live" data-r="log" aria-live="polite"></div>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    const lcd = R('lcd'), log = R('log');
    const setLcd = (t) => { lcd.textContent = t; };
    function pick(k) {
      part = k; const p = PARTS[k];
      state = p.states[Math.floor(Math.random() * p.states.length)];
      reversed = false; measured = 0; discharged = false; answered = false;
      R('safe').checked = false; safe = false;
      $$('[data-part]', host).forEach((b) => b.classList.toggle('primary', b.dataset.part === k));
      $('[data-a="discharge"]', host).style.display = k === 'kond' ? '' : 'none';
      $('[data-a="reverse"]', host).style.display = (k === 'diyot' || k === 'kond') ? '' : 'none';
      R('probes').textContent = 'Kırmızı prob → sol uç · Siyah prob → sağ uç';
      setLcd('----');
      log.innerHTML = `Masada bir <b>${p.name}</b> var. Önce güvenlik koşulunu işaretle, sonra ölç.`;
    }
    async function measure() {
      if (!safe) { log.innerHTML = '⚠️ <b>Önce enerjiyi kes ve elemanı devreden sök.</b> Enerji altındaki ölçüm ölçü aletine zarar verebilir; devreye bağlı ölçüm yanıltıcı olur.'; return; }
      const p = PARTS[part];
      if (part === 'kond') {
        if (!discharged) { log.innerHTML = '⚠️ <b>Önce kondansatörü boşalt!</b> Üzerinde kalan gerilim hem sana hem ölçü aletine tehlikelidir ve ölçüm doğru olmaz.'; return; }
        const seq = state === 'ok' ? ['∞ Ω', '85 kΩ', '3,1 kΩ', '920 Ω', '7,5 kΩ', '160 kΩ', '∞ Ω'] : state === 'short' ? ['0,3 Ω', '0,3 Ω', '0,3 Ω'] : ['∞ Ω', '∞ Ω', '∞ Ω'];
        log.innerHTML = 'Ölçülüyor… göstergeyi izle.';
        for (const s of seq) { if (!alive(tok)) return; setLcd(s); await Motion.wait(380); }
        discharged = false; // ohmmetre kondansatörü şarj etti
        measured++;
        log.innerHTML = `Gösterge şu sırayla değişti: <b>${seq.join(' → ')}</b>. Şimdi kararını ver. (Tekrar ölçmek için önce yeniden boşalt.)`;
        return;
      }
      setLcd(p.read(state, reversed));
      measured++;
      log.innerHTML = part === 'diyot'
        ? `Ölçüm (${reversed ? 'ters' : 'düz'} yön): <b>${lcd.textContent}</b>. ${reversed ? '' : 'Diyot için probları ters çevirip bir kez daha ölçmelisin.'}`
        : `Ölçüm: <b>${lcd.textContent}</b>. Kararını ver.`;
    }
    host.addEventListener('change', (e) => { if (e.target === R('safe')) safe = e.target.checked; });
    host.addEventListener('click', (e) => {
      const pb = e.target.closest('[data-part]');
      if (pb) { pick(pb.dataset.part); return; }
      const a = e.target.closest('[data-a]');
      if (!a) return;
      const act = a.dataset.a;
      if (act === 'measure') measure();
      else if (act === 'reverse') { reversed = !reversed; R('probes').textContent = reversed ? 'Kırmızı prob → sağ uç · Siyah prob → sol uç (ters)' : 'Kırmızı prob → sol uç · Siyah prob → sağ uç'; setLcd('----'); log.innerHTML = 'Problar ters çevrildi. Yeniden ölç.'; }
      else if (act === 'discharge') { if (!safe) { log.innerHTML = '⚠️ Önce enerjiyi kes ve elemanı sök.'; return; } discharged = true; setLcd('----'); log.innerHTML = 'Uçlar geçici olarak birleştirildi; birikmiş yük boşaltıldı. Şimdi ölçebilirsin.'; }
      else if (act === 'new') pick(part);
      else if (act === 'ok' || act === 'bad') {
        if (!measured) { log.innerHTML = 'Karar vermeden önce en az bir ölçüm yap.'; return; }
        if (part === 'diyot' && measured < 2) { log.innerHTML = 'Diyotta tek yön yetmez: probları ters çevirip ikinci ölçümü de yap.'; return; }
        if (answered) return;
        answered = true;
        const right = (act === 'ok') === (state === 'ok');
        const truth = state === 'ok' ? 'sağlamdı' : state === 'short' ? 'kısa devre arızalıydı' : 'açık devre (kopuk/atık) arızalıydı';
        log.innerHTML = `${right ? '✅ <b>Doğru karar!</b>' : '❌ <b>Yanlış karar.</b>'} Bu ${PARTS[part].name.toLowerCase()} ${truth}. <br><span class="muted">Kural: ${PARTS[part].rule}</span> <br>Yeni bir eleman için <b>↺ Yeni eleman</b>’a bas.`;
      }
    });
    pick('sigorta');
  }

        <p><b>Ast ve üst katlar</b> biner biner büyür/küçülür: pikoamper (pA), nanoamper (nA), mikroamper (µA), miliamper (mA) … kiloamper (kA). Gerilim için de aynı: mV, V, kV.</p>

/* =========================================================
   MODÜL 4 — Yarı İletkenler, Diyot, Transistör ve DC Güç Kaynakları

(function () {

  /* ---------- Etkileşim 1: Katkılama kristali ---------- */
  function initDoping(root) {
    const host = $('#m4Dope', root);
    let mode = 'saf', heat = 0;
    const COLS = 5, ROWS = 3, GX = 90, GY = 80, X0 = 50, Y0 = 45;
    const atoms = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) atoms.push({ x: X0 + c * GX, y: Y0 + r * GY, r, c });
    const center = atoms.find((a) => a.r === 1 && a.c === 2);
    const bonds = [];
    atoms.forEach((a) => {
      if (a.c < COLS - 1) bonds.push([a, atoms.find((b) => b.r === a.r && b.c === a.c + 1)]);
      if (a.r < ROWS - 1) bonds.push([a, atoms.find((b) => b.c === a.c && b.r === a.r + 1)]);
    });
    const INFO = {
      saf: { t: 'Saf silisyum (Si)', d: 'Her Si atomunun son yörüngesinde <b>4 valans elektronu</b> var ve 4 komşusuyla <b>kovalent bağ</b> kurar (elektron paylaşır). Mutlak sıfırda serbest elektron yoktur. <b>Sıcaklığı artır:</b> bazı bağlar ısıl enerjiyle kopar, serbest elektron ve geride boşluk (oyuk) oluşur; iletkenlik artar, direnç düşer. Buna <b>negatif sıcaklık katsayısı</b> denir.' },
      n: { t: 'N tipi: fosfor (P) katkısı', d: 'Katkı atomunun <b>5 valans elektronu</b> var (antimon, arsenik, fosfor). Dördü komşu Si atomlarıyla bağ kurar, <b>beşincisi boşta kalır</b> ve kolayca serbest dolaşır. Fazla elektron verdiği için bu katkıya <b>verici</b> denir. <b>Çoğunluk taşıyıcısı: elektron</b>, azınlık taşıyıcısı: oyuk.' },
      p: { t: 'P tipi: bor (B) katkısı', d: 'Katkı atomunun <b>3 valans elektronu</b> var (bor, galyum, indiyum). Yalnızca 3 bağ kurabilir; dördüncü bağda elektron eksikliği yani <b>oyuk</b> oluşur. Oyuk elektron almaya hazır olduğundan bu katkıya <b>alıcı</b> denir. <b>Çoğunluk taşıyıcısı: oyuk</b>, azınlık taşıyıcısı: elektron. Komşu bir elektron oyuğa atladıkça oyuk ters yöne “hareket eder”.' }
    };
    host.innerHTML = `
      <div class="btn-row" role="group" aria-label="Kristal türü">
        <button type="button" class="btn small" data-mode="saf">Saf Si</button>
        <button type="button" class="btn small" data-mode="n">N tipi (5 valanslı katkı)</button>
        <button type="button" class="btn small" data-mode="p">P tipi (3 valanslı katkı)</button>
      </div>
      <label class="field" data-r="heatwrap">Sıcaklık: <span data-r="heatv"></span><input type="range" min="0" max="3" step="1" value="0" data-r="heat"></label>
      <svg viewBox="0 0 460 220" role="img" aria-label="Silisyum kristal örgüsü" style="width:100%;max-width:560px;display:block;margin:6px auto" data-r="svg"></svg>
      <p class="center muted" style="font-size:.85rem">🔵 serbest elektron &nbsp; ◯ oyuk (elektron eksikliği)</p>
      <div class="ex-detail" data-r="info" aria-live="polite"></div>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function paint() {
      $$('[data-mode]', host).forEach((b) => b.classList.toggle('primary', b.dataset.mode === mode));
      R('heatwrap').style.display = mode === 'saf' ? '' : 'none';
      R('heatv').textContent = ['mutlak sıfıra yakın', 'oda sıcaklığı', 'sıcak', 'çok sıcak'][heat];
      let g = bonds.map(([a, b]) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--line)" stroke-width="6"/>`).join('');
      g += bonds.map(([a, b]) => { const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, h = a.y === b.y; return `<circle cx="${mx + (h ? -6 : 0)}" cy="${my + (h ? 0 : -6)}" r="3" fill="var(--muted)"/><circle cx="${mx + (h ? 6 : 0)}" cy="${my + (h ? 0 : 6)}" r="3" fill="var(--muted)"/>`; }).join('');
      g += atoms.map((a) => {
        const dop = a === center && mode !== 'saf';
        const lbl = dop ? (mode === 'n' ? 'P' : 'B') : 'Si';
        const col = dop ? (mode === 'n' ? '#a24e07' : '#7b4bb7') : '#0d6b53';
        return `<circle cx="${a.x}" cy="${a.y}" r="20" fill="${col}"/><text x="${a.x}" y="${a.y + 5}" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">${lbl}</text>`;
      }).join('');
      // taşıyıcılar
      const carriers = [];
      if (mode === 'n') carriers.push({ kind: 'e', x: center.x + 26, y: center.y - 22, anim: 'drift-r' });
      if (mode === 'p') carriers.push({ kind: 'h', x: center.x + 45, y: center.y + 6, anim: 'drift-l' });
      if (mode === 'saf') {
        const spots = [[1, 0], [6, 1], [9, 0], [3, 1]].slice(0, heat === 0 ? 0 : heat === 1 ? 1 : heat === 2 ? 2 : 4);
        spots.forEach(([bi], k) => { const [a, b] = bonds[bi * 2 % bonds.length]; const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2; carriers.push({ kind: 'h', x: mx, y: my, anim: '' }); carriers.push({ kind: 'e', x: mx + 8, y: my - 26, anim: k % 2 ? 'drift-l' : 'drift-r' }); });
      }
      g += carriers.map((c) => c.kind === 'e'
        ? `<circle cx="${c.x}" cy="${c.y}" r="7" fill="var(--info)" class="${c.anim}"/>`
        : `<circle cx="${c.x}" cy="${c.y}" r="7" fill="none" stroke="var(--bad)" stroke-width="2.5" stroke-dasharray="3 2" class="${c.anim}"/>`).join('');
      R('svg').innerHTML = g;
      const I = INFO[mode];
      R('info').innerHTML = `<h4>${I.t}</h4><p class="mt0">${I.d}</p>`;
    }
    host.addEventListener('click', (e) => { const b = e.target.closest('[data-mode]'); if (b) { mode = b.dataset.mode; paint(); } });
    R('heat').addEventListener('input', (e) => { heat = +e.target.value; paint(); });
    paint();
  }

  /* ---------- Etkileşim 2: PN birleşimi / diyot polarma ---------- */
  function initPN(root) {
    const host = $('#m4PN', root);
    let V = 0, mat = 'Si';
    const VTH = { Si: 0.7, Ge: 0.3 };
    host.innerHTML = `
      <p class="lab-hint">Kaydırıcıyla diyoda gerilim uygula. <b>Pozitif</b> değer: P’ye +, N’ye − (doğru polarma). <b>Negatif</b> değer: P’ye −, N’ye + (ters polarma). Boşaltılmış bölgenin genişliğini ve akımı izle. <i>(Kavramsal ölçek.)</i></p>
      <div class="btn-row" role="group" aria-label="Malzeme">
        <button type="button" class="btn small" data-mat="Si">Silisyum (Si)</button>
        <button type="button" class="btn small" data-mat="Ge">Germanyum (Ge)</button>
      </div>
      <label class="field">Uygulanan gerilim: <span data-r="vv"></span><input type="range" min="-10" max="1.2" step="0.05" value="0" data-r="v"></label>
      <svg viewBox="0 0 520 170" role="img" aria-label="PN birleşimi" style="width:100%;max-width:600px;display:block;margin:6px auto" data-r="svg"></svg>
      <div class="grid cols-2">
        <svg viewBox="0 0 260 170" role="img" aria-label="Diyot akım-gerilim karakteristiği" style="width:100%;max-width:320px;display:block;margin:auto" data-r="iv"></svg>
        <div class="readouts" style="align-content:start">
          <div class="readout"><div class="k">Durum</div><div class="v" style="font-size:1rem" data-r="st"></div></div>
          <div class="readout"><div class="k">Akım (göreli)</div><div class="v" data-r="cur"></div><div class="bar" style="margin-top:6px"><span data-r="cbar"></span></div></div>
        </div>
      </div>
      <p class="live" data-r="msg" aria-live="polite"></p>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    const current = (v) => { const t = VTH[mat]; if (v < 0) return -0.02; if (v < t * 0.75) return 0; return Math.min(1, Math.exp((v - t) * 9) * 0.25); };
    function paint() {
      $$('[data-mat]', host).forEach((b) => b.classList.toggle('primary', b.dataset.mat === mat));
      const t = VTH[mat], i = current(V);
      R('vv').textContent = `${fmt(V, 2)} V ${V > 0 ? '(doğru polarma)' : V < 0 ? '(ters polarma)' : '(polarmasız)'}`;
      // boşaltılmış bölge genişliği
      const w = V >= 0 ? Math.max(6, 44 * (1 - V / (t * 1.15))) : Math.min(150, 44 + 10.5 * -V);
      const cx = 260;
      const holes = [], elec = [];
      for (let k = 0; k < 18; k++) {
        const x = 30 + (k % 6) * 30 + (Math.floor(k / 6) % 2) * 12, y = 40 + Math.floor(k / 6) * 34;
        if (x < cx - w / 2 - 8) holes.push(`<text x="${x}" y="${y}" font-size="16" font-weight="800" fill="var(--bad)" text-anchor="middle">+</text>`);
        const x2 = 2 * cx - x;
        if (x2 > cx + w / 2 + 8) elec.push(`<text x="${x2}" y="${y}" font-size="18" font-weight="800" fill="var(--info)" text-anchor="middle">−</text>`);
      }
      const flow = i > 0.02 ? `<line x1="40" y1="150" x2="480" y2="150" stroke="var(--accent)" stroke-width="4" stroke-dasharray="10 8" class="flowline" style="animation-duration:${(1.2 - i).toFixed(2)}s"/><text x="260" y="166" text-anchor="middle" font-size="11" fill="var(--accent)">akım akıyor</text>` : '';
      R('svg').innerHTML = `
        <rect x="10" y="12" width="${cx - 10}" height="120" fill="#f7d6d6" opacity=".55"/><rect x="${cx}" y="12" width="${cx - 10}" height="120" fill="#d6e2f7" opacity=".55"/>
        <rect x="${cx - w / 2}" y="12" width="${w}" height="120" fill="var(--surface-2)" stroke="var(--muted)" stroke-dasharray="4 3"/>
        <text x="${cx}" y="8" text-anchor="middle" font-size="10" fill="var(--muted)">boşaltılmış bölge</text>
        <text x="60" y="128" font-size="14" font-weight="800" fill="var(--ink)">P</text><text x="455" y="128" font-size="14" font-weight="800" fill="var(--ink)">N</text>
        ${holes.join('')}${elec.join('')}
        <text x="14" y="146" font-size="12" font-weight="700" fill="var(--ink)">${V > 0 ? '(+)' : V < 0 ? '(−)' : ''}</text><text x="490" y="146" font-size="12" font-weight="700" fill="var(--ink)">${V > 0 ? '(−)' : V < 0 ? '(+)' : ''}</text>${flow}`;
      // I-V eğrisi
      const px = (v) => 130 + (v / 1.2) * 115 * (v >= 0 ? 1 : 0) + (v < 0 ? (v / 10) * 115 : 0);
      const py = (c) => 120 - c * 105;
      let d = '';
      for (let v = -10; v <= 1.2001; v += 0.05) d += (d ? ' L' : 'M') + px(v).toFixed(1) + ' ' + py(current(v)).toFixed(1);
      R('iv').innerHTML = `<line x1="10" y1="120" x2="250" y2="120" stroke="var(--muted)"/><line x1="130" y1="10" x2="130" y2="160" stroke="var(--muted)"/>
        <text x="246" y="135" font-size="10" fill="var(--muted)" text-anchor="end">V →</text><text x="134" y="18" font-size="10" fill="var(--muted)">I</text>
        <text x="20" y="114" font-size="10" fill="var(--muted)">ters</text><text x="160" y="135" font-size="10" fill="var(--muted)">doğru</text>
        <line x1="${px(t)}" y1="116" x2="${px(t)}" y2="124" stroke="var(--accent)" stroke-width="2"/><text x="${px(t)}" y="150" font-size="10" text-anchor="middle" fill="var(--accent)">${fmt(t, 1)} V</text>
        <path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2.5"/>
        <circle cx="${px(V)}" cy="${py(i)}" r="6" fill="var(--accent)"/>`;
      R('cur').textContent = i < 0 ? 'çok küçük (µA)' : i === 0 ? '≈ 0' : fmt(i * 100, 0) + ' / 100';
      R('cbar').style.width = Math.max(0, i * 100) + '%';
      let st, msg;
      if (V < 0) { st = 'Ters polarma · kesim'; msg = `P’ye −, N’ye + bağlandı: boşaltılmış bölge <b>genişledi</b>; çoğunluk taşıyıcıları geçemiyor. Yalnızca azınlık taşıyıcılarından kaynaklanan çok küçük bir <b>ters doyma (sızıntı) akımı</b> var (genellikle birkaç µA’i aşmaz). Ters gerilim çok artırılırsa diyot bozulur: bu sınıra <b>PIV</b> (ters yön dayanma gerilimi) denir — ${mat === 'Si' ? 'silisyumda 1000 V’a yakın olabilir' : 'germanyumda en fazla 400 V civarı'}.`; }
      else if (V === 0) { st = 'Polarmasız'; msg = `Dış gerilim yok. Birleşim yüzeyinde iyonlar bir potansiyel engel oluşturdu: ${mat} için yaklaşık <b>${fmt(t, 1)} V</b>. Bu engel daha fazla elektron–oyuk birleşimini durdurur.`; }
      else if (V < t) { st = 'Doğru polarma · eşik altı'; msg = `P’ye +, N’ye − bağlandı; bölge daraldı ama gerilim henüz <b>${fmt(t, 1)} V</b> eşiğinin altında, akım çok küçük.`; }
      else { st = 'Doğru polarma · iletimde'; msg = `Eşik (${fmt(t, 1)} V) aşıldı: boşaltılmış bölge iyice daraldı, çoğunluk taşıyıcıları birleşimi geçiyor. Akım gerilimle <b>üstel</b> artar. İdeal diyot burada kısa devre gibi davranır.`; }
      R('st').textContent = st;
      R('msg').innerHTML = msg;
    }
    R('v').addEventListener('input', (e) => { V = Math.round(parseFloat(e.target.value) * 100) / 100; paint(); });
    host.addEventListener('click', (e) => { const b = e.target.closest('[data-mat]'); if (b) { mat = b.dataset.mat; paint(); } });
    paint();
  }

  /* ---------- Etkileşim 3: Transistör çalışma bölgeleri ---------- */
  function initBJT(root) {
    const host = $('#m4BJT', root);
    let type = 'NPN', be = 'ileri', bc = 'ters', ib = 20;
    host.innerHTML = `
      <p class="lab-hint">Beyz–emiter (B-E) ve beyz–kollektör (B-C) birleşimlerinin polarmasını seç; transistörün hangi bölgede çalıştığını gör. Aktif bölgede beyz akımını değiştir.</p>
      <div class="grid cols-2">
        <div>
          <div class="btn-row" role="group" aria-label="Transistör tipi"><span class="muted" style="font-size:.85rem">Tip:</span>
            <button type="button" class="btn small" data-t="NPN">NPN</button><button type="button" class="btn small" data-t="PNP">PNP</button></div>
          <div class="btn-row" role="group" aria-label="B-E polarması"><span class="muted" style="font-size:.85rem;min-width:44px">B-E:</span>
            <button type="button" class="btn small" data-be="ileri">ileri (doğru)</button><button type="button" class="btn small" data-be="ters">ters</button></div>
          <div class="btn-row" role="group" aria-label="B-C polarması"><span class="muted" style="font-size:.85rem;min-width:44px">B-C:</span>
            <button type="button" class="btn small" data-bc="ileri">ileri (doğru)</button><button type="button" class="btn small" data-bc="ters">ters</button></div>
          <label class="field" data-r="ibwrap">Beyz akımı I<sub>B</sub>: <span data-r="ibv"></span><input type="range" min="0" max="100" step="1" value="20" data-r="ib"></label>
        </div>
        <svg viewBox="0 0 220 220" role="img" aria-label="Transistör sembolü" style="width:100%;max-width:240px;display:block;margin:auto" data-r="sym"></svg>
      </div>
      <div class="readouts" data-r="vals"></div>
      <div class="live" data-r="msg" aria-live="polite"></div>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function region() {
      if (be === 'ters' && bc === 'ters') return 'kesim';
      if (be === 'ileri' && bc === 'ileri') return 'doyum';
      if (be === 'ileri' && bc === 'ters') return 'aktif';
      return 'yok';
    }
    function paint() {
      $$('[data-t]', host).forEach((b) => b.classList.toggle('primary', b.dataset.t === type));
      $$('[data-be]', host).forEach((b) => b.classList.toggle('primary', b.dataset.be === be));
      $$('[data-bc]', host).forEach((b) => b.classList.toggle('primary', b.dataset.bc === bc));
      const rg = region();
      R('ibwrap').style.display = rg === 'aktif' ? '' : 'none';
      R('ibv').textContent = ib + ' µA';
      // Sembol: emiter okunun yönü NPN'de dışa, PNP'de içe
      const on = rg === 'aktif' || rg === 'doyum';
      const arrow = type === 'NPN'
        ? '<polygon points="150,170 136,166 145,155" fill="var(--ink)"/>'
        : '<polygon points="118,140 132,144 123,155" fill="var(--ink)"/>';
      R('sym').innerHTML = `
        <circle cx="120" cy="110" r="62" fill="none" stroke="var(--muted)" stroke-width="2"/>
        <line x1="20" y1="110" x2="95" y2="110" stroke="var(--ink)" stroke-width="3"/><line x1="95" y1="70" x2="95" y2="150" stroke="var(--ink)" stroke-width="6"/>
        <line x1="95" y1="90" x2="150" y2="50" stroke="var(--ink)" stroke-width="3"/><line x1="150" y1="50" x2="150" y2="10" stroke="var(--ink)" stroke-width="3"/>
        <line x1="95" y1="130" x2="150" y2="170" stroke="var(--ink)" stroke-width="3"/><line x1="150" y1="170" x2="150" y2="212" stroke="var(--ink)" stroke-width="3"/>
        ${arrow}
        <text x="20" y="102" font-size="14" font-weight="800" fill="var(--ink)">B</text><text x="160" y="22" font-size="14" font-weight="800" fill="var(--ink)">C</text><text x="160" y="205" font-size="14" font-weight="800" fill="var(--ink)">E</text>
        ${on ? `<line x1="150" y1="12" x2="150" y2="210" stroke="var(--accent)" stroke-width="5" stroke-dasharray="8 7" class="flowline" style="animation-duration:${rg === 'doyum' ? 0.35 : (1.4 - ib / 100).toFixed(2)}s" opacity=".85"/>` : ''}
        <text x="200" y="115" font-size="11" fill="var(--muted)" text-anchor="end">${type}</text>`;
      let vals = '', msg = '';
      const carrier = type === 'NPN' ? 'elektronlar' : 'oyuklar';
      if (rg === 'aktif') {
        const ic = 99 * ib, ie = ib + ic;
        vals = `<div class="readout"><div class="k">I<sub>B</sub></div><div class="v">${ib} µA</div></div><div class="readout"><div class="k">I<sub>C</sub> ≈ 99 × I<sub>B</sub></div><div class="v">${fmt(ic / 1000, 2)} mA</div></div><div class="readout"><div class="k">I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></div><div class="v">${fmt(ie / 1000, 2)} mA</div></div>`;
        msg = `<b>Aktif bölge → yükselteç.</b> B-E ileri, B-C ters polarmalı. Emiterden çıkan ${carrier}ın yaklaşık <b>%99’u kollektöre</b>, yaklaşık <b>%1’i beyze</b> gider. Küçük beyz akımı, büyük kollektör akımını <b>kontrol eder</b>. Kirchhoff akım kanunu: <b>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></b>. Yükselteç için ayrıca V<sub>EB</sub> &lt; V<sub>CB</sub> olmalıdır.`;
      } else if (rg === 'kesim') {
        vals = '<div class="readout"><div class="k">Kollektör akımı</div><div class="v">≈ 0</div></div>';
        msg = '<b>Kesim bölgesi → açık anahtar.</b> B-E ve B-C ters polarmalı; transistörden hemen hemen hiç akım akmaz.';
      } else if (rg === 'doyum') {
        vals = '<div class="readout"><div class="k">Kollektör akımı</div><div class="v">en büyük değer</div></div>';
        msg = '<b>Doyum bölgesi → kapalı anahtar.</b> B-E ve B-C ileri polarmalı. Transistör taşıyabileceği en büyük akıma ulaşmıştır; giriş ne kadar artarsa artsın çıkış akımı artmaz. İdealde C-E arası kısa devre gibidir.';
      } else {
        msg = 'Bu kombinasyon (B-E ters, B-C ileri) ders notunda ele alınmıyor; notta anlatılan üç çalışma bölgesi kesim, doyum ve aktif bölgedir.';
      }
      R('vals').innerHTML = vals;
      R('msg').innerHTML = msg + `<br><span class="muted" style="font-size:.88rem">Sembolde emiterdeki ok, emiter akımının yönünü gösterir: ${type === 'NPN' ? 'NPN’de transistörden <b>dışarı</b> doğru.' : 'PNP’de transistöre <b>içeri</b> doğru.'}</span>`;
    }
    host.addEventListener('click', (e) => {
      const t = e.target.closest('[data-t]'), a = e.target.closest('[data-be]'), b = e.target.closest('[data-bc]');
      if (t) type = t.dataset.t; else if (a) be = a.dataset.be; else if (b) bc = b.dataset.bc; else return;
      paint();
    });
    R('ib').addEventListener('input', (e) => { ib = +e.target.value; paint(); });
    paint();
  }

      <svg viewBox="0 0 600 220" role="img" aria-label="Giriş ve çıkış dalga biçimi" style="width:100%;display:block;background:#0f1f19;border-radius:12px" data-r="scope"></svg>

    const R = (k) => $(`[data-r="${k}"]`, host);

    const rect = (ph) => { const s = Math.sin(ph); return kind === 'yok' ? s : kind === 'yarim' ? Math.max(0, s) : Math.abs(s); };
    function outPath() {
      let d = '', vPrev = 0;
      const tau = 0.9; // filtre için göreli boşalma
      for (let x = 0; x <= W; x += 3) {

        let v = rect(ph);

        vPrev = v;
        d += (d ? ' L' : 'M') + x + ' ' + (MID - v * AMP).toFixed(1);
      }
      return d;
    }
    function inPath() { let d = ''; for (let x = 0; x <= W; x += 4) d += (d ? ' L' : 'M') + x + ' ' + (MID - Math.sin((x / W) * PER * 2 * Math.PI) * AMP).toFixed(1); return d; }

        <line x1="0" y1="${MID}" x2="${W}" y2="${MID}" stroke="#3c5a4c"/>
        <path d="${inPath()}" fill="none" stroke="#7f9a8d" stroke-width="2" stroke-dasharray="6 5"/>
        <path d="${outPath()}" fill="none" stroke="#7dffb2" stroke-width="3"/>
        <line data-r="cursor" x1="0" y1="0" x2="0" y2="${H}" stroke="#ffbf47" stroke-width="2"/>
        <text x="8" y="16" font-size="12" fill="#9fb8ab">kesikli: trafo çıkışı (AC) · yeşil: alıcıya giden</text>`;
      const k = K[kind];
      R('nm').textContent = k.n;
      R('uo').innerHTML = k.u ? `${fmt(k.u, 2)} × ${Ug} ≈ <b>${fmt(k.u * Ug, 1)} V</b>` : 'DC yok (AC)';
      R('io').innerHTML = k.i ? `I<sub>çıkış</sub> = ${fmt(k.i, 3)} × I<sub>giriş</sub>` : '—';
      R('msg').innerHTML = (kind === 'yok' ? 'Trafo çıkışında yönü ve şiddeti sürekli değişen <b>AC</b> var. Türkiye’de frekans 50 Hz: akış yönü saniyede 100 kez değişir.'
        : kind === 'yarim' ? 'Diyot yalnız <b>pozitif alternansları</b> geçirir; negatif yarı kesilir. Çıkış tam düzgün değildir; trafonun verebileceğinin yaklaşık yarısı (U<sub>çıkış</sub> = 0,45 · U<sub>giriş</sub>) alınır. Küçük akımlı (50–250 mA), hassas olmayan alıcılar (oyuncak, zil, mini radyo) için uygundur.'
          : kind === 'orta' ? 'Orta uçlu trafo iki ters polariteli gerilim üretir. A ucu pozitifken <b>D1</b>, B ucu pozitifken <b>D2</b> iletir; alıcıdan hep <b>aynı yönde</b> akım geçer. U<sub>çıkış</sub> = 0,9 · U<sub>giriş</sub>.'
            : 'AC’yi en iyi şekilde DC’ye çeviren devre. A ucu pozitifken <b>D1 ve D3</b>, B ucu pozitifken <b>D2 ve D4</b> iletir. U<sub>çıkış</sub> = 0,9 · U<sub>giriş</sub>. Her türlü elektronik cihazın besleme katında bulunur.') +
        (filt && kind !== 'yok' ? ' <b>Filtre açık:</b> kondansatör tepe noktalarında dolup çukurlarda boşalarak dalgalanmayı (ripple) azaltır; çıkış tam doğru akıma yaklaşır.' : (kind !== 'yok' ? ' Elde edilen DC <b>dalgalıdır</b> (ripple yüksek). Filtreyi aç ve farkı gör.' : ''));
    }
    function diodes(ph) {
      const pos = Math.sin(ph) >= 0;
      const chip = (n, on) => `<span class="chip ${on ? 'ok' : ''}">${n}${on ? ' iletimde' : ' kesimde'}</span>`;
      if (kind === 'yok') return '<span class="muted" style="font-size:.85rem">Diyot yok.</span>';
      if (kind === 'yarim') return chip('D', pos);
      if (kind === 'orta') return chip('D1', pos) + chip('D2', !pos);
      return chip('D1', pos) + chip('D3', pos) + chip('D2', !pos) + chip('D4', !pos);
    }
    let x = 0, last = performance.now(), lastPos = null;
    function frame(t) {

      { id: 'transistor', tag: 'Temel kavramlar + etkileşim', title: 'Transistör: yükselteç ve anahtar', minutes: 4, init: initBJT, html: `
        <p>İki N tipi arasına bir P tipi (<b>NPN</b>) veya iki P tipi arasına bir N tipi (<b>PNP</b>) yerleştirilerek yapılan üç bacaklı elemana <span class="term">transistör</span> denir. Bacakları: <b>Emiter</b> (E, yayıcı), <b>Beyz</b> (B, taban), <b>Kollektör</b> (C, toplayıcı). Üç amaçla kullanılır: <b>yükseltme, akım kontrolü ve anahtarlama</b>.</p>
        <p>Yapım tekniğine göre türler: bipolar (BJT), foto transistör, unijonksiyon (UJT), alan etkili (FET) ve metal oksit yarı iletken alan etkili (MOSFET). Bu modülde BJT’ye odaklanıyoruz.</p>

            <tr><td><b>Aktif</b></td><td>ileri</td><td>ters</td><td>Girişteki sinyali belli oranda büyütür → <b>yükselteç</b></td></tr>
          </tbody></table></div>

          <span class="limit">Transistör enerji üretmez; büyük akım besleme kaynağından gelir, transistör yalnızca onu denetler. Ayrıca doyumda beyz akımını daha da artırmak çıkışı büyütmez.</span></div>

      { id: 'guc', tag: 'Temel kavramlar + etkileşim', title: 'DC güç kaynakları: trafo, doğrultmaç, filtre, regüle', minutes: 5, init: initRect, html: `
        <div class="grid cols-2">

          <div class="card"><b>Alternatif akım (AC)</b><p class="mt0">Alternatörler üretir; yön ve şiddeti sürekli değişir (sinüs). Türkiye’de <b>50 Hz</b>. Elektriğin yaklaşık %90’ı AC üretilir, çünkü taşınması, yükseltilmesi ve düşürülmesi kolaydır.</p></div>

/* =========================================================
   MODÜL 5 — İşlemciler ve Modern Hesaplama Mimarileri
   Kaynak: Hafta 4 ders notu
   ========================================================= */
(function () {

  /* ---------- Etkileşim 1: Boru hattı (pipeline) ---------- */
  function initPipeline(root) {
    const host = $('#m5Pipe', root);
    const STAGES = ['Getir', 'Çöz', 'Yürüt', 'Sakla'];
    const COLORS = ['#a24e07', '#1f4fbf', '#0d6b53', '#7b4bb7'];
    const NI = 4;
    let mode = 'seq', cyc = 0, playing = false;
    const total = () => (mode === 'seq' ? NI * STAGES.length : NI + STAGES.length - 1);
    // komut i, aşama s → hangi çevrimde (1 tabanlı)
    const when = (i, s) => (mode === 'seq' ? i * STAGES.length + s + 1 : i + s + 1);
    host.innerHTML = `
      <p class="lab-hint">4 komut, her biri 4 aşamadan geçiyor. Önce <b>ardışık</b> çalıştır (bir komut tamamen bitmeden diğeri başlamaz), sonra <b>boru hattı</b> ile karşılaştır. <i>(Kavramsal model: her aşama 1 çevrim.)</i></p>
      <div class="btn-row" role="group" aria-label="Çalışma biçimi">
        <button type="button" class="btn small" data-mode="seq">Ardışık (boru hattı yok)</button>
        <button type="button" class="btn small" data-mode="pipe">Boru hattı (pipeline)</button>
      </div>
      <div class="table-wrap"><table class="memtable" data-r="grid" aria-label="Çevrim tablosu"></table></div>
      <div class="btn-row">
        <button type="button" class="btn small primary" data-a="step">▶ Bir çevrim</button>
        <button type="button" class="btn small" data-a="play">⏵ Otomatik</button>
        <button type="button" class="btn small ghost" data-a="reset">↺ Sıfırla</button>
        <span class="score-pill" data-r="cnt" aria-live="polite"></span>
      </div>
      <p class="live" data-r="msg" aria-live="polite"></p>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function paint() {
      $$('[data-mode]', host).forEach((b) => b.classList.toggle('primary', b.dataset.mode === mode));
      const T = 16;
      let h = `<thead><tr><th>Komut</th>${Array.from({ length: T }, (_, c) => `<th style="text-align:center;padding:4px">${c + 1}</th>`).join('')}</tr></thead><tbody>`;
      for (let i = 0; i < NI; i++) {
        h += `<tr><td>K${i + 1}</td>`;
        for (let c = 1; c <= T; c++) {
          const s = STAGES.findIndex((_, k) => when(i, k) === c);
          const show = s >= 0 && c <= cyc;
          h += `<td style="padding:3px;text-align:center;font-size:.72rem;${show ? `background:${COLORS[s]};color:#fff;font-weight:700` : ''}">${show ? STAGES[s].slice(0, 3) : ''}</td>`;
        }
        h += '</tr>';
      }
      R('grid').innerHTML = h + '</tbody>';
      const done = cyc >= total();
      R('cnt').textContent = `Çevrim: ${cyc} / ${total()}${done ? ' ✓' : ''}`;
      R('msg').innerHTML = done
        ? (mode === 'seq' ? `Ardışık çalışmada 4 komut <b>${total()} çevrim</b> sürdü. Şimdi <b>Boru hattı</b>’nı seç ve karşılaştır.`
          : `Boru hattıyla aynı 4 komut <b>${total()} çevrimde</b> bitti (ardışıkta 16). Her çevrimde farklı komutlar <b>farklı aşamalardaydı</b>. Modern işlemciler bunu daha çok aşamaya böler; ayrıca superscalar (bir çevrimde birden çok komut), sıra dışı yürütme ve dallanma kestirimi kullanır.`)
        : (cyc ? `Çevrim ${cyc}: ` + Array.from({ length: NI }, (_, i) => { const s = STAGES.findIndex((_, k) => when(i, k) === cyc); return s >= 0 ? `K${i + 1} → ${STAGES[s]}` : null; }).filter(Boolean).join(', ') : 'Başlamak için <b>Bir çevrim</b>’e bas.');
    }
    async function play() {
      if (playing) return; playing = true; const tok = NAV_TOKEN;
      if (cyc >= total()) cyc = 0;
      while (playing && alive(tok) && cyc < total()) { cyc++; paint(); await Motion.wait(550); }
      playing = false;
    }
    host.addEventListener('click', (e) => {
      const m = e.target.closest('[data-mode]');
      if (m) { mode = m.dataset.mode; cyc = 0; playing = false; paint(); return; }
      const a = e.target.closest('[data-a]'); if (!a) return;
      if (a.dataset.a === 'step') { playing = false; if (cyc < total()) cyc++; paint(); }
      else if (a.dataset.a === 'play') play();
      else { playing = false; cyc = 0; paint(); }
    });
    paint();
  }

  /* ---------- Etkileşim 2: Saat × çarpan ve GHz ≠ performans ---------- */
  function initClock(root) {
    const host = $('#m5Clock', root);
    let bclk = 100, mult = 40, fa = 5.0, fb = 4.5, ia = 4, ib = 5;
    host.innerHTML = `
      <h4 class="mt0">1) İşlemci frekansı = dış (temel) saat × çarpan</h4>
      <div class="grid cols-2">
        <label class="field">Dış saat / BCLK
          <select data-r="bclk"><option value="66">66 MHz (ders notundaki tarihsel örnek)</option><option value="100" selected>100 MHz</option><option value="133">133 MHz</option></select></label>
        <label class="field">Çarpan: <b data-r="mv"></b><input type="range" min="2" max="60" step="1" value="40" data-r="mult"></label>
      </div>
      <p class="live" data-r="f" aria-live="polite"></p>
      <h4>2) Frekans tek başına performans değildir</h4>
      <p class="lab-hint mt0">Bir çevrimde yapılan yararlı iş (IPC) farklıysa, daha düşük GHz’li işlemci daha fazla iş yapabilir. Kaydırıcılarla dene. <i>(Kavramsal: iş ≈ frekans × IPC; gerçek performans ayrıca önbellek, bellek, güç/ısı ve iş yüküne bağlıdır.)</i></p>
      <div class="grid cols-2">
        <div class="card" style="margin:0"><b>İşlemci A</b>
          <label class="field">Frekans: <span data-r="fav"></span><input type="range" min="2" max="6" step="0.1" value="5" data-r="fa"></label>
          <label class="field">IPC (göreli): <span data-r="iav"></span><input type="range" min="1" max="8" step="0.5" value="4" data-r="ia"></label></div>
        <div class="card" style="margin:0"><b>İşlemci B</b>
          <label class="field">Frekans: <span data-r="fbv"></span><input type="range" min="2" max="6" step="0.1" value="4.5" data-r="fb"></label>
          <label class="field">IPC (göreli): <span data-r="ibv"></span><input type="range" min="1" max="8" step="0.5" value="5" data-r="ib"></label></div>
      </div>
      <div style="margin-top:12px" aria-hidden="true">
        <div class="muted" style="font-size:.85rem">A</div><div class="bar" style="height:18px"><span data-r="ba" style="background:var(--accent)"></span></div>
        <div class="muted" style="font-size:.85rem;margin-top:6px">B</div><div class="bar" style="height:18px"><span data-r="bb"></span></div>
      </div>
      <p class="live" data-r="race" aria-live="polite"></p>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function paint() {
      const mhz = bclk * mult;
      R('mv').textContent = '×' + mult;
      R('f').innerHTML = `${bclk} MHz × ${mult} = <b>${fmt(mhz, 0)} MHz = ${fmt(mhz / 1000, 2)} GHz</b>. Bu, saniyede ${fmt(mhz / 1000, 2)} × 10⁹ <b>saat çevrimi</b> demektir; saniyede o kadar program komutu demek <b>değildir</b>. Modern işlemcilerde frekans sabit değildir: güç, sıcaklık, akım sınırı ve etkin çekirdek sayısına göre <b>boost/turbo</b> ile dinamik değişir.`;
      R('fav').textContent = fmt(fa, 1) + ' GHz'; R('fbv').textContent = fmt(fb, 1) + ' GHz';
      R('iav').textContent = fmt(ia, 1); R('ibv').textContent = fmt(ib, 1);
      const A = fa * ia, B = fb * ib, mx = Math.max(A, B);
      R('ba').style.width = (A / mx) * 100 + '%'; R('bb').style.width = (B / mx) * 100 + '%';
      const win = A > B ? 'A' : B > A ? 'B' : null;
      R('race').innerHTML = `A: ${fmt(fa, 1)} × ${fmt(ia, 1)} = <b>${fmt(A, 1)}</b> · B: ${fmt(fb, 1)} × ${fmt(ib, 1)} = <b>${fmt(B, 1)}</b> (göreli iş). ` +
        (win ? `Bu ayarlarda <b>${win}</b> daha fazla iş yapıyor${(win === 'B' && fb < fa) || (win === 'A' && fa < fb) ? ' — <b>daha düşük GHz’e rağmen!</b>' : '.'}` : 'Eşit.');
    }
    host.addEventListener('input', (e) => {
      const k = e.target.dataset.r, v = parseFloat(e.target.value);
      if (k === 'mult') mult = v; else if (k === 'fa') fa = v; else if (k === 'fb') fb = v; else if (k === 'ia') ia = v; else if (k === 'ib') ib = v; else return;
      paint();
    });
    R('bclk').addEventListener('change', (e) => { bclk = +e.target.value; paint(); });
    paint();
  }

        const active = load === 'par' || c === 0;
        const cells = Array(SLOTS).fill('');
        if (active) {
          for (let s = 0; s < SLOTS; s++) if (Math.random() < 0.55) cells[s] = 'A';
          if (smt && load === 'par') for (let s = 0; s < SLOTS; s++) if (!cells[s] && Math.random() < 0.6) cells[s] = 'B';
        }
        const u = cells.filter(Boolean).length; used += u; totalSlots += SLOTS;
        html += `<div class="sim-panel" style="padding:8px 10px"><div style="display:flex;justify-content:space-between;font-size:.8rem;font-weight:700"><span>Çekirdek ${c}</span><span class="muted">${active ? (smt && load === 'par' ? '2 iş parçacığı' : '1 iş parçacığı') : 'boşta'}</span></div>
          <div style="display:grid;grid-template-columns:repeat(${SLOTS},1fr);gap:3px;margin-top:6px">${cells.map((x) => `<span style="height:18px;border-radius:4px;border:1px solid var(--line);background:${x === 'A' ? 'var(--accent)' : x === 'B' ? 'var(--info)' : 'var(--surface-2)'}"></span>`).join('')}</div></div>`;
      }
      coreBox.innerHTML = html;
      R('ut').textContent = '%' + Math.round((used / totalSlots) * 100);
    }
    function texts() {
      R('pc').textContent = cores;
      R('lc').textContent = smt ? cores * 2 : cores;
      $('[data-a="smt"]', host).textContent = `SMT / Hyper-Threading: ${smt ? 'AÇIK' : 'KAPALI'}`;
      $('[data-a="smt"]', host).setAttribute('aria-pressed', String(smt));
      $('[data-a="smt"]', host).classList.toggle('primary', smt);
      $('[data-a="load"]', host).textContent = `İş yükü: ${load === 'par' ? 'paralel' : 'seri (tek iş parçacığı)'}`;
      R('msg').innerHTML = load === 'ser'
        ? `<b>Seri iş yükü:</b> Program işini parçalara bölemiyor; yalnız tek çekirdek çalışıyor, diğerleri boşta. Çekirdek ya da thread sayısı artsa da bu programın hızı pek değişmez. Çok çekirdeğin avantajı, yazılımın işi <b>paralelleştirebilmesine</b> bağlıdır.`
        : smt ? `<b>SMT açık:</b> Her fiziksel çekirdek, yürütme kaynaklarını <b>iki donanımsal iş parçacığı</b> arasında paylaşıyor; A’nın boş bıraktığı kutuları B dolduruyor. İşletim sistemi ${cores * 2} mantıksal işlemci görüyor ama <b>fiziksel çekirdek hâlâ ${cores}</b>. Kazanç iki kat değil; iş yüküne ve paylaşılan kaynaklara bağlı.`
          : `<b>SMT kapalı:</b> Her çekirdekte tek iş parçacığı var; bazı yürütme kaynakları boş kalıyor. SMT’yi açıp boş kutuların nasıl azaldığına bak.`;
    }
    async function loop() {
      while (alive(tok) && document.body.contains(host)) {
        if (running) frame();
        await new Promise((r) => setTimeout(r, Motion.reduced() ? 2000 : 900));
      }
    }
    sel.addEventListener('change', (e) => { cores = +e.target.value; texts(); frame(); });
    host.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]'); if (!a) return;
      if (a.dataset.a === 'smt') smt = !smt;
      else if (a.dataset.a === 'load') load = load === 'par' ? 'ser' : 'par';
      else if (a.dataset.a === 'pause') { running = !running; a.textContent = running ? '⏸ Duraklat' : '⏵ Devam'; return; }
      texts(); frame();
    });
    texts(); frame(); loop();
  }

  registerModule({
