/* =========================================================
   MODÜL 8 — Depolama Sistemleri, RAID ve Veri Güvenliği
   Kaynak: Hafta 7 ders notu
   ========================================================= */
(function () {

  /* ---------- Etkileşim 1: HDD dönme gecikmesi ---------- */
  function initHDD(root) {
    const host = $('#m8HDD', root);
    let rpm = 7200;
    host.innerHTML = `
      <p class="lab-hint">Plaka bir tur dönmeden istenen sektör kafanın altına gelmeyebilir. Ortalamada <b>yarım tur</b> beklenir: ortalama dönme gecikmesi (ms) = 0,5 × 60.000 / devir. <i>(Animasyon çok yavaşlatılmıştır.)</i></p>
      <div class="btn-row" role="group" aria-label="Dönüş hızı">${[5400, 7200, 10000, 15000].map((r) => `<button type="button" class="btn small" data-rpm="${r}">${fmt(r, 0)} dev/dak</button>`).join('')}</div>
      <div class="grid cols-2">
        <svg viewBox="0 0 220 220" role="img" aria-label="Dönen HDD plakası ve okuma-yazma kafası" style="width:100%;max-width:240px;display:block;margin:auto">
          <circle cx="110" cy="110" r="100" fill="#9aa5ad" stroke="#6b7680" stroke-width="3"/>
          <g data-r="platter" style="transform-origin:110px 110px">
            ${[85, 65, 45].map((r) => `<circle cx="110" cy="110" r="${r}" fill="none" stroke="#c4ccd2" stroke-width="2"/>`).join('')}
            <path d="M110 110 L110 25 A85 85 0 0 1 150 35 Z" fill="var(--accent)" opacity=".85"/>
            <text x="128" y="45" font-size="10" fill="#fff" font-weight="800">sektör</text>
          </g>
          <circle cx="110" cy="110" r="14" fill="#56616a"/>
          <path d="M210 200 L150 70" stroke="#2b3036" stroke-width="7" stroke-linecap="round"/><circle cx="150" cy="70" r="6" fill="#ffbf47"/>
          <text x="196" y="214" font-size="10" fill="var(--muted)" text-anchor="end">kafa (plakaya değmez)</text>
        </svg>
        <div class="readouts" style="align-content:start">
          <div class="readout"><div class="k">Ortalama dönme gecikmesi</div><div class="v" data-r="lat"></div></div>
          <div class="readout"><div class="k">“1 ns = 1 saniye” ölçeğinde</div><div class="v sm" data-r="scale"></div></div>
        </div>
      </div>
      <p class="live" data-r="msg" aria-live="polite"></p>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function paint() {
      $$('[data-rpm]', host).forEach((b) => b.classList.toggle('primary', +b.dataset.rpm === rpm));
      const ms = 30000 / rpm;
      R('lat').textContent = fmt(ms, 2) + ' ms';
      const days = (ms * 1e6) / 86400; // ms → ns; 1 ns = 1 s
      R('scale').innerHTML = `RAM CAS (~10 ns) = 10 saniye<br>Bu dönme gecikmesi ≈ <b>${fmt(days, 0)} gün</b>`;
      R('platter').style.animation = `spin ${(rpm ? 432000 / rpm / 60 : 1).toFixed(2)}s linear infinite`;
      R('msg').innerHTML = `${fmt(rpm, 0)} dev/dak → 0,5 × 60.000 / ${fmt(rpm, 0)} = <b>${fmt(ms, 2)} ms</b>. ` +
        (rpm <= 7200 ? '5400 ve 7200 dev/dak diskler genellikle dizüstü ve masaüstünde kullanılır.' : '10.000 ve üzeri dev/dak diskler hızlı ve maliyetli oldukları için sunucularda kullanılır.') +
        ' Gerçek erişim süresi ayrıca <b>kafa hareketi, denetleyici işlemleri ve aktarım süresini</b> içerir. Bu yüzden rastgele erişimde SSD’ler HDD’lerden çok daha hızlıdır.';
    }
    host.addEventListener('click', (e) => { const b = e.target.closest('[data-rpm]'); if (b) { rpm = +b.dataset.rpm; paint(); } });
    paint();
  }

  /* ---------- Etkileşim 2: SSD dayanıklılık (TBW / DWPD) ---------- */
  function initSSD(root) {
    const host = $('#m8SSD', root);
    const st = { cap: 1, tbw: 600, yrs: 5, daily: 50 };
    host.innerHTML = `
      <p class="lab-hint">DWPD = TBW ÷ (kapasite × 365 × garanti yılı). Ders notundaki örnek hazır yüklü: 1 TB, 600 TBW, 5 yıl.</p>
      <div class="grid cols-2">
        <label class="field">Kapasite (TB)<input type="number" min="0.1" step="0.1" data-k="cap"></label>
        <label class="field">TBW (garanti süresince toplam yazma, TB)<input type="number" min="1" step="10" data-k="tbw"></label>
        <label class="field">Garanti süresi (yıl)<input type="number" min="1" max="10" step="1" data-k="yrs"></label>
        <label class="field">Senin günlük yazma miktarın (GB/gün)<input type="number" min="1" step="5" data-k="daily"></label>
      </div>
      <div class="readouts"><div class="readout"><div class="k">DWPD</div><div class="v" data-r="dwpd"></div></div><div class="readout"><div class="k">Bu kullanımla TBW’ye ulaşma</div><div class="v sm" data-r="yrs"></div></div></div>
      <p class="live" data-r="msg" aria-live="polite"></p>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function paint() {
      Object.keys(st).forEach((k) => { const i = $(`[data-k="${k}"]`, host); if (document.activeElement !== i) i.value = st[k]; });
      const d = st.tbw / (st.cap * 365 * st.yrs);
      const y = (st.tbw * 1000) / (st.daily * 365);
      R('dwpd').textContent = fmt(d, 2);
      R('yrs').innerHTML = `≈ <b>${fmt(y, 1)} yıl</b>`;
      R('msg').innerHTML = `${fmt(st.tbw, 0)} ÷ (${fmt(st.cap, 2)} × 365 × ${st.yrs}) = <b>${fmt(d, 2)} DWPD</b>: garanti boyunca sürücü kapasitesinin günde yaklaşık ${fmt(d, 2)} katı yazılabilir. Günde ${fmt(st.daily, 0)} GB yazarsan TBW’ye yaklaşık ${fmt(y, 1)} yılda ulaşırsın. <b>TBW kesin arıza zamanı değildir</b>, bir dayanıklılık göstergesidir; dayanıklılık hesabı yedekleme ihtiyacını ortadan kaldırmaz.`;
    }
    host.addEventListener('input', (e) => { const k = e.target.dataset.k; const v = parseFloat(e.target.value); if (k && v > 0) { st[k] = v; paint(); } });
    paint();
  }

  /* ---------- Etkileşim 3: RAID görsel hesaplayıcı ---------- */
  function initRAID(root) {
    const host = $('#m8RAID', root);
    const LV = {
      0: { min: 2, max: 8, cap: (n) => n, tol: '0', note: 'Şeritleme (striping): veri bloklara bölünüp disklere dağıtılır. Hız ve tam kapasite; ama <b>tek disk kaybı bütün diziyi kaybettirir</b>.' },
      1: { min: 2, max: 2, cap: () => 1, tol: '1 disk', note: 'Aynalama (mirroring): her blok iki diskte. Kapasite verimi düşük (S), güvenilirlik yüksek.' },
      5: { min: 3, max: 8, cap: (n) => n - 1, tol: '1 disk', note: 'Tek parity, diskler arasında <b>dağıtılır</b>. Eksik blok kalan veri ve parity ile <b>XOR</b> kullanılarak hesaplanır. Küçük rastgele yazmada okuma-değiştir-yaz cezası; rebuild riski.' },
      6: { min: 4, max: 8, cap: (n) => n - 2, tol: '2 disk', note: 'Çift parity (P ve Q): iki bağımsız kurtarma bilgisi. Büyük dizilerde daha yüksek dayanım.' },
      10: { min: 4, max: 8, cap: (n) => n / 2, tol: 'her aynada 1 (dağılıma bağlı)', note: 'Aynaların şeritlenmesi: iyi performans. “İki disk arızasına dayanır” genellemesi yanlıştır; <b>aynı ayna çiftindeki iki disk</b> giderse dizi durur.' }
    };
    let lvl = 5, n = 4, S = 2, failed = new Set();
    host.innerHTML = `
      <p class="lab-hint">Düzeyi, disk sayısını ve disk boyutunu seç. Sonra bir diske tıklayarak onu <b>bozuk</b> işaretle ve dizinin ayakta kalıp kalmadığını gör.</p>
      <div class="btn-row" role="group" aria-label="RAID düzeyi">${[0, 1, 5, 6, 10].map((l) => `<button type="button" class="btn small" data-l="${l}">RAID ${l}</button>`).join('')}</div>
      <div class="grid cols-2">
        <label class="field">Disk sayısı (n): <b data-r="nv"></b><input type="range" min="2" max="8" step="1" data-r="n"></label>
        <label class="field">Disk boyutu S (TB)<select data-r="s">${[1, 2, 4, 8, 12, 20].map((x) => `<option ${x === 2 ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
      </div>
      <div class="readouts">
        <div class="readout"><div class="k">Kullanılabilir kapasite</div><div class="v" data-r="cap"></div></div>
        <div class="readout"><div class="k">Hacim verimi</div><div class="v" data-r="eff"></div></div>
        <div class="readout"><div class="k">Aksaklık dayanıklılığı</div><div class="v sm" data-r="tol"></div></div>
        <div class="readout"><div class="k">Dizi durumu</div><div class="v sm" data-r="state"></div></div>
      </div>
      <div data-r="disks" style="display:grid;gap:8px;margin-top:12px"></div>
      <div class="btn-row">
        <button type="button" class="btn small ghost" data-a="heal">↺ Tüm diskleri onar</button>
        <button type="button" class="btn small again" data-a="delete">🗑️ Bir dosyayı yanlışlıkla sil</button>
      </div>
      <p class="live" data-r="msg" aria-live="polite"></p>
      <h4>Karşılaştırma (n = <span data-r="n2"></span>, S = <span data-r="s2"></span> TB)</h4>
      <div class="table-wrap"><table><thead><tr><th>Düzey</th><th>Asgari disk</th><th>Kapasite</th><th>Verim</th><th>Tolerans</th><th>Öne çıkan</th></tr></thead><tbody data-r="cmp"></tbody></table></div>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function blocks(r, d) {
      if (lvl === 0) return { t: `D${r * n + d + 1}`, c: 'd' };
      if (lvl === 1) return { t: `D${r + 1}`, c: d ? 'm' : 'd' };
      if (lvl === 10) { const p = Math.floor(d / 2), pairs = n / 2; return { t: `D${r * pairs + p + 1}`, c: d % 2 ? 'm' : 'd' }; }
      const pIdx = (n - 1 - (r % n) + n) % n, qIdx = (pIdx - 1 + n) % n;
      if (d === pIdx) return { t: `P${r + 1}`, c: 'p' };
      if (lvl === 6 && d === qIdx) return { t: `Q${r + 1}`, c: 'q' };
      const dataDisks = [...Array(n).keys()].filter((x) => x !== pIdx && !(lvl === 6 && x === qIdx));
      const per = dataDisks.length;
      return { t: `D${r * per + dataDisks.indexOf(d) + 1}`, c: 'd' };
    }
    function survives() {
      const f = failed.size;
      if (lvl === 0) return f === 0;
      if (lvl === 1) return f < 2;
      if (lvl === 5) return f <= 1;
      if (lvl === 6) return f <= 2;
      for (let p = 0; p < n; p += 2) if (failed.has(p) && failed.has(p + 1)) return false;
      return true;
    }
    function paint(extra) {
      const L = LV[lvl];
      n = clamp(n, L.min, L.max); if (lvl === 10 && n % 2) n++;
      [...failed].forEach((d) => { if (d >= n) failed.delete(d); });
      $$('[data-l]', host).forEach((b) => b.classList.toggle('primary', +b.dataset.l === lvl));
      const sl = R('n'); sl.min = L.min; sl.max = L.max; sl.step = lvl === 10 ? 2 : 1; sl.value = n; sl.disabled = L.min === L.max;
      R('nv').textContent = n + (lvl === 1 ? ' (ders notundaki RAID 1: 2 disk)' : '');
      const cap = L.cap(n) * S;
      R('cap').textContent = fmt(cap, 1) + ' TB';
      R('eff').textContent = '%' + Math.round((L.cap(n) / n) * 100);
      R('tol').textContent = L.tol;
      const ok = survives();
      R('state').innerHTML = !failed.size ? '✅ Sağlıklı' : ok ? '⚠️ Bozulmuş (degraded), çalışıyor' : '❌ Dizi kayboldu';
      const color = { d: 'var(--info-soft)', m: 'var(--info-soft)', p: 'var(--accent-soft)', q: '#ead9f7' };
      R('disks').style.gridTemplateColumns = `repeat(${n}, minmax(0, 1fr))`;
      R('disks').innerHTML = Array.from({ length: n }, (_, d) => {
        const bad = failed.has(d);
        const pair = lvl === 10 ? `<div class="muted" style="font-size:.68rem">ayna ${Math.floor(d / 2) + 1}</div>` : '';
        return `<button type="button" class="sim-panel" data-d="${d}" aria-pressed="${bad}" aria-label="Disk ${d + 1}${bad ? ', bozuk' : ''}. Bozuk işaretlemek veya onarmak için bas." style="cursor:pointer;padding:6px;text-align:center;${bad ? 'border-color:var(--bad);background:var(--bad-soft)' : ''}">
          <div style="font-weight:800;font-size:.8rem">${bad ? '💥 ' : '💽 '}Disk ${d + 1}</div>${pair}
          ${[0, 1, 2].map((r) => { const b = blocks(r, d); return `<div style="margin-top:4px;border-radius:5px;padding:2px 0;font-family:var(--mono);font-size:.75rem;font-weight:700;background:${bad ? 'repeating-linear-gradient(45deg,var(--bad-soft),var(--bad-soft) 4px,var(--surface) 4px,var(--surface) 8px)' : color[b.c]};${b.c === 'm' ? 'font-style:italic' : ''};${bad ? 'text-decoration:line-through;opacity:.6' : ''}">${b.t}</div>`; }).join('')}
        </button>`;
      }).join('');
      R('msg').innerHTML = extra || (L.note + (failed.size ? (ok ? ' <br>Dizi ayakta: bozuk diskteki bloklar ' + (lvl === 1 || lvl === 10 ? '<b>ayna kopyadan</b>' : '<b>parity ile</b>') + ' elde edilebilir. Disk değiştirilince <b>rebuild</b> tüm sağlıklı üyeleri okur; büyük disklerde uzun sürer, performans düşer ve ikinci arıza riski artar.' : ' <br><b>Veri kaybı!</b> Kalan disklerden bilgi yeniden oluşturulamaz. Yedeğin yoksa veri gitti.') : ''));
      R('n2').textContent = n; R('s2').textContent = S;
      R('cmp').innerHTML = [0, 1, 5, 6, 10].map((l) => {
        const X = LV[l]; const nn = l === 1 ? 2 : (l === 10 && n % 2 ? n + 1 : Math.max(n, X.min));
        return `<tr ${l === lvl ? 'style="background:var(--accent-soft)"' : ''}><td><b>RAID ${l}</b></td><td>${X.min}</td><td>${fmt(X.cap(nn) * S, 1)} TB${nn !== n ? ` <span class="muted">(n=${nn})</span>` : ''}</td><td>%${Math.round((X.cap(nn) / nn) * 100)}</td><td>${X.tol}</td><td>${{ 0: 'Hız', 1: 'Güvenilirlik', 5: 'Hız + güvenilirlik', 6: 'Çift parity', 10: 'Performans + ayna' }[l]}</td></tr>`;
      }).join('');
    }
    host.addEventListener('click', (e) => {
      const l = e.target.closest('[data-l]'); if (l) { lvl = +l.dataset.l; failed.clear(); paint(); return; }
      const d = e.target.closest('[data-d]'); if (d) { const i = +d.dataset.d; failed.has(i) ? failed.delete(i) : failed.add(i); paint(); const nb = $(`[data-d="${i}"]`, host); if (nb) nb.focus(); return; }
      const a = e.target.closest('[data-a]'); if (!a) return;
      if (a.dataset.a === 'heal') { failed.clear(); paint(); }
      else { failed.clear(); paint('🗑️ <b>Dosya silindi</b> ve RAID bu silme işlemini <b>bütün disklere anında</b> yazdı; tıpkı normal bir yazma gibi. Hiçbir disk bozulmadı, dizi sağlıklı… ama dosya yok. Yanlış silme, fidye yazılımı, dosya bozulması, denetleyici arızası veya yangın karşısında RAID eski sürümü getirmez: <b>RAID bir yedekleme yöntemi değildir.</b>'); $$('[data-d]', host).forEach((x) => flash(x, 1200)); }
    });
    R('n').addEventListener('input', (e) => { n = +e.target.value; paint(); });
    R('s').addEventListener('change', (e) => { S = +e.target.value; paint(); });
    paint();
  }

  /* ---------- Etkileşim 4: 3-2-1 yedek planlayıcı ---------- */
  function initBackup(root) {
    const host = $('#m8Backup', root);
    const ITEMS = [
      { k: 'orig', n: '💻 Dizüstü SSD (orijinal veri)', media: 'SSD', site: 'ev', online: true, sync: false, versioned: false, fixed: true },
      { k: 'ext', n: '🔌 Harici disk – sürekli takılı, otomatik kopya (sürümsüz)', media: 'HDD', site: 'ev', online: true, sync: true, versioned: false },
      { k: 'off', n: '📦 Harici disk – haftalık yedek, sonra çıkarılıyor (çevrimdışı)', media: 'HDD', site: 'ev', online: false, sync: false, versioned: false },
      { k: 'csync', n: '☁️ Bulut klasör eşitleme (senkronizasyon)', media: 'Bulut', site: 'dış', online: true, sync: true, versioned: false },
      { k: 'cver', n: '🗄️ Bulut yedekleme, sürümlü (geçmiş sürümler saklanıyor)', media: 'Bulut', site: 'dış', online: true, sync: false, versioned: true },

      </fieldset>
      <svg viewBox="0 0 560 120" role="img" aria-label="3-2-1 kuralı şeması" style="width:100%;display:block;margin:12px auto 4px" data-r="svg"></svg>

      <div class="box" data-r="res" aria-live="polite" style="display:none"></div>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function chosen() { return ITEMS.filter((it) => on.has(it.k)); }
    function paint() {
      const c = chosen();
      const copies = c.length, media = new Set(c.map((x) => x.media)).size, offsite = c.some((x) => x.site === 'dış'), offline = c.some((x) => !x.online), versioned = c.some((x) => x.versioned || !x.online);
      const big = (x, y, num, label, ok) => `<g><circle cx="${x}" cy="${y}" r="34" fill="${ok ? 'var(--ok)' : 'var(--surface-2)'}" stroke="${ok ? 'var(--ok)' : 'var(--line)'}" stroke-width="3"/><text x="${x}" y="${y + 11}" text-anchor="middle" font-size="32" font-weight="800" fill="${ok ? '#fff' : 'var(--muted)'}">${num}</text><text x="${x}" y="${y + 52}" text-anchor="middle" font-size="12" fill="var(--ink)">${label}</text></g>`;
      R('svg').innerHTML = big(90, 45, 3, `en az 3 kopya (${copies})`, copies >= 3) + `<text x="185" y="56" font-size="26" fill="var(--muted)" text-anchor="middle">–</text>` +
        big(280, 45, 2, `2 farklı ortam (${media})`, media >= 2) + `<text x="375" y="56" font-size="26" fill="var(--muted)" text-anchor="middle">–</text>` + big(470, 45, 1, `1 tesis dışı (${offsite ? 'var' : 'yok'})`, offsite);
      const row = (ok, t) => `<div style="display:flex;gap:8px;align-items:flex-start"><span aria-hidden="true">${ok ? '✅' : '⬜'}</span><span>${t}</span></div>`;
      R('checks').innerHTML = row(copies >= 3, `En az <b>3 kopya</b> (orijinal dahil): şu an ${copies}`) + row(media >= 2, `En az <b>2 farklı ortam</b> veya hata alanı: şu an ${media}`) + row(offsite, 'En az <b>1 tesis dışı</b> kopya') +
        row(offline, 'Fidye yazılımına karşı en az <b>1 çevrimdışı</b> (veya değiştirilemez) kopya') + row(versioned, 'Yanlış silmeye karşı <b>geçmiş sürüm</b> (sürümlü yedek veya çevrimdışı eski kopya)');
    }
    host.addEventListener('change', (e) => { const k = e.target.dataset.k; if (!k) return; e.target.checked ? on.add(k) : on.delete(k); R('res').style.display = 'none'; paint(); });

        <p class="mt0">${lost.length ? `Etkilenen: ${lost.map((x) => x.n.replace(/^\S+\s/, '')).join('; ')}.` : ''} ${ok ? `Kurtaran: <b>${safe.map((x) => x.n.replace(/^\S+\s/, '')).join('; ')}</b>.` : 'Seçtiğin kopyaların hiçbiri bu senaryodan sağ çıkmadı.'}${extra}</p>
        <p class="muted" style="font-size:.85rem;margin-bottom:0">Unutma: “Başarılı yedek işi” kaydı, başarılı kurtarma kanıtı değildir; düzenli <b>örnek geri yükleme</b> testi yap.</p>`;
    });
    paint();

      { id: 'hdd', tag: 'Kavram + etkileşim', title: 'Sabit diskler (HDD)', minutes: 4, init: initHDD, html: `
        <p><span class="term">HDD</span> (Hard Disk Drive), manyetik kayıt ortamıdır: metal, cam veya plastik plakaların manyetik malzemeyle kaplı yüzeyine veri <b>mıknatıslanma</b> ile yazılır; elektrik kesilince kaybolmaz. Form faktörü (inç değeri, manyetik diskin çapı): masaüstünde <b>3,5″</b>, dizüstünde <b>2,5″</b>; ayrıca 1,8″ ve 1,0″. Pazarda bugün WD, Seagate ve Toshiba kaldı. 2026’da kurumsal HAMR ailesinde 44 TB’a kadar örnekler var (tüm pazarı temsil etmez).</p>
        <ul>
          <li>Plakalar 5400, 7200, 10.000, 15.000 dev/dak dönerken kafa okuma/yazma yapar. <b>Kafa plakaya kesinlikle değmez</b>; aradaki boşluk gözle görülmez. Disk toz ve neme karşı kapalıdır; vidalarından açmak diski kullanılamaz hâle getirebilir.</li>
          <li><b>Track (iz):</b> plakadaki dairesel alan. <b>Sektör:</b> iz üzerindeki en küçük saklama birimi (sabit boyutlu). <b>Cluster (küme):</b> birkaç sektörün oluşturduğu sanal birim; boyutu biçimlendirmede ayarlanır.</li>
          <li>Boştayken kafa kenarda <b>park</b> eder. Çalışırken darbe, kafanın yüzeye değip <b>bad sector</b> (bozuk sektör) oluşturmasına yol açabilir. Bozuk sektörler artıyorsa hemen yedek alıp diski emekliye ayır.</li>
          <li><b>Arabirimler:</b> PATA/IDE tarihsel; güncel HDD’lerde SATA; kurumsalda SATA ve SAS.</li>
        </ul>
        <div class="lab"><div class="lab-head">💿 Laboratuvar: Dönüş hızı ve gecikme</div><div class="lab-body" id="m8HDD"></div></div>
        <p><b>Güncel kayıt teknolojileri:</b> CMR (izler ayrı yazılır, öngörülebilir rastgele yazma), ePMR (enerji destekli yazma), SMR (izler kısmen üst üste; yoğun rastgele yazmada yavaşlayabilir), HAMR (yazma bölgesi kısa süre ısıtılır). Güncel HDD’lerde fiziksel sektör çoğunlukla <b>4 KiB</b>’tır (512e diskler işletim sistemine 512 bayt gösterir, 4Kn diskler 4 KiB). <b>S.M.A.R.T.</b> değerleri erken uyarı verir ama arızayı kesin öngörmez.</p>` },

      { id: 'dosya', tag: 'Temel kavramlar', title: 'Dosya sistemleri, bölümleme ve performans ölçütleri', minutes: 2, html: `
        <p><span class="term">Dosya sistemi</span>, dosya ve klasörlerin depolama biriminde nasıl saklanacağını belirler; genellikle biçimlendirme (format) sırasında seçilir.</p>

      { id: 'ssd', tag: 'Kavram + etkileşim', title: 'Katı hal sürücüleri (SSD) ve NVMe', minutes: 3, init: initSSD, html: `
        <p><span class="term">SSD</span>, veriyi <b>NAND flash</b> yongalarında saklar. Yalnızca birleştirilmiş USB belleklerden ibaret değildir: <b>denetleyici, firmware, Flash Translation Layer</b> (mantıksal blokları fiziksel sayfalara eşleyen katman), hata düzeltme, <b>paralel NAND kanalları</b> ve modele göre DRAM veya HMB (sistem RAM’inden alan kullanımı) birlikte çalışır.</p>
        <div class="grid cols-2">
          <div class="card"><b>✅ Avantajlar</b><p class="mt0">Mekanik parça yok: rastgele erişim gecikmesi çok düşük (sıfır değil), yüksek IOPS, sessiz, hafif, sarsıntıya dayanıklı.</p></div>
          <div class="card"><b>⚠️ Sınırlar</b><p class="mt0">Aynı kapasitede daha pahalı olabilir; yazma ömrü TBW/DWPD ile sınırlı; SLC önbellek dolunca yazma hızı düşebilir; hızlı NVMe’lerde ısıl kısma (thermal throttling).</p></div>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th></th><th>SATA SSD</th><th>PCIe NVMe SSD</th></tr></thead>
          <tbody>
            <tr><td>Taşıma</td><td>SATA</td><td>PCI Express</td></tr>
            <tr><td>Biçim</td><td>2,5″ veya M.2</td><td>M.2, U.2, AIC, EDSFF</td></tr>
            <tr><td>Protokol</td><td>AHCI</td><td>NVMe</td></tr>
            <tr><td>Sınır</td><td>Yaklaşık <b>550 MB/s</b> sınıfı</td><td>PCIe nesli, hat sayısı, NAND, denetleyici, sıcaklık</td></tr>

        <p><b>PCIe x4 yaklaşık tek yön kapasitesi:</b> 3.0 (8 GT/s) → 3,94 GB/s · 4.0 (16 GT/s) → 7,88 GB/s · 5.0 (32 GT/s) → 15,75 GB/s. 2026 tüketici sistemlerinde PCIe 4.0 ve 5.0 NVMe yaygındır (NVMe 2.4: 4 Ağustos 2026).</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Hücre</th><th>Bit/hücre</th><th>Eğilim</th><th>Ders notundaki dayanım</th></tr></thead>
          <tbody>
            <tr><td><b>SLC</b></td><td>1</td><td>Yüksek dayanım, düşük yoğunluk; pahalı</td><td>Blok başına ~100.000 yazma</td></tr>
            <tr><td><b>MLC</b></td><td>2</td><td>Dayanım–yoğunluk dengesi</td><td>~10.000</td></tr>
            <tr><td><b>TLC</b></td><td>3</td><td>Yaygın genel amaçlı</td><td>~1.000 silme</td></tr>

        <div class="box note"><div class="box-title">ℹ️ Not: MLC kaç bit?</div>
          <p>Hafta 7 notunun metninde MLC için “her hücrede <b>2, 3 ve daha fazla</b> bit” yazar; aynı notun güncel tablosunda ise <b>MLC = 2 bit</b>, TLC = 3, QLC = 4 bittir. “Multi-level” geniş anlamda birden çok bit demek olsa da sınıflandırmada <b>MLC’yi 2 bit</b> olarak kabul et. Ayrıca not, SLC/MLC/TLC ile birlikte “V-NAND”ı dördüncü yonga teknolojisi gibi sayar; oysa <b>3D NAND (V-NAND), hücre başına bit sayısından ayrı</b> bir özelliktir (hücrelerin dikey katmanlar hâlinde dizilmesi).</p></div>

      { id: 'raid', tag: 'Kavram + etkileşim', title: 'RAID düzeyleri ve RAID ≠ yedek', minutes: 4, init: initRAID, html: `
        <p><span class="term">RAID</span> (Redundant Array of Independent Disks, Bağımsız Disklerin Artıklıklı Dizisi), birden fazla fiziksel diski tek bir mantıksal birimde birleştirir. Düzeyine göre <b>performans, kullanılabilir kapasite ve disk arızasına karşı hizmet sürekliliği</b> sağlar; yöntemleri <b>striping</b> (şeritleme), <b>mirroring</b> (aynalama) ve <b>parity</b>’dir. <b>Hacim verimi</b>, n diskli dizinin kullanılabilir kapasitesidir: 3 × 250 GB ve verim n−1 ise 250 × 2 = 500 GB.</p>
        <div class="lab"><div class="lab-head">🧱 Laboratuvar: RAID hesaplayıcı ve arıza simülatörü</div><div class="lab-body" id="m8RAID"></div></div>
        <div class="box warn"><div class="box-title">⚠️ RAID bir yedekleme yöntemi değildir</div><p>Yanlış silme, fidye yazılımı, dosya bozulması, denetleyici arızası veya fiziksel felaket karşısında eski sürümü <b>bağımsız olarak</b> geri getirmez. Parity de bir yedek kopyası değildir.</p></div>
        <ul>
          <li><b>Hot swap:</b> çalışırken disk değiştirme; disk, yuva, arka panel, denetleyici ve işletim sistemi desteği gerekir.</li>
          <li><b>Hot spare:</b> veri kopyası değil, otomatik rebuild için bekleyen disktir.</li>
          <li><b>Scrub:</b> veri–parity tutarsızlıklarını ve bazı gizli medya hatalarını erken bulmaya yardım eder.</li>
          <li>Güç kesintisi veri ile parity’nin farklı kalmasına yol açabilir: uygun önbellek koruması, UPS ve dosya sistemi önlemleri gerekir. RAID 2, 3 ve 4 tarihsel/özel düzenlerdir. <b>RAID 10</b> aynaların şeritlenmesi, <b>RAID 01</b> şerit gruplarının aynalanmasıdır; RAID 10 çoğu arıza dağılımında daha esnektir.</li>
          <li><b>DAS</b> doğrudan bilgisayara bağlanır; <b>NAS</b> SMB/NFS ile dosya hizmeti sunar; <b>SAN</b> iSCSI, Fibre Channel veya NVMe over Fabrics ile blok aygıtı sağlar.</li>
        </ul>
        <div class="box analogy"><div class="box-title">📒 Günlük hayattan: Ders notunun fotokopisi</div>
          <p>RAID 1, ders notunu yazarken aynı anda ikinci bir deftere de kopyalayan bir arkadaş gibidir: bir defter suya düşerse diğeri durur. Ama sen bir sayfayı yanlışlıkla silersen, arkadaşın o silmeyi de aynen kopyalar.</p>

/* ==================== exam.js ==================== */
/* =========================================================
   VİZE SİMÜLASYONU — 20 soru, 25 dakika
   - Soru havuzu: tüm modül quizleri (questionPool, review.js)
   - Dengeli dağılım: her modülden en az 2 soru; 3–4 doğru/yanlış veya eşleştirme
   - Süre bitince otomatik teslim; sayfa yenilense de sınav kaldığı yerden sürer
   - Sonuç: skor, modül bazlı analiz, her yanlış için açıklama ve modül bağlantısı
   ========================================================= */
(function () {
  const N_Q = 20, DURATION = 25 * 60 * 1000, NONMC_TARGET = 4;
  const ex = () => Store.data.exam;
  const byId = () => Object.fromEntries(questionPool().map((q) => [q.id, q]));

  /* ---------- Soru seçimi ---------- */
  function buildExam() {
    const pool = questionPool();
    const mods = shuffle([...new Set(pool.map((q) => q.modId))]);
    const base = Math.floor(N_Q / mods.length), extra = N_Q - base * mods.length;
    const allot = Object.fromEntries(mods.map((m, i) => [m, base + (i < extra ? 1 : 0)]));
    const nonMcOf = (m, type) => pool.filter((q) => q.modId === m && (type ? q.type === type : q.type !== 'mc'));
    // 3–4 adet doğru/yanlış veya eşleştirme: en az bir eşleştirme ve bir doğru/yanlış olsun
    const chosenNon = {};
    const mMatch = shuffle(mods.filter((m) => nonMcOf(m, 'match').length))[0];
    if (mMatch) chosenNon[mMatch] = 'match';
    const mTf = shuffle(mods.filter((m) => !chosenNon[m] && nonMcOf(m, 'tf').length))[0];
    if (mTf) chosenNon[mTf] = 'tf';
    shuffle(mods.filter((m) => !chosenNon[m] && nonMcOf(m).length)).slice(0, NONMC_TARGET - Object.keys(chosenNon).length).forEach((m) => { chosenNon[m] = 'any'; });
    const picks = [];
    mods.forEach((m) => {
      let need = allot[m];
      if (chosenNon[m]) { const cand = shuffle(nonMcOf(m, chosenNon[m] === 'any' ? null : chosenNon[m])); picks.push(cand[0]); need--; }
      shuffle(pool.filter((q) => q.modId === m && q.type === 'mc')).slice(0, need).forEach((q) => picks.push(q));
    });
    const qs = shuffle(picks);
    const views = {}, rights = {};
    qs.forEach((q) => {
      if (q.type === 'mc') views[q.id] = shuffle(q.options.map((_, i) => i));
      if (q.type === 'match') rights[q.id] = shuffle(q.pairs.map((p) => p[1]));
    });
    const now = Date.now();
    ex().current = { qids: qs.map((q) => q.id), views, rights, answers: {}, flags: [], idx: 0, start: now, deadline: now + DURATION };
    Store.save();
  }

  /* ---------- Değerlendirme ---------- */
  function isCorrect(q, a) {
    if (a === undefined || a === null) return false;
    if (q.type === 'match') return Array.isArray(a) && q.pairs.every((p, i) => a[i] === p[1]);
    return a === q.answer;
  }
  function answerText(q, a) {
    if (a === undefined || a === null) return '<i>Boş bırakıldı</i>';
    if (q.type === 'tf') return a ? 'Doğru' : 'Yanlış';
    if (q.type === 'match') return q.pairs.map((p, i) => `${p[0]} → ${a[i] ? esc(a[i]) : '—'}`).join('; ');
    return q.options[a];
  }
  function rightText(q) {
    if (q.type === 'tf') return q.answer ? 'Doğru' : 'Yanlış';
    if (q.type === 'match') return q.pairs.map((p) => `${p[0]} → ${p[1]}`).join('; ');
    return q.options[q.answer];
  }
  function answered(q, a) { return q.type === 'match' ? Array.isArray(a) && a.some(Boolean) : a !== undefined && a !== null; }

  function submit(auto) {
    const cur = ex().current; if (!cur) return;
    const Q = byId();
    const qs = cur.qids.map((id) => Q[id]).filter(Boolean);
    const score = qs.filter((q) => isCorrect(q, cur.answers[q.id])).length;
    const usedSec = Math.min(DURATION, Math.max(0, (auto ? cur.deadline : Date.now()) - cur.start)) / 1000;
    const byMod = {};
    qs.forEach((q) => { const b = byMod[q.modId] || (byMod[q.modId] = { ok: 0, n: 0 }); b.n++; if (isCorrect(q, cur.answers[q.id])) b.ok++; });
    const run = { qids: cur.qids, answers: cur.answers, score, total: qs.length, usedSec, auto: !!auto, date: new Date().toISOString(), byMod };
    ex().attempts.push({ score, total: qs.length, usedSec, auto: !!auto, date: run.date });
    ex().lastRun = run;
    ex().current = null;
    Store.save();
  }

  /* ---------- Biçim yardımcıları ---------- */
  const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  const modName = (id) => { const m = MODULES.find((x) => x.id === id); return m ? `Modül ${m.no}: ${m.short || m.title}` : id; };

  /* ---------- Başlangıç ekranı ---------- */
  function startScreen() {
    const at = ex().attempts;
    const best = at.length ? Math.max(...at.map((a) => a.score)) : null;

    return `<div class="container">
      <p class="chip accent">📝 20 soru · 25 dakika</p>
      <h1>Vize simülasyonu</h1>
      <p>Gerçek sınav provası. Sorular ${mods.length} modülün quiz havuzundan (${pool.length} soru) <b>dengeli</b> seçilir: her modülden en az 2 soru. Çoğu 4 seçenekli çoktan seçmeli; 3–4 soru doğru/yanlış veya eşleştirme. Her denemede sorular, sıraları ve seçenekler <b>yeniden karışır</b>.</p>
      <div class="card"><h3 class="mt0">Kurallar</h3><ul class="mt0">
        <li>Süre <b>25 dakika</b>. Süre bitince sınav <b>otomatik teslim edilir</b>.</li>
        <li>Sınav sırasında geri bildirim yoktur; sorular arasında gezinip cevabını değiştirebilir, emin olmadıklarını ⚑ ile işaretleyebilirsin.</li>
        <li>Sayfayı yenilesen veya başka bölüme geçsen de sınav ve süre kaldığı yerden devam eder (süre işlemeye devam eder).</li>
        <li>Sonuçta: skor, modül bazlı analiz ve her yanlış için açıklama ile ilgili modüle bağlantı. Referans: %60 ve üzeri “geçti”.</li>
      </ul></div>
      <div class="btn-row">
        ${cur && cur.deadline > Date.now() ? `<button type="button" class="btn primary" data-a="resume">⏵ Devam et (kalan ${mmss(cur.deadline - Date.now())})</button><button type="button" class="btn" data-a="restart">Yeni sınav başlat</button>`
          : `<button type="button" class="btn primary" data-a="start">▶ Sınavı başlat</button>`}
        ${ex().lastRun ? '<button type="button" class="btn" data-a="last">Son denemenin sonucu</button>' : ''}
      </div>
      ${at.length ? `<h3>Önceki denemeler</h3><p><span class="chip ok">En iyi: ${best}/${N_Q}</span> <span class="chip">Deneme sayısı: ${at.length}</span></p>
        <div class="table-wrap"><table><thead><tr><th>#</th><th>Tarih</th><th>Skor</th><th>Süre</th></tr></thead><tbody>
        ${at.slice(-5).reverse().map((a, i) => `<tr><td>${at.length - i}</td><td>${new Date(a.date).toLocaleString('tr-TR')}</td><td>${a.score}/${a.total} (%${Math.round((a.score / a.total) * 100)})</td><td>${mmss(a.usedSec * 1000)}${a.auto ? ' ⏰' : ''}</td></tr>`).join('')}
        </tbody></table></div>` : ''}
    </div>`;
  }

  /* ---------- Sınav ekranı ---------- */

        const a = answered(q, cur.answers[q.id]), f = cur.flags.includes(q.id), c = i === cur.idx;
        return `<button type="button" class="btn small" data-go="${i}" aria-label="Soru ${i + 1}${a ? ', cevaplandı' : ''}${f ? ', işaretli' : ''}" ${c ? 'aria-current="true"' : ''}
          style="min-height:40px;padding:0;${c ? 'background:var(--ink);color:var(--bg);' : a ? 'background:var(--ok-soft);' : ''}${f ? 'border:2px solid var(--accent);' : ''}">${i + 1}</button>`;
      }).join('');
      const n = qs.filter((q) => answered(q, cur.answers[q.id])).length;
      R('cnt').textContent = `Cevaplanan: ${n}/${qs.length}`;
      R('pbar').style.width = (n / qs.length) * 100 + '%';
    }
    function paintQ(focus) {
      const q = qs[cur.idx], a = cur.answers[q.id];
      R('pos').textContent = `Soru ${cur.idx + 1} / ${qs.length}`;
      let body;
      if (q.type === 'match') {
        const rights = cur.rights[q.id];
        body = q.pairs.map((p, i) => `<div class="match-row"><span>${p[0]}</span><select data-m="${i}" aria-label="${esc(p[0])} için eşleşme"><option value="">— seç —</option>${rights.map((r) => `<option ${a && a[i] === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>`).join('');
      } else {
        const opts = q.type === 'tf' ? [[true, 'Doğru'], [false, 'Yanlış']] : cur.views[q.id].map((oi) => [oi, q.options[oi]]);
        body = `<div class="opts" role="radiogroup" aria-labelledby="exQ">${opts.map(([v, t], i) => `<button type="button" class="opt ${a === v ? 'selected' : ''}" role="radio" aria-checked="${a === v}" data-v="${String(v)}"><span class="key">${q.type === 'tf' ? (i ? 'Y' : 'D') : LETTERS[i]}</span><span>${t}</span></button>`).join('')}</div>`;
      }
      R('q').innerHTML = `<div class="quiz-type">${typeLabel(q)}</div><div class="quiz-q" id="exQ" tabindex="-1">${q.q}</div>${body}`;
      const fb = $('[data-a="flag"]', main); const fl = cur.flags.includes(q.id);
      fb.setAttribute('aria-pressed', String(fl)); fb.textContent = fl ? '⚑ İşaretli' : '⚑ İşaretle';
      $('[data-a="prev"]', main).disabled = cur.idx === 0;
      $('[data-a="next"]', main).textContent = cur.idx === qs.length - 1 ? 'Bitir ▶' : 'Sonraki ▶';
      paintGrid();
      if (focus) $('#exQ', main).focus({ preventScroll: true });
    }
    function go(i) { cur.idx = clamp(i, 0, qs.length - 1); R('confirm').innerHTML = ''; Store.save(); paintQ(true); }
    function askFinish() {
      const empty = qs.filter((q) => !answered(q, cur.answers[q.id])).length;
      R('confirm').innerHTML = `<div class="box warn" style="margin:10px 0 0"><p class="mt0">${empty ? `<b>${empty} soru boş.</b> ` : 'Tüm sorular cevaplandı. '}Sınavı bitirip sonucu görmek istiyor musun?</p>
        <div class="btn-row" style="margin-bottom:0"><button type="button" class="btn small again" data-a="confirmyes">Evet, bitir</button><button type="button" class="btn small" data-a="confirmno">Sınava dön</button></div></div>`;
      $('[data-a="confirmno"]', main).focus();
    }
    function finish(auto) { clearInterval(timer); submit(auto); renderPage(root, auto ? 'auto' : 'done'); }
    main.addEventListener('click', (e) => {
      const q = qs[cur.idx];
      const opt = e.target.closest('.opt[data-v]');
      if (opt) {
        const v = opt.dataset.v;
        cur.answers[q.id] = q.type === 'tf' ? v === 'true' : +v;
        Store.save(); paintQ(false); $(`.opt[data-v="${v}"]`, main).focus(); return;
      }
      const g = e.target.closest('[data-go]'); if (g) { go(+g.dataset.go); return; }
      const a = e.target.closest('[data-a]'); if (!a) return;
      const act = a.dataset.a;
      if (act === 'prev') go(cur.idx - 1);
      else if (act === 'next') { if (cur.idx === qs.length - 1) askFinish(); else go(cur.idx + 1); }
      else if (act === 'flag') { const i = cur.flags.indexOf(q.id); i >= 0 ? cur.flags.splice(i, 1) : cur.flags.push(q.id); Store.save(); paintQ(false); }
      else if (act === 'finish') askFinish();
      else if (act === 'confirmyes') finish(false);
      else if (act === 'confirmno') { R('confirm').innerHTML = ''; }
    });
    main.addEventListener('change', (e) => {
      const s = e.target.closest('select[data-m]'); if (!s) return;
      const q = qs[cur.idx];
      const arr = Array.isArray(cur.answers[q.id]) ? cur.answers[q.id] : q.pairs.map(() => '');
      arr[+s.dataset.m] = s.value; cur.answers[q.id] = arr; Store.save(); paintGrid();
    });
    let warned5 = false, warned1 = false;
    function tick() {
      if (!alive(tok) || !document.body.contains(main)) { clearInterval(timer); return; }
      const left = cur.deadline - Date.now();
      const t = R('timer');
      t.textContent = '⏱ ' + mmss(left);
      t.style.background = left < 60000 ? 'var(--bad-soft)' : left < 300000 ? 'var(--accent-soft)' : '';
      t.style.color = left < 60000 ? 'var(--bad)' : left < 300000 ? 'var(--accent)' : '';
      if (left <= 300000 && !warned5) { warned5 = true; R('alert').textContent = 'Son 5 dakika.'; }
      if (left <= 60000 && !warned1) { warned1 = true; R('alert').textContent = 'Son 1 dakika.'; }
      if (left <= 0) finish(true);
    }
    const timer = setInterval(tick, 1000);
    tick();
    if (ex().current) paintQ(true);
  }

  /* ---------- Sonuç ekranı ---------- */
  function resultScreen(how) {
    const run = ex().lastRun;
    const Q = byId();
    const qs = run.qids.map((id) => Q[id]).filter(Boolean);
    const pct = Math.round((run.score / run.total) * 100);
    const pass = pct >= 60;
    return `<div class="container">
      <h1>Vize simülasyonu — sonuç</h1>
      ${how === 'auto' || run.auto ? '<div class="box warn"><div class="box-title">⏰ Süre doldu</div><p>Sınav otomatik olarak teslim edildi; cevapladığın sorular değerlendirildi.</p></div>' : ''}
      <div class="card result-hero"><div class="muted">Toplam skor</div><div class="big" tabindex="-1" id="exRes">${run.score} / ${run.total}</div>
        <p>%${pct} · Süre: ${mmss(run.usedSec * 1000)} · ${pass ? '<span class="chip ok">✓ Geçer seviye (%60+)</span>' : '<span class="chip accent">↻ Tekrar önerilir (%60 altı)</span>'}</p>
        <p><span class="chip ok">Doğru: ${run.score}</span> <span class="chip accent">Yanlış/boş: ${run.total - run.score}</span></p></div>
      <h2>Modül bazlı analiz</h2>
      <div class="table-wrap"><table><thead><tr><th>Modül</th><th>Doğru</th><th>Durum</th><th></th></tr></thead><tbody>
        ${Object.entries(run.byMod).sort((a, b) => a[0].localeCompare(b[0], 'tr', { numeric: true })).map(([m, b]) => `<tr><td>${modName(m)}</td><td>${b.ok}/${b.n}</td><td>${b.ok === b.n ? '✅ Tam' : b.ok / b.n >= 0.5 ? '🟡 İyi' : '🔴 Tekrar et'}</td><td><a href="#/m/${m}">Modüle git →</a></td></tr>`).join('')}
      </tbody></table></div>
      <h2>Soru soru inceleme</h2>
      <div class="btn-row" role="group" aria-label="Filtre"><button type="button" class="btn small primary" data-f="all">Tümü (${qs.length})</button><button type="button" class="btn small" data-f="wrong">Yalnız yanlış/boş (${run.total - run.score})</button></div>
      <ul class="wrong-list" data-r="list">
        ${qs.map((q, i) => { const ok = isCorrect(q, run.answers[q.id]); return `<li class="${ok ? 'ok' : ''}" data-ok="${ok}">
          <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>${ok ? '✅' : '❌'} Soru ${i + 1}</b><span class="chip">${modName(q.modId)}</span></div>
          <p style="margin:.3em 0">${q.q}</p>
          <p style="margin:.2em 0;font-size:.92rem"><b>Senin cevabın:</b> ${answerText(q, run.answers[q.id])}</p>
          ${ok ? '' : `<p style="margin:.2em 0;font-size:.92rem"><b>Doğru cevap:</b> ${rightText(q)}</p>`}
          <p class="muted" style="margin:.2em 0;font-size:.9rem">${q.exp}</p>
          ${ok ? '' : `<a href="#/m/${q.modId}" style="font-size:.9rem">📘 ${modName(q.modId)} konusunu tekrar et →</a>`}
        </li>`; }).join('')}
      </ul>
      <div class="btn-row"><button type="button" class="btn primary" data-a="start">🔄 Tekrar dene (yeni karışık set)</button><a class="btn" href="#/tekrar">⚡ Hızlı tekrar sayfası</a><a class="btn ghost" href="#/">Modül haritası</a></div>
    </div>`;
  }

  /* ---------- Sayfa yöneticisi ---------- */
  function renderPage(main, mode) {
    const cur = ex().current;
    if (cur && cur.deadline <= Date.now()) { submit(true); mode = 'auto'; }
    if (mode === 'exam' && ex().current) { examScreen(main); return; }
    if ((mode === 'done' || mode === 'auto' || mode === 'last') && ex().lastRun) {
      main.innerHTML = resultScreen(mode);
      renderSidebar(parseRoute());
      const h = $('#exRes', main); if (h) h.focus({ preventScroll: true });
      window.scrollTo(0, 0);
      return;
    }
    main.innerHTML = startScreen();
  }

  SPECIAL_PAGES.exam = {
    html: () => '<div id="examRoot"><div class="container"><p>Yükleniyor…</p></div></div>',
    init(page) {
      const main = $('#examRoot', page); // dinleyiciler kalıcı #main yerine sayfaya özel köke bağlanır
      // Süresi dolmuş yarım sınav varsa önce teslim et
      const cur = ex().current;
      if (cur && cur.deadline <= Date.now()) { submit(true); renderPage(main, 'auto'); }
      else renderPage(main, 'start');
      main.addEventListener('click', (e) => {
        const a = e.target.closest('[data-a]');
        const f = e.target.closest('[data-f]');
        if (f) {
          $$('[data-f]', main).forEach((b) => b.classList.toggle('primary', b === f));
          $$('[data-r="list"] > li', main).forEach((li) => { li.style.display = f.dataset.f === 'wrong' && li.dataset.ok === 'true' ? 'none' : ''; });
          return;
        }
        if (!a) return;
        if (a.dataset.a === 'start' || a.dataset.a === 'restart') { buildExam(); renderPage(main, 'exam'); window.scrollTo(0, 0); }
        else if (a.dataset.a === 'resume') { renderPage(main, 'exam'); window.scrollTo(0, 0); }
        else if (a.dataset.a === 'last') renderPage(main, 'last');
      });
    }
  };
})();

/* ==================== boot.js ==================== */
/* =========================================================
   AÇILIŞ: tüm modüller kaydedildikten sonra siteyi başlat
   ========================================================= */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

</script>
</body>
</html>
