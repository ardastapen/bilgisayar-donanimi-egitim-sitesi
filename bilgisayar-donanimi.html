    steps: [
      { id: 'neden', tag: 'Motivasyon', title: 'Neden önemli?', minutes: 1, html: `
        <div class="grid cols-2">
          <div class="card"><h3 class="mt0">🏷️ Kutudaki etiket</h3><p>“8 çekirdek / 16 iş parçacığı, 5,0 GHz’e kadar”. Bu, 16 işlemcin olduğu anlamına mı geliyor? Her uygulama 5 GHz’te mi çalışacak? Bu modül sonunda etiketi doğru okuyacaksın.</p></div>
          <div class="card"><h3 class="mt0">🌡️ Sıcak bir konu</h3><p>Aynı işlemci, iyi soğutulmuş bir masaüstünde ince bir dizüstüne göre daha uzun süre yüksek hızda çalışabilir. Neden? Çünkü frekans; güç ve sıcaklık sınırlarına göre dinamik değişir.</p></div>
        </div>
        <p>İşlemciler yalnız bilgisayarlarda değil; ekran kartı, ses kartı, akıllı TV, çamaşır makinesi, cep telefonu ve kombide de bulunur. Modül 2’deki mimari bilgisini şimdi gerçek ürünlere uygulayacağız.</p>` },

      { id: 'yapi', tag: 'Temel kavramlar', title: 'İşlemcinin yapısı ve önbellek', minutes: 3, html: `
        <p><span class="term">Merkezi İşlem Birimi (CPU)</span>, genel amaçlı programların komutlarını yürüten temel hesaplama birimidir. Günlük dilde “işlemci”, “mikroişlemci”, “CPU” ve “MİB” birbirinin yerine kullanılsa da tam özdeş değildir: mikroişlemci daha genel bir terimdir; GPU, dijital sinyal işlemcisi ve mikrodenetleyici de birer işlemci türüdür. Günümüz işlemcileri milyarlarca transistör içerebilen tümleşik devrelerdir.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Bileşen</th><th>Temel görev</th><th>Kısa açıklama</th></tr></thead>
          <tbody>
            <tr><td><b>ALU</b></td><td>Aritmetik ve mantık</td><td>Toplama, çıkarma, karşılaştırma, bit düzeyi işlemler, adres hesapları</td></tr>
            <tr><td><b>Kontrol birimi</b></td><td>Komut akışı</td><td>Komutları çözer, birimlerin doğru zamanda çalışması için kontrol sinyallerini üretir</td></tr>
            <tr><td><b>Yazmaçlar</b></td><td>En hızlı çalışma alanı</td><td>Operandları, adresleri, durum bilgisini ve ara sonuçları tutar (ör. PC: sıradaki komutun adresi)</td></tr>
            <tr><td><b>Önbellek</b></td><td>Yakın veri ve komut deposu</td><td>Sık kullanılan komut ve verileri RAM’e göre daha düşük gecikmeyle sunar</td></tr>
          </tbody></table></div>
        <p>Ayrıca yükleme/saklama birimleri bellek hareketlerini, <b>SIMD/vektör</b> birimleri ise aynı işlemin birden çok veri öğesine uygulanmasını hızlandırır. Komut yürütme <b>Fetch–Decode–Execute–Store</b> (getir–çöz–yürüt–sakla) modeliyle öğretilir.</p>
        <h3>Önbellek seviyeleri</h3>
        <p>RAM’den gelen veriler çoğunlukla CPU’nun hızına yetişemez. Bu yüzden CPU içinde <b>L1</b> (çekirdeğe en yakın, en küçük, en düşük gecikmeli), <b>L2</b> (daha büyük) ve <b>L3 / LLC</b> (Son Seviye Önbellek; daha büyük ama daha yavaş) bulunur. L1 ve L2 sıklıkla çekirdeğe özeldir; L3 çekirdekler arasında paylaşılabilir. İstenen bilgi bir seviyede bulunursa <span class="term">önbellek isabeti (cache hit)</span>, bulunamazsa <span class="term">önbellek kaçırması (cache miss)</span> olur ve bir alt seviyeye gidilir.</p>
        <div class="box note"><div class="box-title">ℹ️ Not: Önbellek kaçırmada “sabit diske bakılır” mı?</div>
          <p>Hafta 4 notunun eski bir paragrafında işlemcinin aradığı komutu L1, L2, L3’te bulamazsa “RAM ve sabit disk üzerindeki sanal hafızayı” kontrol ettiği yazar. Aynı notun güncel paragrafı bunu düzeltir: <b>CPU bir önbellek kaçırmasında doğrudan sabit diske bakmaz.</b> Önbellek kaçırması RAM erişimine yol açar. Gerekli sayfa RAM’de yoksa bu ayrı bir mekanizma olan <b>sanal bellek</b> devreye girer: işletim sistemi, Bellek Yönetim Birimi (MMU), sayfa tabloları ve depolamadaki sayfa/takas alanı birlikte çalışır (Modül 7). Sınavda güncel açıklamayı esas al.</p></div>
        <div class="box analogy"><div class="box-title">🧠 Günlük hayattan: “Bilgisayarın beyni”</div>
          <p>CPU’ya sık sık “bilgisayarın beyni” denir: kararları yöneten, işleri sıraya koyan merkez.</p>
          <span class="limit">Ders notunun da vurguladığı gibi bu yalnızca sezgisel bir benzetmedir. Modern bilgisayarda GPU, NPU, bellek denetleyicileri ve başka hızlandırıcılar da hesaplamaya doğrudan katılır. CPU “düşünmez”; tanımlı komutları çok hızlı yürütür.</span></div>
        <p class="footnote">Notta “işlemci sadece 0 ve 1 değerleri üzerinden işlem yapar, açık/kapalı” ifadesi geçer; aynı notta bunun fiziksel devrelerin belirli gerilim aralıklarını mantıksal durumlar olarak yorumlaması olduğu da belirtilir (bkz. Modül 1).</p>` },

      { id: 'pipeline', tag: 'Etkileşimli açıklama', title: 'Boru hattı: aynı anda farklı aşamalar', minutes: 2, init: initPipeline, html: `
        <p>Modern işlemcilerde komutlar, bir önceki tamamen bitmeyi beklemeden işlenir: <span class="term">işlem hattı (pipeline)</span> sayesinde farklı komutlar <b>aynı anda farklı aşamalarda</b> bulunabilir.</p>
        <div class="lab"><div class="lab-head">🏭 Laboratuvar: Ardışık mı, boru hattı mı?</div><div class="lab-body" id="m5Pipe"></div></div>
        <div class="box analogy"><div class="box-title">🧺 Günlük hayattan: Çamaşırhane</div>
          <p>Dört sepet çamaşırın her biri yıkanır, kurutulur, katlanır. Birinci sepet kurutucudayken ikinci sepeti makineye atarsan iş çok daha erken biter. Tek sepetin süresi kısalmaz, ama <b>birim zamanda biten iş</b> artar.</p>
          <span class="limit">Gerçek işlemcide aşamalar her zaman eşit sürmez; bir komut öncekinin sonucunu bekliyorsa veya dallanma tahmini yanlışsa hat duraklayabilir. İşlemciler bu sorunları azaltmak için dallanma kestirimi ve sıra dışı yürütme gibi teknikler kullanır.</span></div>` },

      { id: 'saat', tag: 'Kavram + etkileşim', title: 'Paketler, saat hızı, hız aşırtma ve soğutma', minutes: 4, init: initClock, html: `
        <h3 class="mt0">İşlemci paketleri</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Paket</th><th>Pinler nerede?</th><th>Not</th></tr></thead>
          <tbody>
            <tr><td><b>PGA</b> (Pin Grid Array)</td><td>İşlemci paketinin altında</td><td>Ayak sayısına göre adlandırılır: 423 ve 478 ayaklı Pentium 4 → soket 423 / 478</td></tr>
            <tr><td><b>LGA</b> (Land Grid Array)</td><td>Pakette temas yüzeyleri; <b>yaylı temas elemanları sokette</b></td><td>Sinyal yolu kısalır, sinyal iletim hızı artar</td></tr>
            <tr><td><b>BGA</b> (Ball Grid Array)</td><td>Karta lehimlenir</td><td>Özellikle mobil/gömülü sistemlerde yaygın</td></tr>
          </tbody></table></div>
        <div class="box warn"><div class="box-title">⚠️ “Anakartta LGA varsa her LGA işlemci uyar” yanlıştır</div>
          <p>Aynı paket ailesinde farklı soketler ve platform gereksinimleri vardır. Uyumluluk; soketin yanında <b>yonga seti, BIOS/UEFI sürümü ve üreticinin CPU destek listesiyle</b> birlikte kontrol edilir.</p></div>
        <h3>Saat hızı ve çarpan</h3>
        <p>Anakarttaki osilatör/kristal devreleri referans saat sinyali üretir (dış saat). Bu dış hız, <b>işlemcinin çarpanı</b> ile çarpılarak işlemcinin çalışma hızı elde edilir. Ders notundaki örnek: <b>66 MHz × 2 = 132 MHz</b>. Modern işlemcilerde temel saat (BCLK) ve çarpan, işlemci içindeki faz kilitlemeli çevrimler (PLL) yardımıyla farklı saat alanlarına dönüştürülür.</p>
        <div class="lab"><div class="lab-head">⏱️ Laboratuvar: Frekans hesapla, GHz yarışı yap</div><div class="lab-body" id="m5Clock"></div></div>
        <p class="footnote">Notun eski bölümünde “sistem kristali CPU’nun ve diğer bileşenlerin çalışacağı hızı belirler” denir; güncel bölümde ise “tek sistem kristali bütün bilgisayarın hızını doğrudan belirler” yaklaşımının günümüz mimarileri için aşırı basitleştirilmiş olduğu vurgulanır (PLL ve çarpanlar devrededir).</p>
        <p><span class="term">Hız aşırtma (overclock)</span>, işlemciyi üreticinin varsayılan sınırlarının üzerinde frekans ve/veya güç hedefleriyle çalıştırmaktır. Güncel sistemlerde çarpan, BCLK, güç sınırları ve gerilim ayarları etkilidir. Güç tüketimi ve ısıyı artırdığı için kararlılık, soğutma ve bileşen ömrü açısından dikkat ister; garanti koşulları esas alınır.</p>
        <h3>Soğutma</h3>
        <div class="table-wrap"><table>
          <thead><tr><th>Yöntem</th><th>Nasıl çalışır?</th></tr></thead>
          <tbody>
            <tr><td><b>Hava</b></td><td>Isı metal soğutucuya geçer, geniş kanatlar havaya aktarır, fan hava akışını hızlandırır. Bakır (yüksek ısıl iletkenlik) işlemciye yakın, alüminyum (hafif, ucuz) kanatlarda. Fan tozdan temizlenir; rutin yağlama genel bakım değildir, arızalı fan değiştirilir.</td></tr>
            <tr><td><b>Isı borusu</b></td><td>İçindeki az miktar akışkan sıcak bölgede buharlaşır, soğuk bölgede yoğunlaşıp ısıyı kanatlara verir, kılcal yapıyla geri döner.</td></tr>
            <tr><td><b>Buhar odası</b></td><td>Isı borusuna benzer; ısıyı daha geniş ve düz bir yüzeye yayar. Yüksek performanslı dizüstü ve ekran kartlarında.</td></tr>
            <tr><td><b>Sıvı (AIO)</b></td><td>Soğuk plaka → sıvı → pompa → radyatör + fan → geri. AIO: fabrikada kapalı hazır sistem. Her durumda havadan daha iyi <b>değildir</b>.</td></tr>
            <tr><td><b>Termal macun (TIM)</b></td><td>İşlemci ile soğutucu arasındaki mikroskobik hava boşluklarını doldurarak ısıl temas direncini azaltır. Doğrudan soğutmaz, ısının soğutucuya geçişini kolaylaştırır.</td></tr>
          </tbody></table></div>` },

      { id: 'yollar', tag: 'Temel kavramlar', title: 'Veri yolları ve bellek denetleyicisi', minutes: 2, html: `
        <p>Klasik modelde <span class="term">veri yolları (bus)</span>, verilerin bilgisayarın bir parçasından diğerine gönderildiği teller topluluğudur; bilgisayarın içindeki bir otoyol gibi düşünülebilir.</p>
        <ul>
          <li><b>Adres yolu:</b> Erişilecek bellek konumunu veya G/Ç biriminin adresini belirtir. n bitlik adres alanı en fazla <b>2ⁿ</b> farklı adres gösterebilir: 16 bit → 2¹⁶ = <b>65.536</b> adres. (Bu matematiksel bir örnektir; günümüz bilgisayarlarının adres genişliği 16 bit değildir.)</li>
          <li><b>Veri yolu:</b> Asıl veriyi taşır. Kontrol ve adres yollarından farklı olarak <b>çift yönlüdür</b>.</li>
          <li><b>Sistem (kontrol) yolu:</b> Oku/yaz gibi kontrol ve zamanlama sinyallerini taşır.</li>
        </ul>
        <p>“64 bit işlemci” her zaman 64 bitin tamamının adresleme için kullanıldığı anlamına gelmez; desteklenen sanal/fiziksel adres genişliği daha düşük olabilir. Modern sistemlerde tek ortak paralel yol yerine bellek kanalları, PCI Express ve yonga içi bağlantılar kullanılır (Modül 2).</p>
        <p><span class="term">Bellek denetleyicisi</span> (MCC/MCU), RAM ile CPU arasındaki veri alışverişini yönetir. Tarihsel sistemlerde anakartta ayrı yonga veya kuzey köprüsü içindeydi; modern işlemcilerde çoğunlukla işlemci veya SoC içine bütünleşiktir: <b>IMC</b> (Integrated Memory Controller).</p>` },

      { id: 'cekirdek', tag: 'Kavram + etkileşim', title: 'Çekirdek, iş parçacığı, SMT ve hibrit çekirdekler', minutes: 5, init: (r) => { initSMT(r); initHybrid(r); }, html: `
        <div class="table-wrap"><table>
          <thead><tr><th>Kavram</th><th>Ne ifade eder?</th></tr></thead>
          <tbody>
            <tr><td><b>Fiziksel çekirdek</b></td><td>Komut yürütme kaynaklarına sahip gerçek donanım çekirdeği</td></tr>
            <tr><td><b>Thread / iş parçacığı</b></td><td>Bir programın zamanlanabilir yürütme akışı</td></tr>
            <tr><td><b>Mantıksal işlemci</b></td><td>İşletim sisteminin ayrı zamanlama hedefi olarak gördüğü yürütme bağlamı</td></tr>
            <tr><td><b>SMT</b> (Eşzamanlı Çoklu İş Parçacığı)</td><td>Bir fiziksel çekirdeğin kaynaklarını birden çok iş parçacığıyla daha iyi kullanmayı amaçlayan teknik. <b>Hyper-Threading</b>, Intel’in SMT uygulamasının ticari adıdır.</td></tr>
          </tbody></table></div>
        <p><b>SMT fiziksel çekirdek sayısını artırmaz.</b> 8 çekirdekli, 16 iş parçacıklı bir işlemcinin 16 fiziksel çekirdeği yoktur. Kazanç iş yüküne, mikromimariye ve paylaşılan kaynakların kullanımına bağlıdır.</p>
        <div class="lab"><div class="lab-head">🔬 Laboratuvar: Çekirdekler ve SMT</div><div class="lab-body" id="m5Smt"></div></div>
        <p><span class="term">Çok çekirdekli işlemci</span>, aynı pakette iki veya daha fazla fiziksel çekirdek bulundurur. Intel Pentium D ve AMD Athlon 64 X2, 2000’lerin ortasında çok çekirdeğin yaygınlaşmasında rol oynayan erken masaüstü örnekleridir (ama genel anlamda “ilk çift çekirdekli işlemci” değildir).</p>
        <h3>Hibrit çekirdekler</h3>
        <p>Aynı pakette farklı özellikte çekirdekler olabilir: Intel’de <b>P-core</b> (performans) ve <b>E-core</b> (verimlilik); Arm’da big.LITTLE ve DynamIQ. Hangi iş parçacığının hangi çekirdekte çalışacağına <b>işlemci tek başına karar vermez</b>: donanım anlık performans/güç bilgisini sağlar, <b>nihai kararı işletim sistemi zamanlayıcısı</b> verir. Hyper-Threading desteği her ürün ve çekirdek türünde bulunmak zorunda değildir; bazı Core Ultra nesillerinde yoktur.</p>
        <div class="lab"><div class="lab-head">🎮 Oyun: Zamanlayıcı sensin</div><div class="lab-body" id="m5Hybrid"></div></div>
        <div class="box analogy"><div class="box-title">🍳 Günlük hayattan: Mutfakta aşçılar</div>
          <p>Fiziksel çekirdek bir aşçıdır. SMT, aynı aşçının bir yemek fırında beklerken boş elleriyle ikinci yemeği doğraması gibidir: ocaklar ve tezgâh (yürütme kaynakları) paylaşılır, iş biraz hızlanır ama ikinci bir aşçı gelmiş olmaz. Hibrit mutfakta ise usta şefler (P-core) acil siparişlere, çıraklar (E-core) bulaşık ve hazırlık gibi arka plan işlerine bakar.</p>
          <span class="limit">Aşçılar kendi aralarında karar verir; işlemcide görev dağıtımını işletim sistemi zamanlayıcısı yapar. Ayrıca E-core’lar “beceriksiz” değildir; aynı işleri farklı performans/enerji dengesiyle yapar.</span></div>` },

      { id: 'modern', tag: 'Temel kavramlar', title: 'Sınıflar, ISA ve modern hesaplama', minutes: 3, html: `
        <p>İşlemciler; <b>üretici</b> (Intel, AMD, Arm…), <b>model</b> (Pentium, Ryzen 5…), <b>paket</b> (PGA, BGA…), <b>dış hız</b>, <b>çarpan</b>, <b>iç hız</b> (ör. i7 3,9 GHz), <b>model numarası</b>, <b>önbellek</b>, <b>üretim teknolojisi</b> ve <b>çekirdek sayısına</b> göre sınıflandırılabilir.</p>
        <div class="grid cols-2">
          <div class="card"><b>📱 Mobil işlemciler</b><p class="mt0">Sınırlı pil ve dar ısıl alan nedeniyle <b>enerji başına performans</b> (performance per watt) önemlidir. Frekans ve gerilim iş yüküne göre dinamik değişir; CPU ile GPU, bellek denetleyicisi, medya motoru, güvenlik birimleri ve NPU aynı SoC içinde olabilir. x86-64 ve Arm64 kullanılır. (Arm için güncel kullanım “Acorn RISC Machine” değil; Arm, Arm64, AArch64.)</p></div>
          <div class="card"><b>🖥️ Sunucu işlemcileri</b><p class="mt0">Yüksek çekirdek sayısı, geniş bellek, çoklu bellek kanalı, ECC desteği, yüksek PCIe/G-Ç kapasitesi ve RAS (güvenilirlik, erişilebilirlik, servis edilebilirlik). Kısa boost frekansından çok <b>sürdürülebilir verim</b> önemlidir. Örnekler: Intel Xeon, AMD EPYC ve Arm tabanlı sunucular.</p></div>
        </div>
        <p><b>CISC ve RISC:</b> Klasik anlatımda “çok komutlu” ve “az komutlu” diye karşılaştırılır. Modern x86-64 işlemciler karmaşık komutları küçük iç işlemlere (µops) dönüştürebilir; Arm64 ve RISC-V de gelişmiş boru hatları kullanır. x86-64, Arm64 ve RISC-V birer <b>performans sınıfı değil, ISA ailesidir</b>. RISC-V’nin açık standart olması, her RISC-V tasarımının açık kaynak olması gerektiği anlamına gelmez.</p>
        <p class="footnote">Notun eski bölümü “Intel, AMD CISC; IBM PowerPC, Sun Sparc RISC sunucu işlemcisi kullanır” der; güncel bölüm ise “RISC her zaman hızlıdır / CISC her zaman karmaşıktır” gibi mutlak genellemelerden kaçınılmasını ister.</p>
        <h3>Heterojen hesaplama</h3>
        <div class="table-wrap"><table>
          <thead><tr><th></th><th>CPU</th><th>GPU</th><th>NPU</th></tr></thead>
          <tbody>
            <tr><td>Temel rol</td><td>Genel amaçlı yazılım, kontrol akışı</td><td>Yoğun veri paralelliği, grafik</td><td>Yapay zekâ çıkarımını enerji verimli hızlandırma</td></tr>
            <tr><td>Güçlü yanı</td><td>Düşük gecikme, karmaşık dallanma</td><td>Çok sayıda benzer işlem</td><td>Matris/tensör işlemlerinde watt başına yüksek verim</td></tr>
            <tr><td>Sınır</td><td>Yoğun paralel işte daha az verimli</td><td>Karmaşık seri akışta verimsiz</td><td>CPU’nun yerine geçmez; yazılım/model desteğine bağlı</td></tr>
          </tbody></table></div>
        <p><span class="term">TOPS</span>, belirli sayısal hassasiyet altında teorik işlem kapasitesidir. INT8 ile FP16 gibi farklı veri türlerinde verilen değerler <b>doğrudan eşdeğer değildir</b>. Copilot+ PC sınıfı birçok özellik için 40+ TOPS NPU ister; bu sayı NPU’nun evrensel tanımı değildir ve “AI PC” için tek bir sektör standardı yoktur.</p>
        <ul>
          <li><b>SoC:</b> Artık her zaman tek monolitik silikon değil; aynı mantıksal SoC birden fazla die’dan oluşabilir (ör. Apple M5 Pro/Max, Snapdragon X2 Elite).</li>
          <li><b>Chiplet:</b> İşlevler küçük yongalara ayrılıp paket içi bağlantılarla birleştirilir. Artı: küçük yongalar, farklı üretim süreçleri, esnek ölçek. Eksi: paket içi gecikme, güç dağıtımı, paketleme karmaşıklığı. (AMD Zen tabanlı Ryzen/EPYC.)</li>
          <li><b>3B paketleme / yığılmış önbellek:</b> Katmanlar dikey bütünleştirilir. Örnek: AMD 3D V-Cache ek L3 kapasitesi sağlar; ama ısı yoğunluğu ve üretim karmaşıklığı artar.</li>
        </ul>
        <p><b>Hesaplama-sınırlı</b> iş yükünde performansı işlem biriminin kapasitesi sınırlar (bilimsel hesap, matris çarpımı). <b>Bellek-sınırlı</b> iş yükünde işlem birimi verinin bellekten gelmesini bekler; sınır bellek gecikmesi, bant genişliği ve veri hareketidir. Aynı uygulamanın farklı aşamaları farklı darboğaz gösterebilir.</p>` },

      pcie2: { n: 'PCIe yuvası: fiziksel x16, elektriksel x4', s: [[56, 384, 364, 24]], src: 'pch', d: 'Bir yuvanın fiziksel olarak x16 uzunluğunda olması, elektriksel olarak <b>her zaman x16 hatla çalıştığı anlamına gelmez</b>. Tasarıma göre x8 veya x4 bağlantı sağlayabilir; bu örnekte hatlar yonga setinden geliyor.' },
      sata: { n: 'SATA portları', s: [[538, 328, 40, 96]], src: 'pch', d: 'HDD ve 2,5 inç SSD gibi SATA aygıtları için. Çoğunlukla yonga seti üzerinden sağlanır; bazı portlar M.2 yuvalarıyla hat paylaşabilir.' },
      spi: { n: 'Firmware (BIOS/UEFI) flash yongası', s: [[372, 440, 48, 28]], src: '', d: 'Modern anakartlarda firmware kodu genellikle yeniden programlanabilir <b>SPI NOR flash</b> bellekte saklanır. “BIOS bir ROM yongasıdır” ifadesi modern sistemler için aşırı geneldir. Firmware sağlayıcısı, anakart üreticisi ve flash yongasının üreticisi farklı kuruluşlar olabilir.' },
      rtc: { n: 'RTC pili (“CMOS pili”)', s: 'circle', src: '', d: 'Gerçek zaman saatini (RTC) çalıştırır ve platforma bağlı bazı düşük güç alanlarını destekler. Tarih/saatin sürekli sıfırlanması bu pille ilişkili olabilir. <b>Pilin çıkarılması tüm ayarları veya güvenlik parolalarını evrensel olarak silmez.</b>' },
      tpm: { n: 'TPM başlığı', s: [[270, 450, 62, 22]], src: '', d: 'Ayrık bir Güvenilir Platform Modülü (TPM) takılabilir. TPM bütünleşik veya firmware tabanlı da olabilir (Intel PTT, AMD fTPM). Kriptografik anahtar koruma ve güven kökü işlevleri sağlar.' },
      front: { n: 'Ön panel başlıkları', s: [[488, 468, 90, 24]], src: '', d: 'Güç düğmesi, LED’ler, ön USB ve USB Type-C başlıkları. Anakartı sökmeden önce <b>ön panel kablolarının yerini not al</b>; ilk açılıştan önce kılavuzla doğrula.' }
    };
    const keys = Object.keys(P);
    const center = (k) => { const s = P[k].s; if (s === 'circle') return [470, 455]; const r = s[0]; return [r[0] + r[2] / 2, r[1] + r[3] / 2]; };
    host.innerHTML = `
      <p class="lab-hint">Bir parçaya tıkla (veya Tab ile gelip Enter’a bas). Küçük ekranda aşağıdaki listeden de seçebilirsin. <b>Hat kaynaklarını göster</b> ile hangi bağlantının işlemciden, hangisinin yonga setinden geldiğini gör. <i>(Kavramsal şema; gerçek kartlarda yerleşim modele göre değişir.)</i></p>
      <div class="btn-row">
        <button type="button" class="btn small" data-a="lines" aria-pressed="false">🔀 Hat kaynaklarını göster</button>
        <label class="field" style="flex-direction:row;align-items:center">Parça: <select data-r="pick">${keys.map((k) => `<option value="${k}">${P[k].n}</option>`).join('')}</select></label>
      </div>
      <svg viewBox="0 0 600 520" role="group" aria-label="Kavramsal masaüstü anakart şeması" style="width:100%;max-width:640px;display:block;margin:auto" data-r="svg"></svg>
      <p class="center muted" style="font-size:.82rem" data-r="legend"></p>
      <div class="ex-detail" data-r="d" aria-live="polite"></div>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function draw() {
      let g = '<rect x="6" y="6" width="588" height="508" rx="14" fill="#1f5b46" stroke="#123b2d" stroke-width="3"/>';
      // ince devre yolları (süs değil: “baskılı devre kartı” fikri)
      for (let i = 0; i < 9; i++) g += `<path d="M${90 + i * 50} 500 V470 H${120 + i * 50}" stroke="#2f7a5e" stroke-width="2" fill="none"/>`;
      if (lines) {
        const [cx, cy] = center('cpu'), [px, py] = center('pch');
        ['dimm', 'm2a', 'pcie1'].forEach((k) => { const [x, y] = center(k); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#ffb547" stroke-width="5" stroke-dasharray="9 6" class="flowline" opacity=".95"/>`; });
        ['m2b', 'pcie2', 'sata'].forEach((k) => { const [x, y] = center(k); g += `<line x1="${px}" y1="${py}" x2="${x}" y2="${y}" stroke="#8db0ff" stroke-width="5" stroke-dasharray="9 6" class="flowline" opacity=".95"/>`; });
        g += `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#fff" stroke-width="3" stroke-dasharray="3 5" opacity=".8"/>`;
      }
      keys.forEach((k) => {
        const p = P[k], on = k === sel;
        const fill = k === 'cpu' ? '#cfd8d3' : k === 'pch' ? '#3a4a55' : k === 'dimm' ? '#203a30' : k.startsWith('pcie') ? '#1b1b1b' : k.startsWith('m2') ? '#2b2b2b' : k === 'vrm' ? '#2f3a36' : '#e8e2cf';
        const strokeC = on ? '#ffbf47' : (lines && p.src === 'cpu' ? '#ffb547' : lines && p.src === 'pch' ? '#8db0ff' : '#0b2a20');
        let shapes = '';
        if (p.s === 'circle') shapes = `<circle cx="470" cy="455" r="22" fill="#c8ccd0" stroke="${strokeC}" stroke-width="${on ? 4 : 2}"/>`;
        else shapes = p.s.map((r) => `<rect x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="4" fill="${fill}" stroke="${strokeC}" stroke-width="${on ? 4 : 2}"/>`).join('');
        const [x, y] = center(k);
        const short = { io: 'G/Ç', cmos: 'CMOS', vrm: 'VRM', eps: 'EPS', cpu: 'CPU', dimm: 'DIMM', atx: 'ATX', m2a: 'M.2 (CPU)', pcie1: 'PCIe x16 (CPU)', pch: 'PCH', m2b: 'M.2 (PCH)', pcie2: 'PCIe x16 fiz./x4 (PCH)', sata: 'SATA', spi: 'SPI', rtc: 'RTC', tpm: 'TPM', front: 'Ön panel' }[k];
        const dark = ['cpu', 'spi', 'rtc', 'tpm', 'front', 'eps', 'atx', 'io', 'cmos', 'sata'].includes(k);
        const ty = k === 'dimm' ? 292 : k === 'vrm' ? 48 : y + 5;
        const tx = k === 'dimm' ? 447 : k === 'vrm' ? 214 : x;
        const rot = (k === 'atx' || k === 'sata' || k === 'io') ? `transform="rotate(-90 ${tx} ${ty - 5})"` : '';
        g += `<g class="lvl" tabindex="0" role="button" data-k="${k}" aria-label="${p.n}" aria-pressed="${on}" style="cursor:pointer">${shapes}
          <text x="${tx}" y="${ty}" ${rot} text-anchor="middle" font-size="12" font-weight="800" fill="${k === 'dimm' ? '#fff' : dark ? '#1b1b1b' : '#f2f2f2'}" style="pointer-events:none">${short}</text></g>`;
      });
      R('svg').innerHTML = g;
      R('legend').innerHTML = lines ? '<span style="color:#d98b10;font-weight:700">━ turuncu</span>: işlemciden gelen hatlar · <span style="color:#3f6fd8;font-weight:700">━ mavi</span>: yonga setinden (PCH) gelen hatlar · beyaz: CPU–PCH bağlantısı' : '';
      $('[data-a="lines"]', host).setAttribute('aria-pressed', String(lines));
      $('[data-a="lines"]', host).classList.toggle('primary', lines);
    }
    function show(k) {
      sel = k; R('pick').value = k;
      const p = P[k];
      const src = p.src === 'cpu' ? '<span class="chip accent">Hat kaynağı: işlemci</span>' : p.src === 'pch' ? '<span class="chip" style="background:var(--info-soft);color:var(--info)">Hat kaynağı: yonga seti</span>' : '';
      R('d').innerHTML = `<h4>${p.n} ${src}</h4><p class="mt0">${p.d}</p>`;
      draw();
      const g = $(`.lvl[data-k="${k}"]`, host); if (g && host.contains(document.activeElement) && document.activeElement.classList.contains('lvl')) g.focus();
    }
    host.addEventListener('click', (e) => {
      const g = e.target.closest('.lvl'); if (g) { show(g.dataset.k); return; }
      if (e.target.closest('[data-a="lines"]')) { lines = !lines; draw(); }
    });
    host.addEventListener('keydown', (e) => { const g = e.target.closest('.lvl'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); show(g.dataset.k); } });
    R('pick').addEventListener('change', (e) => show(e.target.value));
    show('cpu');
  }

  /* ---------- Etkileşim 2: Uyumluluk dedektifi ---------- */
  function initCompat(root) {
    const host = $('#m6Compat', root);
    const CHECKS = [
      { k: 'socket', t: 'İşlemcinin fiziksel soketi anakartın soketiyle aynı', fix: 'Soket farklı: işlemci fiziksel olarak takılamaz. Aynı paket ailesi (ör. LGA) aynı soket demek değildir.' },
      { k: 'list', t: 'İşlemci, anakart üreticisinin CPU destek listesinde var', fix: 'Destek listesinde yok: soket ve yonga seti uysa bile kart bu işlemciyi desteklemeyebilir.' },
      { k: 'bios', t: 'Kartta destek listesinin istediği BIOS/UEFI sürümü yüklü', fix: 'Gerekli firmware sürümü yok: üreticinin resmi paketi ve yöntemiyle (ör. destekliyorsa BIOS Flashback) güncelleme gerekir.' },
      { k: 'vrm', t: 'Anakartın güç/VRM tasarımı işlemcinin güç sınıfına yeterli', fix: 'VRM yetersiz: işlemci kararsız çalışabilir veya güç sınırlarında kısılabilir.' },
      { k: 'ram', t: 'RAM nesli (DDR4/DDR5) ve modül türü anakart/işlemciyle uyumlu', fix: 'RAM uyumsuz: DDR4 ve DDR5 fiziksel ve elektriksel olarak birbirine uymaz (Modül 7).' },
      { k: 'case', t: 'Kasa, anakartın form faktörünü (ölçü ve montaj noktaları) destekliyor', fix: 'Kasa uyumsuz: form faktörü adı yetmez; üreticinin ölçü ve montaj noktaları doğrulanmalı.' }
    ];
    const SCEN = [
      { n: 'Senaryo 1: Yeni nesil işlemci', txt: 'Ayşe yeni nesil bir işlemci aldı. Soket aynı, işlemci destek listesinde var ama liste “F12 ve sonrası firmware” diyor; kartta F10 yüklü. RAM, kasa ve VRM uygun.', set: { socket: 1, list: 1, bios: 0, vrm: 1, ram: 1, case: 1 } },
      { n: 'Senaryo 2: “İkisi de LGA”', txt: 'Mehmet “işlemci de anakart da LGA, kesin uyar” diyor. Ama işlemcinin soketi farklı bir LGA soketi.', set: { socket: 0, list: 0, bios: 1, vrm: 1, ram: 1, case: 1 } },
      { n: 'Senaryo 3: Eski RAM', txt: 'Zeynep DDR5 destekli yeni bir sisteme eski bilgisayarındaki DDR4 modülleri takmak istiyor. Diğer her şey uygun.', set: { socket: 1, list: 1, bios: 1, vrm: 1, ram: 0, case: 1 } }
    ];
    const st = {}; CHECKS.forEach((c) => { st[c.k] = true; });
    host.innerHTML = `
      <p class="lab-hint">Bir senaryo seç veya kutuları kendin işaretle. Dedektif, eksik koşulları ve ne yapılması gerektiğini anında söyler.</p>
      <div class="btn-row">${SCEN.map((s, i) => `<button type="button" class="btn small" data-s="${i}">${s.n}</button>`).join('')}<button type="button" class="btn small ghost" data-s="all">Hepsi uygun</button></div>
      <p class="live" data-r="story" aria-live="polite" style="min-height:0"></p>
      <fieldset style="border:1px solid var(--line);border-radius:12px;padding:10px 14px"><legend style="font-weight:700;padding:0 6px">Kontrol listesi</legend>
        ${CHECKS.map((c) => `<label style="display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer"><input type="checkbox" data-k="${c.k}" style="margin-top:5px;width:18px;height:18px"> <span>${c.t}</span></label>`).join('')}
      </fieldset>
      <div class="box" data-r="verdict" aria-live="polite"></div>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function paint() {
      CHECKS.forEach((c) => { $(`input[data-k="${c.k}"]`, host).checked = !!st[c.k]; });
      const bad = CHECKS.filter((c) => !st[c.k]);
      const v = R('verdict');
      v.className = 'box ' + (bad.length ? 'warn' : 'summary');
      v.innerHTML = bad.length
        ? `<div class="box-title">🔍 Uyumsuzluk bulundu (${bad.length})</div><ul>${bad.map((c) => `<li>${c.fix}</li>`).join('')}</ul>`
        : '<div class="box-title">✅ Uyumlu görünüyor</div><p>Fiziksel soket, yonga seti/destek listesi, firmware sürümü, güç, bellek ve kasa birlikte kontrol edildi. Sistem bu sırayla değerlendirilir; yalnız sokete bakmak yetmez.</p>';
    }
    host.addEventListener('change', (e) => { const k = e.target.dataset.k; if (k) { st[k] = e.target.checked; paint(); } });
    host.addEventListener('click', (e) => {
      const b = e.target.closest('[data-s]'); if (!b) return;
      if (b.dataset.s === 'all') { CHECKS.forEach((c) => { st[c.k] = true; }); R('story').textContent = ''; }
      else { const s = SCEN[+b.dataset.s]; Object.assign(st, Object.fromEntries(Object.entries(s.set).map(([k, v]) => [k, !!v]))); R('story').innerHTML = `<b>${s.n}.</b> ${s.txt}`; }
      $$('[data-s]', host).forEach((x) => x.classList.toggle('primary', x === b));
      paint();
    });
    paint();
  }

  /* ---------- Etkileşim 4: Önyükleme akışı (Legacy / UEFI) ---------- */
  function initBoot(root) {
    const host = $('#m6Boot', root);
    let mode = 'uefi', sb = true, signed = true;
    host.innerHTML = `
      <div class="btn-row" role="group" aria-label="Önyükleme kipi">
        <button type="button" class="btn small" data-m="legacy">Tarihsel: Legacy BIOS / MBR</button>
        <button type="button" class="btn small" data-m="uefi">Modern: UEFI / GPT</button>
      </div>
      <div class="btn-row" data-r="opts">
        <label class="field" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-o="sb" checked> Secure Boot etkin</label>
        <label class="field" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-o="signed" checked> Önyükleyici güvenilen bir imzaya sahip</label>
      </div>
      <div data-r="flow"></div>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function build() {
      $$('[data-m]', host).forEach((b) => b.classList.toggle('primary', b.dataset.m === mode));
      R('opts').style.display = mode === 'uefi' ? '' : 'none';
      let nodes, steps;
      if (mode === 'legacy') {
        nodes = [{ ico: '⚡', label: 'Güç / PWR_OK' }, { ico: '🔁', label: 'Reset → firmware' }, { ico: '🧪', label: 'Başlatma + POST' }, { ico: '🧩', label: 'Option ROM' }, { ico: '🔎', label: 'Önyükleme sırası' }, { ico: '💽', label: 'MBR' }, { ico: '🖥️', label: 'Önyükleyici → çekirdek' }];
        steps = [
          { node: 0, token: 'güç', text: 'Güç kaynağı ve platform güç devreleri gerilimlerin kararlı hâle gelmesini bekler. ATX sistemlerde <b>PWR_OK</b> bu sürece ilişkin sinyallerden biridir.' },
          { node: 1, token: 'reset', text: 'İşlemci reset durumundan çıkar ve mimarisinin tanımladığı başlangıç adresinden firmware kodunu yürütmeye başlar.' },
          { node: 2, token: 'POST', text: 'Legacy BIOS temel platform ve bellek başlatma işlemlerini yapar; <b>POST</b> kapsamında belirli hata koşullarını denetler. Sorun varsa bip sesleri duyulabilir.' },
          { node: 3, token: 'ROM', text: 'Gerekirse görüntü bağdaştırıcısı veya diğer aygıtlara ait <b>Option ROM</b> kodları çalıştırılır.' },
          { node: 4, token: 'sıra', text: 'BIOS, yapılandırılmış <b>önyükleme sırasına</b> göre disk, USB, optik aygıt veya ağ gibi kaynakları değerlendirir.' },
          { node: 5, token: 'MBR', text: 'MBR tabanlı bir disk seçilince diskin ilk mantıksal sektöründeki <b>Master Boot Record</b> belleğe yüklenir ve içindeki önyükleme kodu çalıştırılır.' },
          { node: 6, token: 'OS', text: 'Sonraki aşamada önyükleyici işletim sistemi çekirdeğini ve gerekli bileşenleri yükler. Geçerli yol bulunamazsa BIOS başka kaynağı dener veya hata verir.' }
        ];
      } else {
        nodes = [{ ico: '⚡', label: 'Güç + reset' }, { ico: '⚙️', label: 'Platform başlatma' }, { ico: '🔎', label: 'Aygıt keşfi + UEFI sürücüleri' }, { ico: '🧪', label: 'POST' }, { ico: '📋', label: 'Boot Manager (NVRAM)' }, { ico: '🔐', label: 'Secure Boot' }, { ico: '💽', label: 'ESP: .efi yükleyici' }, { ico: '🖥️', label: 'İşletim sistemi' }];
        steps = [
          { node: 0, token: 'güç', text: 'Sistem güç alır, işlemci reset durumundan çıkar ve firmware başlangıç kodunu yürütür.' },
          { node: 1, token: 'init', text: '<b>UEFI platform başlatma aşamaları</b> işlemciyi, belleği ve temel platform bileşenlerini hazırlar.' },
          { node: 2, token: 'sürücü', text: 'Firmware gerekli aygıtları keşfeder, ilgili <b>UEFI sürücülerini ve hizmetlerini</b> başlatır.' },
          { node: 3, token: 'POST', text: 'Firmware başlangıç kontrolleri ve <b>POST</b> yürütülür. POST tam kapsamlı bir donanım teşhis testi değildir.' },
          { node: 4, token: 'Boot####', text: '<b>UEFI Boot Manager</b>, NVRAM’de kayıtlı <code>Boot####</code> girdilerini değerlendirir.' }
        ];
        if (!sb) {
          steps.push({ node: 5, token: '—', text: '<b>Secure Boot kapalı:</b> yüklenecek UEFI bileşenlerinin imzası doğrulanmadan devam edilir. (Bu, yetkisiz pre-OS yazılımı engelleyen katmanın devre dışı olduğu anlamına gelir.)' });
        } else if (signed) {
          steps.push({ node: 5, token: '✓ imza', text: '<b>Secure Boot etkin:</b> seçilen UEFI bileşeninin imzası güven politikası çerçevesinde doğrulandı ✓' });
        } else {
          steps.push({ node: 5, token: '✗ imza', text: '❌ <b>Secure Boot doğrulaması başarısız:</b> önyükleyicinin imzası güven veritabanıyla eşleşmedi; bileşen <b>çalıştırılmadı</b>. Önyükleme burada durur. Amaç tam olarak budur: yetkisiz veya değiştirilmiş pre-OS yazılımın çalışmasını engellemek.' });
        }
        if (!(sb && !signed)) {
          steps.push({ node: 6, token: '.efi', text: 'Uygun <b>EFI System Partition (ESP)</b> üzerindeki <code>.efi</code> önyükleyici çalıştırılır; Windows Boot Manager, GRUB veya başka bir önyükleyici süreci devralır.' });
          steps.push({ node: 7, token: 'OS', text: 'İşletim sistemi çekirdeği ve sürücüleri yüklenir; normal çalışmaya geçilir. Disk <b>GPT</b> ile bölümlenmiştir.' });
        }
      }

      { id: 'bios', tag: 'Kavram + etkileşim', title: 'BIOS, firmware güvenliği ve CMOS', minutes: 4, init: initSec, html: `
        <p><span class="term">BIOS</span> (Temel Giriş/Çıkış Sistemi), tarihsel PC firmware yaklaşımıdır; güncel bilgisayarlarda aynı görev çoğunlukla <span class="term">UEFI</span> ile yapılır. Günlük dilde “BIOS” UEFI ayar ekranını da ifade eder. <b>Firmware</b>, işletim sisteminden önce temel platform başlatma, donanım keşfi, önyükleme seçimi, yapılandırma ve güvenlik işlevlerini yürütür; çalışma zamanı aygıt yönetimini sonra işletim sistemi sürücülerine devreder.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Bileşen</th><th>Temel işlev</th></tr></thead>
          <tbody>
            <tr><td>BIOS/UEFI firmware</td><td>Anakartın başlatma ve önyükleme yazılımı</td></tr>
            <tr><td>SPI NOR Flash</td><td>Firmware kodunun kalıcı saklama alanı</td></tr>
            <tr><td>NVRAM / firmware değişkenleri</td><td>Boot girdileri ve kalıcı yapılandırma</td></tr>
            <tr><td>RTC</td><td>Tarih/saat işlevi</td></tr>
            <tr><td>RTC pili</td><td>RTC’yi ve platforma bağlı düşük güç alanlarını besler</td></tr>
          </tbody></table></div>
        <p><b>Görevleri:</b> başlangıç ayarları, önyükleme girdisini/sırasını belirleme, yerleşik parçaları açıp kapama, sıcaklık/fan/gerilim izleme, POST ile temel kontroller. Firmware, işletim sistemine <b>ACPI</b> tablolarıyla donanım ve güç bilgisi sunar; ACPI bir firmware türü değil, firmware ile işletim sistemi arasındaki standarttır. Gerilim dönüşümünü firmware değil <b>VRM</b> yapar; firmware yalnızca yapılandırır.</p>
        <p><b>Ayar ekranına giriş:</b> Masaüstünde genellikle <kbd>Del</kbd> veya <kbd>F2</kbd>; bazı dizüstü/OEM sistemlerde <kbd>F1</kbd>, <kbd>F10</kbd>, <kbd>F12</kbd> veya <kbd>Esc</kbd>. Windows’ta Gelişmiş Başlangıç → “UEFI Firmware Settings” de kullanılabilir. AMI, Award ve Phoenix tarihsel olarak firmware kod tabanı sağlayan firmalardır.</p>
        <div class="box analogy"><div class="box-title">🎭 Günlük hayattan: Perde açılmadan önceki ekip</div>
          <p>Tiyatroda perde açılmadan önce sahne ekibi ışıkları, dekoru ve sesi kontrol eder, oyuncuları yerine yerleştirir; oyun başlayınca kenara çekilir. Firmware de işletim sistemi (oyun) başlamadan önce donanımı hazırlar ve kontrolü ona devreder.</p>
          <span class="limit">Sahne ekibi oyun boyunca hazır bekleyip müdahale edebilir; firmware ise çalışma zamanında aygıt yönetimini büyük ölçüde işletim sistemi sürücülerine bırakır. Ayrıca firmware bir “ekip” değil, flash bellekte saklanan bir yazılımdır.</span></div>
        <h3>Firmware güvenliği</h3>
        <p>Firmware işletim sisteminden önce çalıştığı için güvenliğin kritik parçasıdır. Güncel önlemler: <b>imzalı firmware güncellemeleri</b>, Secure Boot, TPM tabanlı ölçümler, donanımsal yazma korumaları, güvenilir kurtarma mekanizmaları. <b>NIST SP 800-193</b> bunu üç yetenekle özetler: <b>koru</b> (imzalı güncelleme, yazma koruması) – <b>algıla</b> (bütünlük kontrolü) – <b>kurtar</b> (dual firmware, recovery). 2011 tarihli bazı Secure Boot sertifikalarının süresi Haziran 2026’dan itibaren dolmaya başladı; Microsoft 2023 sertifikalarına geçiş yürütüyor. Bu, firmware güvenliğinin cihaz ömrü boyunca güncel tutulması gerektiğini gösterir.</p>
        <div class="lab"><div class="lab-head">🎮 Oyun: Secure Boot mu, Measured Boot mu, TPM mi?</div><div class="lab-body" id="m6Sec"></div></div>
        <h3>CMOS gerçekte nedir?</h3>
        <p><span class="term">CMOS</span> (Tamamlayıcı Metal Oksit Yarı İletken), NMOS ve PMOS transistörlerin birlikte kullanıldığı bir <b>tümleşik devre teknolojisinin</b> adıdır. Tarihsel PC’lerde RTC verisi ve ayarların tutulduğu küçük düşük güçlü bellek “CMOS RAM” diye anıldığı için “CMOS Setup” ifadesi BIOS ekranıyla özdeşleşti. Modern sistemlerde ayarlar NVRAM/flash içinde tutulabilir.</p>
        <div class="box note"><div class="box-title">ℹ️ Not: Clear CMOS ve pil parolayı siler mi?</div>
          <p>Hafta 5 notunun tarihsel bölümünde “jumper ile BIOS’un sıfırlanabilmesi” güvenlik/kurtarma önlemi olarak sayılır ve “CMOS pilini yenisiyle değiştirin” gibi öneriler geçer. Aynı notun güncel bölümleri ise açıkça şunu söyler: <b>Clear CMOS veya RTC pilinin çıkarılması firmware parolasını, TPM verilerini ve diğer güvenlik bilgilerini mutlaka silmez</b>; pilin çıkarılması da tüm ayarları evrensel olarak sıfırlamaz. Unutulan parola için yalnız yetkili kullanıcı <b>üreticinin resmi sıfırlama/servis prosedürünü</b> izlemelidir. Sınavda güncel açıklamayı esas al.</p></div>
        <h3>BIOS bip kodları (tarihsel örnekler)</h3>
        <div class="table-wrap"><table><thead><tr><th>Bip</th><th>Anlam (ders notundaki örnek)</th></tr></thead><tbody>
          <tr><td>Sürekli bip</td><td>Güç kaynağı arızası</td></tr><tr><td>Birçok kısa bip</td><td>Anakart arızası</td></tr>
          <tr><td>1 uzun</td><td>Bellek tazelemesinde hata</td></tr><tr><td>1 uzun 1 kısa</td><td>Anakart veya BIOS çipi arızası</td></tr>
          <tr><td>1 uzun 2 kısa / 1 uzun 3 kısa</td><td>Ekran kartı arızası</td></tr><tr><td>2 uzun 1 kısa</td><td>Ekran kartı arızası (RAMDAC)</td></tr>
          <tr><td>2 kısa</td><td>RAM parity (eşlik) hatası</td></tr><tr><td>3 kısa</td><td>RAM’in ilk 64K’lık bölümünde hata</td></tr>
        </tbody></table></div>
        <p class="footnote">Bu bip kodları tarihsel ve üreticiye özgüdür; evrensel değildir. Gerçek bir kartta bip, debug LED ve Q-Code anlamları yalnız o modelin kılavuzuyla yorumlanır.</p>
        <p><b>Firmware güncellemesi:</b> Yalnız ilgili modelin resmi paketiyle ve üreticinin yöntemiyle; sürüm notları okunur, BitLocker gibi TPM korumaları varsa kurtarma anahtarı hazır tutulur, güncelleme sırasında <b>güç kesilmez</b> (dizüstünde adaptör takılı). Kesinti sistemi açılmaz hâle getirebilir; o zaman üreticinin recovery/BIOS Flashback prosedürü izlenir. Sonrasında önyükleme, Secure Boot, TPM ve bellek ayarları yeniden kontrol edilir.</p>` },

      { id: 'uefi', tag: 'Kavram + etkileşim', title: 'UEFI, GPT ve önyükleme süreci', minutes: 4, init: initBoot, html: `
        <p><span class="term">UEFI</span> (Birleşik Genişletilebilir Ürün Yazılımı Arabirimi), platform firmware’i ile işletim sistemi ve önyükleme yazılımları arasında standart veri yapıları, protokoller ve hizmetler tanımlayan modern firmware arabirimidir. Intel’in EFI çalışmalarının devamı olarak UEFI Forum tarafından standartlaştırılmıştır. UEFI yalnızca “grafik arayüzlü yeni BIOS” değildir; fare veya grafik arayüz UEFI için zorunlu da değildir.</p>
        <ul>
          <li>UEFI Boot Manager ile NVRAM tabanlı önyükleme girdileri</li>
          <li>EFI uygulamaları ve firmware sürücüleri çalıştırabilme</li>
          <li>EFI System Partition (ESP) ile standart önyükleme</li>
          <li>Secure Boot ile yetkisiz pre-OS bileşenleri sınırlama</li>
          <li>GPT ile büyük disk ve esnek bölümleme; Capsule ile standart firmware güncellemesi</li>
          <li>Eski sistemlerle uyumluluk için bazı platformlarda CSM (modern sistemlerde bulunmayabilir)</li>
        </ul>
        <div class="table-wrap"><table>
          <thead><tr><th></th><th>MBR (Legacy)</th><th>GPT (UEFI)</th></tr></thead>
          <tbody>
            <tr><td>Bölüm sayısı</td><td>Yalnız <b>4</b> bölümün bilgisi</td><td>Daha fazla bölüm girdisi</td></tr>
            <tr><td>Disk boyutu</td><td><b>2,2 TB</b>’tan büyük diskleri kullanamaz</td><td>Yüksek kapasite</td></tr>
            <tr><td>Dayanıklılık</td><td>—</td><td>Yedek bölüm tablosu</td></tr>
          </tbody></table></div>

        <div class="lab"><div class="lab-head">🚀 Laboratuvar: Önyükleme yolculuğu <span class="chip">Secure Boot dene</span></div><div class="lab-body" id="m6Boot"></div></div>

/* =========================================================
   MODÜL 7 — Bellek Sistemleri (RAM)
   Kaynak: Hafta 6 ders notu
   ========================================================= */
(function () {

  /* ---------- Etkileşim 1: CAS gecikmesi hesaplayıcı ---------- */
  function initCL(root) {
    const host = $('#m7CL', root);
    const st = { a: { mt: 6000, cl: 30 }, b: { mt: 3200, cl: 16 } };
    const card = (k, t) => `<div class="card" style="margin:0"><b>${t}</b>
      <label class="field">Veri hızı (MT/s)<input type="number" min="100" max="20000" step="100" data-k="${k}.mt"></label>
      <label class="field">CL (çevrim)<input type="number" min="1" max="80" step="1" data-k="${k}.cl"></label>
      <div class="readout" style="margin-top:10px"><div class="k">Yaklaşık CAS gecikmesi</div><div class="v" data-r="${k}"></div></div></div>`;
    host.innerHTML = `
      <p class="lab-hint">Ders notundaki formül: <b>t<sub>CL</sub>(ns) = 2000 × CL / veri hızı (MT/s)</b>. İki modülü karşılaştır: daha büyük CL her zaman daha yavaş mı?</p>
      <div class="btn-row"><span class="muted" style="font-size:.85rem">Hazır:</span>
        <button type="button" class="btn small" data-p="6000,30,3200,16">DDR5-6000 CL30 ↔ 3200 CL16</button>
        <button type="button" class="btn small" data-p="6000,30,6000,36">Aynı hız, farklı CL</button>
        <button type="button" class="btn small" data-p="4800,40,6400,40">Aynı CL, farklı hız</button>
      </div>
      <div class="grid cols-2">${card('a', 'Modül A')}${card('b', 'Modül B')}</div>
      <div style="margin-top:12px" aria-hidden="true">
        <div class="muted" style="font-size:.85rem">A</div><div class="bar" style="height:16px"><span data-r="ba" style="background:var(--accent)"></span></div>
        <div class="muted" style="font-size:.85rem;margin-top:6px">B</div><div class="bar" style="height:16px"><span data-r="bb"></span></div>
      </div>
      <p class="live" data-r="msg" aria-live="polite"></p>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    const ns = (x) => 2000 * x.cl / x.mt;
    function paint() {
      ['a', 'b'].forEach((k) => { $(`[data-k="${k}.mt"]`, host).value = st[k].mt; $(`[data-k="${k}.cl"]`, host).value = st[k].cl; R(k).textContent = fmt(ns(st[k]), 2) + ' ns'; });
      const A = ns(st.a), B = ns(st.b), mx = Math.max(A, B);
      R('ba').style.width = (A / mx) * 100 + '%'; R('bb').style.width = (B / mx) * 100 + '%';
      const near = Math.abs(A - B) < 0.05;
      R('msg').innerHTML = `A: 2000 × ${st.a.cl} / ${st.a.mt} = <b>${fmt(A, 2)} ns</b> · B: 2000 × ${st.b.cl} / ${st.b.mt} = <b>${fmt(B, 2)} ns</b>. ` +
        (near ? 'İkisinin CAS gecikmesi <b>neredeyse aynı</b>! CL sayısı farklı ama veri hızları da farklı olduğu için nanosaniye cinsinden sonuç eşitleniyor.'
          : `Kısa çizgi daha düşük gecikme demek: <b>${A < B ? 'A' : 'B'}</b> daha hızlı cevap veriyor.`) +
        ' Unutma: Bellek zamanlaması yalnız CL’den oluşmaz; t<sub>RCD</sub>, t<sub>RP</sub>, t<sub>RAS</sub> ve bant genişliği de gerçek performansı etkiler.';
    }
    host.addEventListener('input', (e) => { const k = e.target.dataset.k; if (!k) return; const [m, f] = k.split('.'); const v = parseFloat(e.target.value); if (v > 0) { st[m][f] = v; R(m).textContent = fmt(ns(st[m]), 2) + ' ns'; const A = ns(st.a), B = ns(st.b), mx = Math.max(A, B); R('ba').style.width = (A / mx) * 100 + '%'; R('bb').style.width = (B / mx) * 100 + '%'; } });
    host.addEventListener('change', (e) => { if (e.target.dataset.k) paint(); });
    host.addEventListener('click', (e) => { const b = e.target.closest('[data-p]'); if (!b) return; const [a1, a2, b1, b2] = b.dataset.p.split(',').map(Number); st.a = { mt: a1, cl: a2 }; st.b = { mt: b1, cl: b2 }; paint(); });
    paint();
  }

  /* ---------- Etkileşim 2: Sanal bellek ve sayfa hatası ---------- */
  function initVM(root) {
    const host = $('#m7VM', root);
    const SEQ = ['A', 'B', 'C', 'A', 'B', 'D', 'A', 'E', 'B', 'A', 'C', 'D', 'A', 'B'];
    let frames = 3, ram, i, hits, faults, playing = false;
    host.innerHTML = `
      <p class="lab-hint">Program sırayla A, B, C… <b>sayfalarına</b> erişiyor. Sayfa RAM’deyse hızlıdır (isabet). Değilse <b>sayfa hatası</b> olur: işletim sistemi sayfayı SSD/HDD’deki sayfa dosyasından getirir; RAM doluysa en eski sayfayı çıkarır. RAM boyutunu değiştirip kaç sayfa hatası olduğuna bak. <i>(Kavramsal model.)</i></p>
      <label class="field">RAM’deki sayfa yeri (çerçeve): <b data-r="fv"></b><input type="range" min="2" max="5" value="3" data-r="fr"></label>
      <p class="mono" data-r="seq" style="font-size:1rem;letter-spacing:.06em"></p>
      <div style="position:relative" data-r="area">
        <div class="grid cols-2">
          <div class="sim-panel"><h4>RAM (hızlı, uçucu)</h4><div data-r="ram" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
          <div class="sim-panel"><h4>SSD/HDD — sayfa dosyası (yavaş)</h4><div data-r="disk" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
        </div>
      </div>
      <div class="readouts"><div class="readout"><div class="k">İsabet (RAM’de)</div><div class="v" data-r="h"></div></div><div class="readout"><div class="k">Sayfa hatası</div><div class="v" data-r="f"></div></div></div>
      <p class="live" data-r="msg" aria-live="polite"></p>
      <div class="btn-row"><button type="button" class="btn small primary" data-a="step">▶ Sonraki erişim</button><button type="button" class="btn small" data-a="play">⏵ Otomatik</button><button type="button" class="btn small ghost" data-a="reset">↺ Sıfırla</button></div>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    const box = (p, cls = '') => `<span class="reg ${cls}" data-p="${p}" style="min-width:48px;text-align:center;font-family:var(--mono);font-weight:800;font-size:1.2rem">${p}</span>`;
    function paint(cur) {
      R('fv').textContent = frames;
      R('seq').innerHTML = 'Erişim sırası: ' + SEQ.map((p, k) => `<span style="${k === i - 1 ? 'background:var(--accent);color:#fff;border-radius:4px;padding:0 3px' : k < i ? 'opacity:.45' : ''}">${p}</span>`).join(' ');
      R('ram').innerHTML = Array.from({ length: frames }, (_, k) => ram[k] ? box(ram[k], ram[k] === cur ? 'flash' : '') : box('·')).join('');
      R('disk').innerHTML = ['A', 'B', 'C', 'D', 'E'].map((p) => box(p)).join('');
      R('h').textContent = hits; R('f').textContent = faults;
    }
    function reset() { playing = false; ram = []; i = 0; hits = 0; faults = 0; paint(); R('msg').innerHTML = 'Başlamak için <b>Sonraki erişim</b>’e bas.'; }
    async function step() {
      if (i >= SEQ.length) return;
      const p = SEQ[i++];
      if (ram.includes(p)) { hits++; paint(p); R('msg').innerHTML = `<b>${p}</b> RAM’de bulundu → <b>isabet</b>, hızlı erişim.`; return; }
      faults++;
      let out = '';
      if (ram.length >= frames) out = ram.shift();
      paint();
      await flyToken(R('area'), $(`[data-r="disk"] [data-p="${p}"]`, host), R('ram'), p);
      ram.push(p); paint(p);
      R('msg').innerHTML = `<b>${p}</b> RAM’de yok → <b>sayfa hatası</b>. İşletim sistemi sayfayı diskteki sayfa dosyasından getirdi${out ? ` ve yer açmak için <b>${out}</b> sayfasını çıkardı` : ''}. Bu, RAM erişimine göre çok daha yavaştır.` +
        (i >= SEQ.length ? summary() : '');
    }
    function summary() {
      const r = faults / SEQ.length;
      return `<br><b>Sonuç:</b> ${SEQ.length} erişimde ${faults} sayfa hatası (%${Math.round(r * 100)}). ` + (r > 0.55 ? 'RAM bu iş için çok küçük: sistem zamanının büyük kısmını sayfa taşımaya harcıyor. Bu yoğun sayfalama durumuna <b>thrashing</b> denir.' : 'RAM yeterli olduğunda sayfa hataları azalır. RAM’i küçültüp tekrar dene.');
    }
    async function play() { if (playing) return; playing = true; const tok = NAV_TOKEN; if (i >= SEQ.length) reset(), (playing = true); while (playing && alive(tok) && i < SEQ.length) { await step(); await Motion.wait(700); } playing = false; }
    host.addEventListener('click', (e) => { const a = e.target.closest('[data-a]'); if (!a) return; if (a.dataset.a === 'step') { playing = false; step(); } else if (a.dataset.a === 'play') play(); else reset(); });
    R('fr').addEventListener('input', (e) => { frames = +e.target.value; reset(); });
    reset();
  }

    blurb: 'Uçucu/uçucu olmayan bellek, SRAM/DRAM, CAS gecikmesi hesabı, sanal bellek, ECC, DDR4/DDR5, DIMM/SO-DIMM, XMP/EXPO, RAM arızaları.',
    objectives: [
      'Uçucu ve uçucu olmayan bellek türlerini (DRAM, SRAM, ROM, EEPROM, flash) ve bellek–depolama farkını açıklayabileceksin.',

    ],
    steps: [
      { id: 'neden', tag: 'Motivasyon', title: 'Neden önemli?', minutes: 1, html: `
        <div class="grid cols-2">
          <div class="card"><h3 class="mt0">🐢 Neden yavaşladı?</h3><p>Tarayıcıda onlarca sekme, yanında bir oyun ve bir video düzenleyici… Bir noktadan sonra bilgisayar takılmaya başlar ve disk ışığı durmadan yanar. Bu, RAM yetmediğinde işletim sisteminin <b>sanal belleğe</b> yüklenmesidir.</p></div>
          <div class="card"><h3 class="mt0">🔢 Hangisi daha hızlı?</h3><p>“DDR5-6000 CL30” mu, “3200 CL16” mı? CL sayısı küçük olan daha hızlı diye düşünüyorsan, bu modülde bir sürprizle karşılaşacaksın.</p></div>
        </div>` },

      { id: 'kavram', tag: 'Temel kavramlar', title: 'Bellek türleri, bellek ve depolama', minutes: 3, html: `
        <p><span class="term">Hafıza (bellek, memory)</span>, bilgiyi depolayan, saklayan ve gerektiğinde geri çağıran elektronik birimdir. İki temel ayrım:</p>
        <ul>
          <li><b>Uçucu bellek</b> (volatile): Enerji kesilince veriyi kaybeder. Örnek: ana bellekteki <b>DRAM</b>.</li>
          <li><b>Uçucu olmayan bellek</b> (non-volatile): Enerji kesilince veriyi korur. Örnek: ROM, EEPROM, flash.</li>
        </ul>
        <div class="table-wrap"><table>
          <thead><tr><th>Tür</th><th>Veri</th><th>Açılım</th><th>Temel kullanım</th></tr></thead>
          <tbody>
            <tr><td>DRAM</td><td>Geçici</td><td>Dynamic Random Access Memory</td><td>Sistem ana belleği</td></tr>
            <tr><td>SRAM</td><td>Geçici</td><td>Static Random-Access Memory</td><td>Önbellek ve özel hızlı bellekler</td></tr>
            <tr><td>ROM</td><td>Kalıcı</td><td>Read Only Memory</td><td>Tarihsel/sabit firmware</td></tr>
            <tr><td>PROM</td><td>Kalıcı</td><td>Programmable ROM</td><td>Bir kez programlanabilir</td></tr>
            <tr><td>EPROM</td><td>Kalıcı</td><td>Erasable Programmable ROM</td><td>UV ışığıyla silinebilen (tarihsel)</td></tr>
            <tr><td>EEPROM</td><td>Kalıcı</td><td>Electrically Erasable Programmable ROM</td><td>Elektrikle silinip programlanabilir</td></tr>
            <tr><td>Flash</td><td>Kalıcı</td><td>—</td><td>Firmware, SSD, USB flash, gömülü depolama</td></tr>
          </tbody></table></div>
        <p><b>Bellek ≠ depolama.</b> Günlük dilde karışsa da RAM, işlem sırasında CPU’nun aktif kullandığı <b>ana bellektir</b>; SSD ve USB bellek <b>kalıcı depolamadır</b>. Program kullanılmıyorken diskte durur; çalıştırılınca RAM’e kopyalanır.</p>
        <p><b>Organizasyon:</b> Bir bellek yongası “adreslenebilir konum sayısı × konum başına bit” ile ifade edilir: <b>1G × 8</b> bir yonga, yaklaşık bir milyar konumun her birinde 8 bit tutar. RAM’i bir hesap tablosu gibi düşünebilirsin: <b>genişlik</b> sütun, <b>derinlik</b> satır sayısıdır. Yoğunluk = genişlik × derinlik (bit); kapasite = yoğunluk / 8 (byte). Modern sistemler <b>byte-addressable</b>’dır: yazılımın gördüğü en küçük adreslenebilir birim 1 byte’tır.</p>
        <div class="box note"><div class="box-title">ℹ️ Not: KB = 1024 mü?</div>
          <p>Hafta 6 notu RAM kapasitesi için “1 KB = 1024 Byte, 1 MB = 1024 KB, 1 GB = 1.073.741.824 Byte” yazar. Hafta 1 ve 4 notları ise standardı ayırır: <b>1 kB = 1000 B</b> (SI), <b>1 KiB = 1024 B</b> (IEC). Yani 1.073.741.824 byte’ın standart adı <b>1 GiB</b>’dır. Sınavda soru “SI” ya da “IEC/ikili” diyorsa ona göre cevapla (Modül 1).</p></div>
        <div class="box analogy"><div class="box-title">🗄️ Günlük hayattan: Çalışma masası ve arşiv dolabı</div>
          <p>RAM, üzerinde çalıştığın <b>masadır</b>: o an kullandığın belgeler oradadır, hızlıca uzanırsın. SSD/HDD ise koridordaki <b>arşiv dolabı</b>: her şey orada kalıcı durur ama gidip getirmek zaman alır. Masa küçükse sürekli dolaba gidip gelirsin; işte bu, sanal belleğin yavaşlığıdır.</p>
          <span class="limit">Masadaki kâğıtlar ışıklar sönünce yerinde kalır; RAM ise elektrik kesilince içeriğini kaybeder (uçucu). Ayrıca RAM ile disk arasındaki hız farkı, masa ile dolap arasındakinden çok daha büyüktür.</span></div>` },

      { id: 'gecikme', tag: 'Kavram + etkileşim', title: 'Erişim zamanı, gecikme ve CAS Latency', minutes: 3, init: initCL, html: `
        <p><span class="term">Erişim zamanı</span>, işlemcinin bellekten veriyi okuması için gereken en kısa süredir; <b>nanosaniye</b> (saniyenin milyarda biri) ile ölçülür. Göz kırpma en az 1/10 saniye sürer; bilgisayar bu sürede milyonlarca işlem yapabilir. <span class="term">Gecikme (latency)</span> ise bir bellek isteğinin sonuçlanması için geçen süredir; düşük gecikmeli RAM işlemciye daha hızlı cevap verir.</p>
        <p><span class="term">CL</span> (veya t<sub>CL</sub>), bir okuma komutundan sonra ilk verinin aktarılmasına kadar geçen <b>saat çevrimi</b> sayısıdır: “CLX bir RAM veriyi almak için X çevrim bekler”; CL5’te 5 saat darbesi beklenir.</p>
        <div class="box note"><div class="box-title">ℹ️ Not: CL, “Low Latency” değil “CAS Latency”dir</div>
          <p>Hafta 6 notunun bir bölümünde <b>CL’nin “Low Latency / Düşük Gecikme”</b> anlamına geldiği ve “CL2 hızlı, CL3 yavaş RAM” olduğu yazar. Aynı notun güncel bölümü doğrusunu verir: <b>CL = CAS Latency</b> (Column Address Strobe gecikmesi). Ayrıca CL <b>tek başına nanosaniye cinsinden gerçek gecikmeyi göstermez</b>; çünkü modüller farklı veri hızlarında çalışır. Doğru karşılaştırma için: <b>t<sub>CL</sub>(ns) = 2000 × CL / veri hızı (MT/s)</b>. Örnek: DDR5-6000 CL30 ≈ <b>10 ns</b>.</p></div>
        <div class="lab"><div class="lab-head">🧮 Laboratuvar: CAS gecikmesini nanosaniyeye çevir</div><div class="lab-body" id="m7CL"></div></div>` },

      { id: 'sanal', tag: 'Kavram + etkileşim', title: 'Sanal bellek, sayfa hatası ve thrashing', minutes: 2, init: initVM, html: `
        <p><span class="term">Sanal bellek</span>, işletim sistemi ve işlemci donanımının birlikte kullandığı bir <b>adresleme ve koruma mekanizmasıdır</b>. Her süreç kendine ait bir sanal adres alanı görür. İşlemcideki <b>Bellek Yönetim Birimi (MMU)</b> sanal adresleri fiziksel RAM adreslerine çevirir; işletim sistemi <b>sayfa tablolarını</b> yönetir.</p>
        <p>Gerekli sayfa fiziksel RAM’de yoksa <span class="term">sayfa hatası (page fault)</span> oluşur; işletim sistemi veriyi SSD/HDD’deki <b>page file / swap</b> alanından getirir. Bu, RAM erişimine göre çok yavaştır; yoğun sayfalama ciddi performans kaybına yol açar: <span class="term">thrashing</span>.</p>
        <div class="lab"><div class="lab-head">🔬 Laboratuvar: RAM küçülürse ne olur?</div><div class="lab-body" id="m7VM"></div></div>
        <p>Sanal bellek yalnızca “diski RAM gibi kullanmak” değildir: adres alanı soyutlama, süreç izolasyonu, koruma ve gerektiğinde sayfalama işlevlerini birlikte kapsar.</p>` },

      { id: 'turler', tag: 'Kavram + etkileşim', title: 'RAM yapısı, SRAM/DRAM, DDR nesilleri ve modüller', minutes: 4, init: initFamilies, html: `
        <p>Bir RAM modülü; <b>PCB</b> (baskı devre kartı) üzerine dizilmiş RAM yongaları, <b>SPD</b> yongası ve kondansatörlerden oluşur; altında anakarta bağlanan pinler ve doğru takılmasını sağlayan <b>module key</b> çentiği vardır. Farklı RAM türlerinde çentiğin yeri farklıdır; böylece yanlış RAM takılması önlenir. Günümüz yongalarında yaygın paket CSP’dir (Chip-Scale Package).</p>
        <div class="grid cols-2">
          <div class="card"><b>SRAM (statik)</b><p class="mt0">Hücre başına set/reset flip-flop. Elektrik olduğu sürece veri durur, <b>tazeleme gerekmez</b>. Daha hızlı, daha pahalı, daha büyük yapı. CPU’nun L1/L2/L3 önbelleği ve disk önbelleği.</p></div>
          <div class="card"><b>DRAM (dinamik)</b><p class="mt0">Her bit bir <b>kapasitör</b> (+ transistör) içinde. Veri <b>periyodik olarak tazelenir</b> (refresh). Ucuz, küçük yapı, makul hız, yüksek kapasite. Sistem ana belleği.</p></div>
        </div>
        <p><b>DRAM türleri:</b> <i>Asenkron</i> (sistem saatiyle eşzamansız; FPM, EDO; artık kullanılmıyor) · <i>Senkron</i> (SDRAM, DDR, LPDDR, DDR2/3/4/5 — günümüz PC bellekleri DDRx SDRAM) · <i>Grafik</i> (VRAM, WRAM, SGRAM, GDDR…) · <i>Rambus</i> (bir dönem Intel destekledi; maliyet ve lisans nedeniyle standartlaşamadı).</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Nesil</th><th>Öne çıkan</th></tr></thead>
          <tbody>
            <tr><td><b>DDR2</b></td><td>Veri G/Ç hızı DDR’ın 2 katı; çekirdek hızı aynı; ek tamponlar; 240 pin DIMM; DDR ile uyumsuz</td></tr>
            <tr><td><b>DDR3</b></td><td>Veri G/Ç hızı DDR2’nin 2 katı; geriye uyumlu değil; daha düşük güç</td></tr>
            <tr><td><b>DDR4</b></td><td>2014 ortası; daha düşük güç; modül başına 512 GB’a kadar; ECC’li türevleri var</td></tr>
            <tr><td><b>DDR5</b></td><td>Daha yüksek hız; 64 bit veri yolu <b>iki bağımsız 32 bit alt kanala</b> ayrılır; daha uzun burst, daha fazla bank grubu; modül üzerinde <b>PMIC</b> ve <b>SPD Hub</b>. DDR4 ile fiziksel ve elektriksel olarak <b>uyumsuz</b></td></tr>
            <tr><td><b>LPDDR5X / LPDDR6</b></td><td>Mobil ve bütünleşik sistemler için düşük güçlü DDR; LPDDR6’nın varlığı masaüstü DDR6’nın aynı aşamada olduğu anlamına gelmez</td></tr>
            <tr><td><b>GDDR6/6X/7, HBM</b></td><td>Grafik ve yapay zekâ hızlandırıcıları için yüksek bant genişlikli bellekler</td></tr>
          </tbody></table></div>
        <div class="lab"><div class="lab-head">🎮 Oyun: Hangi bellek nerede?</div><div class="lab-body" id="m7Fam"></div></div>
        <h3>Modül biçimleri</h3>
        <ul>
          <li><b>SIMM:</b> Tek sıralı; 32 bit dış veri yolu; 64 bit sistemlerde en az 2 modül gerekir; 90’ların sonuna kadar.</li>
          <li><b>DIMM:</b> Bugün en yaygın paket. Yongalar tek yüzdeyse “single sided”, iki yüzdeyse “double sided”. <b>Rank</b> ise bellek denetleyicisinin birlikte eriştiği yonga grubudur; rank sayısı PCB’nin görünüşüne bakarak güvenilir biçimde belirlenemez.</li>
          <li><b>SO-DIMM:</b> Dizüstüler için DIMM’in yarı uzunluğunda türevi.</li>
          <li><b>Tarihsel:</b> AIMM (grafik kartı), SIPP (80286/386), RIMM ve boş yuvaları kapatan CRIMM (Rambus).</li>
          <li><b>Modern:</b> CAMM2 (yüksek yoğunluk, kısa bağlantılar), LPCAMM2 (LPDDR tabanlı, sökülebilir), CUDIMM/CSODIMM (modül üzerinde saat sürücüsü – CKD).</li>
        </ul>` },

      { id: 'ecc', tag: 'Temel kavramlar', title: 'Parite, ECC ve buffered bellek', minutes: 2, html: `
        <p>Yüksek hızda çalışan RAM nadiren de olsa 1 yerine 0 döndürebilir. Bu, sunucu ve iş istasyonlarında daha önemlidir.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Yaklaşım</th><th>Ne yapar?</th><th>Not</th></tr></thead>
          <tbody>
            <tr><td><b>Parite (eşlik) RAM</b></td><td>Hatayı <b>algılar</b>, düzeltemez</td><td>“Hata algılamalı RAM”</td></tr>
            <tr><td><b>ECC RAM</b> (sistem ECC’si)</td><td>Bellek denetleyicisi ile DRAM arasında taşınan veriye ek kontrol bilgisi ekler; tek bit hataları <b>düzeltir</b>, bazı çok bitli hataları algılar</td><td>Çoğunlukla sunucularda; işlemci, anakart ve modül birlikte desteklemeli</td></tr>
            <tr><td><b>DDR5 On-Die ECC</b></td><td>DRAM yongasının <b>kendi içindeki</b> hata olasılığını azaltır</td><td>CPU–modül veri yolunu korumaz; sistem ECC’sinin yerine geçmez</td></tr>
            <tr><td><b>Buffered / Registered</b></td><td>RAM ile CPU arasında tampon yonga; çok sayıda modülün yarattığı elektriksel zorluğu azaltır</td><td>Uyumlu anakart gerekir</td></tr>
          </tbody></table></div>
        <div class="box warn"><div class="box-title">⚠️ Sık yapılan hata</div><p>Standart bir <b>DDR5 UDIMM</b>, yalnızca On-Die ECC içerdiği için “ECC RAM” sayılmaz.</p></div>
        <p class="footnote">Notta anakartlarda genelde 4 RAM yuvası bulunduğu ve 4’ten fazlasının elektriksel sorun çıkardığı yazar; ECC RAM’in dezavantajları olarak da yüksek maliyet ve yavaşlık sayılır. Bunlar genel eğilimlerdir; kesin durum platforma göre değişir.</p>` },

      { id: 'durumlar', tag: 'Temel kavramlar', title: 'RAM yükseltme, profiller ve arıza teşhisi', minutes: 2, html: `
        <p><b>RAM ihtiyacının belirtileri:</b> birkaç program açıkken genel yavaşlık, RAM yetersizliğinden aşırı disk kullanımı, yazılımların asgari RAM ihtiyacının karşılanamaması.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Kontrol</th><th>Sorulacak soru</th></tr></thead>
          <tbody>
            <tr><td>DDR nesli</td><td>Anakart/CPU DDR4 mü, DDR5 mi destekliyor?</td></tr>
            <tr><td>Modül türü</td><td>UDIMM, SO-DIMM, RDIMM, CUDIMM… hangisi?</td></tr>
            <tr><td>Kapasite</td><td>Toplam ve DIMM başına azami kapasite?</td></tr>
            <tr><td>ECC</td><td>İşlemci ve anakart destekliyor mu?</td></tr>
            <tr><td>Kanal yerleşimi</td><td>Hangi yuvalar öncelikli kullanılmalı?</td></tr>
            <tr><td>Hız / rank / DIMM sayısı</td><td>Resmi destek ne? Çoklu DIMM desteklenen hızı düşürüyor mu?</td></tr>
            <tr><td>QVL ve firmware</td><td>Üreticinin doğrulanmış bellek listesi var mı? Güncel BIOS/UEFI gerekli mi?</td></tr>
            <tr><td>Profil</td><td>JEDEC varsayılanı mı, XMP/EXPO mu?</td></tr>
          </tbody></table></div>
        <p>Bilgi kaynağı: anakart kitapçığı veya CPU-Z gibi yazılımlar. <span class="term">XMP</span> (Intel) ve <span class="term">EXPO</span> (AMD), BIOS/UEFI üzerinden frekans, zamanlama ve gerilimi bir profil olarak uygulayan <b>üretici profilleridir</b>; standart varsayılan çalışmayla aynı değildir ve bellek overclock’u kapsamında değerlendirilebilir.</p>
        <h3>Arızalar</h3>
        <ul>
          <li><b>Hiç açılmama</b> (bip sesleri) veya POST’un RAM kontrolünden önce tıkanması: modül düzgün oturmamış ya da üretim hatası/ESD ile bozulmuş olabilir.</li>
          <li><b>Mavi ekran (BSOD):</b> İşletim sisteminin güvenle devam edemediği ciddi çekirdek hatası. RAM neden olabilir ama mavi ekran <b>tek başına RAM arızasını kanıtlamaz</b>; aynı adreste tekrarlayan hatalar RAM’i işaret edebilir.</li>
          <li><b>DDR5 bellek eğitimi (memory training):</b> İlk açılışta, RAM değişince veya bazı firmware güncellemelerinden sonra sinyal zamanlamaları kalibre edilir; sistem bir süre görüntü vermeden bekleyebilir. <b>Bu her zaman arıza değildir.</b> XMP/EXPO bunu zorlaştırabilir; kararsızlıkta önce JEDEC varsayılanına dön, sonra modülleri tek tek önerilen yuvalarda dene.</li>
        </ul>
        <p><b>Tespit yöntemleri:</b> gözle muayene, RAM test donanımı, sağlam RAM ile değiştirme, yazılım tabanlı RAM testi. Hata kodu, sistem günlükleri ve test sonuçları birlikte değerlendirilir.</p>
        <p class="footnote">Notun eski bölümünde mavi ekranın NMI (Maskelenemez Kesme) “panik” mekanizmasıyla ortaya çıktığı yazar; güncel bölüm BSOD’u, işletim sisteminin güvenle devam edemediği kernel hatasında oluşturulan durdurma ekranı olarak tanımlar.</p>
        <p><b>CXL ile bellek genişletme:</b> Özellikle sunucularda, PCI Express fiziksel altyapısını kullanan cache-coherent (önbellek tutarlı) bir bağlantıyla ek bellek aygıtları eklenebilir. CXL, masaüstü DDR5 DIMM’in yerine geçen bir RAM türü <b>değildir</b>.</p>` },

      { id: 'ozet', tag: 'Örnek ve özet', title: 'Çözümlü örnek ve modül özeti', minutes: 1, html: `
        <div class="box example"><div class="box-title">✏️ Örnek — Hangi RAM daha düşük gecikmeli?</div>
          <p>DDR5-6000 CL30: 2000 × 30 / 6000 = <b>10 ns</b>. 3200 MT/s CL16: 2000 × 16 / 3200 = <b>10 ns</b>. CL değeri neredeyse iki katı olmasına rağmen CAS gecikmeleri <b>aynı</b>. Yüksek hızlı modül ayrıca daha fazla bant genişliği sunar.</p></div>
        <div class="box summary"><div class="box-title">📌 Modül 7 özeti</div>
          <ul>
            <li>Uçucu: DRAM, SRAM. Uçucu olmayan: ROM, PROM, EPROM, EEPROM, flash. Bellek (RAM) ≠ depolama (SSD).</li>
            <li>SRAM: flip-flop, tazeleme yok, hızlı, pahalı → önbellek. DRAM: kapasitör, tazelenir, ucuz → ana bellek.</li>
            <li>CL = <b>CAS Latency</b> (çevrim sayısı). Gerçek gecikme: t<sub>CL</sub>(ns) = 2000 × CL / MT/s. DDR5-6000 CL30 ≈ 10 ns.</li>
            <li>Sanal bellek: MMU + sayfa tabloları; sayfa hatasında disk → RAM; aşırı sayfalama = thrashing.</li>
            <li>Parite algılar; sistem ECC düzeltir; DDR5 On-Die ECC sistem ECC’si değildir.</li>
            <li>DDR5: 2 × 32 bit alt kanal, PMIC, SPD Hub; DDR4 ile uyumsuz. SO-DIMM dizüstü; CAMM2/LPCAMM2 yeni biçimler.</li>
            <li>XMP/EXPO = üretici profili (overclock kapsamı). DDR5 memory training uzun ilk açılış ≠ arıza. BSOD tek başına RAM arızası kanıtı değil.</li>
          </ul></div>` }
    ],
    cards: [
      { q: 'Uçucu ve uçucu olmayan bellek farkı?', a: 'Uçucu: enerji kesilince veri kaybolur (DRAM, SRAM). Uçucu olmayan: veri korunur (ROM, EEPROM, flash).' },
      { q: 'SRAM ile DRAM farkı?', a: 'SRAM: flip-flop, tazeleme yok, hızlı ve pahalı → önbellek. DRAM: kapasitör, periyodik tazeleme, ucuz → ana bellek.' },
      { q: 'CL neyin kısaltmasıdır ve ne anlatır?', a: '<b>CAS Latency.</b> Okuma komutundan ilk veriye kadar geçen saat çevrimi sayısı. (Notta geçen “Low Latency” açılımı hatalıdır.)' },
      { q: 'CAS gecikmesi nanosaniyeye nasıl çevrilir?', a: 't<sub>CL</sub>(ns) = 2000 × CL / veri hızı (MT/s). DDR5-6000 CL30 → 10 ns.' },
      { q: 'Sayfa hatası ve thrashing?', a: 'Sayfa hatası: gereken sayfa RAM’de yok, diskteki sayfa dosyasından getirilir. Thrashing: yoğun sayfalama yüzünden ciddi performans kaybı.' },
      { q: 'Parite, ECC ve On-Die ECC?', a: 'Parite hatayı algılar. Sistem ECC tek bit hatayı düzeltir. DDR5 On-Die ECC yonga içidir; sistem ECC’sinin yerine geçmez.' },
      { q: 'DDR5’in DDR4’e göre mimari farkları?', a: '64 bit yolu iki bağımsız 32 bit alt kanala böler; daha uzun burst, daha çok bank grubu; modülde PMIC ve SPD Hub. DDR4 ile uyumsuz.' },
      { q: 'SO-DIMM nedir?', a: 'Dizüstü bilgisayarlar için, DIMM’in yarı uzunluğunda geliştirilmiş bellek modülü.' },

        exp: 'PMIC güç yönetimi, SPD Hub modül bilgileri ve yan bant iletişimi, module key fiziksel uyum, XMP/EXPO ise BIOS’tan uygulanan üretici profilidir.' }
