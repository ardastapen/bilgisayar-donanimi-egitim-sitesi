<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Bilgisayar Donanımı dersi için Türkçe, etkileşimli ve animasyonlu çalışma sitesi.">
<title>Bilgisayar Donanımı · Etkileşimli Ders</title>
<style>
/* =========================================================
   BİLGİSAYAR DONANIMI — ETKİLEŞİMLİ DERS SİTESİ
   Stil dosyası (build sırasında index.html içine gömülür)
   ========================================================= */

/* ---------- 1. Tema değişkenleri ---------- */
:root {
  --bg: #f4f5f1;
  --surface: #ffffff;
  --surface-2: #eef1ec;
  --ink: #18211d;
  --muted: #4f5d56;
  --line: #d3dad4;
  --brand: #0d6b53;          /* baskı devre yeşili */
  --brand-soft: #dcefe7;
  --brand-ink: #ffffff;
  --accent: #a24e07;         /* bakır / amber */
  --accent-soft: #fbead8;
  --ok: #157a3c;
  --ok-soft: #e1f3e7;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --info: #1f4fbf;
  --info-soft: #e3ebfb;
  --warn: #8a5a00;
  --warn-soft: #fff3cf;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.06);
  --radius: 14px;
  --radius-sm: 9px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
  --topbar-h: 58px;
  --sidebar-w: 290px;
  --focus: 0 0 0 3px #ffbf47;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f1513;
    --surface: #161e1b;
    --surface-2: #1d2723;
    --ink: #e6ece9;
    --muted: #a7b5ae;
    --line: #2f3c37;
    --brand: #3cc79c;
    --brand-soft: #173a2f;
    --brand-ink: #06231a;
    --accent: #f0a24a;
    --accent-soft: #3b2814;
    --ok: #54d184;
    --ok-soft: #12321f;
    --bad: #ff8a80;
    --bad-soft: #3d1715;
    --info: #8db0ff;
    --info-soft: #18254a;
    --warn: #f4c95d;
    --warn-soft: #3a3013;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  }
}

/* ---------- 2. Temel ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.65;
  color: var(--ink);
  background: var(--bg);
}
h1, h2, h3, h4 { line-height: 1.25; margin: 1.3em 0 .5em; }
h1 { font-size: clamp(1.6rem, 3.6vw, 2.25rem); letter-spacing: -.01em; }
h2 { font-size: clamp(1.3rem, 2.6vw, 1.6rem); }
h3 { font-size: 1.15rem; }
p { margin: .6em 0; }
a { color: var(--brand); }
code, kbd, .mono { font-family: var(--mono); font-size: .92em; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 .35em; background: var(--surface); }
img, svg { max-width: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 6px; }
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { box-shadow: none; }
.visually-hidden { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.skip-link {
  position: absolute; left: 8px; top: -60px; z-index: 100;
  background: var(--brand); color: var(--brand-ink); padding: 10px 14px; border-radius: 8px;
}
.skip-link:focus { top: 8px; }

/* Animasyon azaltma: hem sistem tercihi hem kullanıcı anahtarı bu sınıfı kullanır */
html.reduce-motion *, html.reduce-motion *::before, html.reduce-motion *::after {
  transition-duration: 0s !important;
  animation-duration: 0s !important;
  animation-iteration-count: 1 !important;
  scroll-behavior: auto !important;
}

/* ---------- 3. Üst çubuk ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex; align-items: center; gap: 10px;
  font-weight: 700; text-decoration: none; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.brand svg { flex: none; }
.brand small { display: block; font-weight: 500; color: var(--muted); font-size: .75rem; line-height: 1.1; }
.topbar .spacer { flex: 1; }
.global-progress { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.global-progress .bar { width: 110px; }
.icon-btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .85rem;
}
.icon-btn[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); }
#menuBtn { display: none; }

/* ---------- 4. Yerleşim ---------- */
.layout { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: calc(100vh - var(--topbar-h)); }
.sidebar {
  position: sticky; top: var(--topbar-h);
  height: calc(100vh - var(--topbar-h));
  overflow-y: auto;
  border-right: 1px solid var(--line);
  background: var(--surface);
  padding: 14px 10px 30px;
}
.sidebar h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 10px 6px; }
.nav-list { list-style: none; margin: 0; padding: 0; }
.nav-list a {
  display: grid; grid-template-columns: 30px 1fr auto; gap: 8px; align-items: center;
  padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--ink); font-size: .93rem; line-height: 1.3;
}
.nav-list a:hover { background: var(--surface-2); }
.nav-list a[aria-current="page"] { background: var(--brand-soft); font-weight: 600; }
.nav-num {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font-size: .8rem; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line);
}
.nav-list .done .nav-num { background: var(--ok); color: #fff; border-color: var(--ok); }
.nav-list .started .nav-num { border-color: var(--brand); color: var(--brand); }
.nav-list .retry .nav-num { border-color: var(--accent); color: var(--accent); border-width: 2px; }
.nav-min { font-size: .75rem; color: var(--muted); }

main { min-width: 0; padding: 22px clamp(14px, 4vw, 48px) 80px; }
main:focus { outline: none; }
.container { max-width: 880px; margin: 0 auto; }

@media (max-width: 960px) {
  #menuBtn { display: inline-flex; }
  .layout { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; left: 0; top: var(--topbar-h); bottom: 0; width: min(88vw, 320px); height: auto;
    transform: translateX(-102%); transition: transform .25s ease; z-index: 50; box-shadow: var(--shadow);
  }
  .sidebar.open { transform: none; }
  .global-progress .bar { width: 60px; }
  .brand small { display: none; }
}
@media (max-width: 520px) {
  body { font-size: 16px; }
  .global-progress span.lbl { display: none; }
  #motionBtn .lbl { display: none; }
  .brand > span:last-child { display: none; }
}

/* ---------- 5. Genel bileşenler ---------- */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px 20px; box-shadow: var(--shadow); margin: 16px 0;
}
.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 8px 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  font-weight: 600; text-decoration: none; color: var(--ink);
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--brand); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: .9rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 12px 0; }

.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); }
.bar > span { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 99px; transition: width .4s ease; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 99px;
  font-size: .78rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
}
.chip.brand { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.chip.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .94rem; }
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: var(--radius-sm); margin: 12px 0; background: var(--surface); }
.table-wrap table { margin: 0; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { background: var(--surface-2); font-weight: 700; }
tr:last-child td { border-bottom: 0; }

/* Bilgi kutuları */
.box { border-radius: var(--radius-sm); padding: 14px 16px 12px 16px; margin: 16px 0; border-left: 5px solid; }
.box > :first-child { margin-top: 0; }
.box > :last-child { margin-bottom: 0; }
.box .box-title { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 4px; }
.box.analogy { background: var(--accent-soft); border-color: var(--accent); }
.box.note { background: var(--info-soft); border-color: var(--info); }
.box.warn { background: var(--warn-soft); border-color: var(--warn); }
.box.summary { background: var(--brand-soft); border-color: var(--brand); }
.box.example { background: var(--surface-2); border-color: var(--muted); }
.box .limit { display: block; margin-top: 6px; font-size: .93rem; }
.box .limit::before { content: "Benzetmenin sınırı: "; font-weight: 700; }

.objectives { list-style: none; padding: 0; margin: 10px 0; }
.objectives li { position: relative; padding-left: 30px; margin: 6px 0; }
.objectives li::before {
  content: "✓"; position: absolute; left: 0; top: 2px; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center; font-size: .75rem; font-weight: 800; background: var(--brand); color: var(--brand-ink);
}
.term { font-weight: 650; }
.src { font-size: .8rem; color: var(--muted); }

/* ---------- 6. Ana sayfa ---------- */
.hero { padding: 26px 24px; border-radius: 20px; color: #fff; position: relative; overflow: hidden;
  background: linear-gradient(135deg, #0b4f3e 0%, #0d6b53 55%, #1b7f64 100%); }
.hero h1 { margin-top: 0; color: #fff; }
.hero p { max-width: 62ch; color: #e7f5ef; }
.hero .btn { border-color: rgba(255,255,255,.7); }
.hero .btn.primary { background: #fff; color: #0b4f3e; border-color: #fff; }
.hero .btn.ghost { color: #fff; }
.hero-art { position: absolute; right: -30px; top: -10px; opacity: .18; width: 320px; pointer-events: none; }

.how { counter-reset: how; list-style: none; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(190px,1fr)); }
.how li { counter-increment: how; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 12px 50px; position: relative; }
.how li::before { content: counter(how); position: absolute; left: 12px; top: 12px; width: 28px; height: 28px; border-radius: 50%;
  background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; }

.module-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.mcard { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow);
  transition: transform .15s, border-color .15s; }
.mcard:hover { transform: translateY(-2px); border-color: var(--brand); }
.mcard .mhead { display: flex; align-items: center; gap: 10px; }
.mcard .mnum { width: 38px; height: 38px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-weight: 800; }
.mcard.special .mnum { background: var(--accent); color: #fff; }
.mcard h3 { margin: 0; font-size: 1.02rem; }
.mcard p { margin: 0; font-size: .9rem; color: var(--muted); }
.mcard .mfoot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mcard.locked { opacity: .72; }

/* ---------- 7. Modül sayfası ---------- */
.module-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; color: var(--muted); font-size: .9rem; }
.module-head h1 { width: 100%; color: var(--ink); margin: 4px 0 2px; }
.stepper { display: flex; gap: 6px; overflow-x: auto; padding: 8px 2px 10px; margin: 10px 0 4px; scrollbar-width: thin; }
.stepper button {
  flex: none; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  padding: 6px 12px; border-radius: 99px; cursor: pointer; font-size: .82rem; white-space: nowrap;
}
.stepper button .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.stepper button.visited .dot { background: var(--brand); }
.stepper button[aria-current="step"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.stepper button[aria-current="step"] .dot { background: var(--brand-ink); }
.step-tag { font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.step-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.step-head h2 { margin: 6px 0 0; }
.step-nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); }
.step-nav .btn { max-width: 48%; }
.step-nav .btn span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- 8. Etkileşimli panel ortak ---------- */
.lab {
  border: 2px solid var(--brand); border-radius: var(--radius); background: var(--surface); margin: 18px 0; overflow: hidden;
}
.lab-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--brand-soft); font-weight: 700; }
.lab-head .chip { margin-left: auto; }
.lab-body { padding: 16px; }
.lab-hint { font-size: .88rem; color: var(--muted); margin-top: 0; }
.live { min-height: 3.2em; padding: 10px 14px; border-radius: 10px; background: var(--surface-2); border: 1px dashed var(--line); }

/* Gezgin (Explorer): listeden seç, ayrıntı panelinde gör */
.explorer { display: grid; gap: 14px; grid-template-columns: minmax(200px, 300px) 1fr; }
.explorer .ex-list { display: flex; flex-direction: column; gap: 6px; list-style: none; margin: 0; padding: 0; }
.explorer.row { grid-template-columns: 1fr; }
.explorer.row .ex-list { flex-direction: row; overflow-x: auto; padding-bottom: 6px; }
.ex-item {
  text-align: left; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; transition: background .15s, transform .15s, border-color .15s; line-height: 1.3;
}
.explorer.row .ex-item { width: auto; flex: none; text-align: center; min-width: 120px; }
.ex-item small { display: block; color: var(--muted); font-size: .78rem; }
.ex-item[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.ex-item[aria-pressed="true"] small { color: inherit; opacity: .85; }
.ex-detail { border-radius: 12px; background: var(--surface-2); padding: 14px 16px; min-height: 140px; }
.ex-detail h4 { margin: 0 0 6px; }
@media (max-width: 640px) { .explorer { grid-template-columns: 1fr; } }

/* Katman yığını görünümü */
.explorer.stack .ex-item { border-left-width: 6px; }
.explorer.stack .ex-item:nth-child(1) { border-left-color: #2a9d8f; }
.explorer.stack .ex-item:nth-child(2) { border-left-color: #3f8fc9; }
.explorer.stack .ex-item:nth-child(3) { border-left-color: #6f6ad1; }
.explorer.stack .ex-item:nth-child(4) { border-left-color: #b860b5; }
.explorer.stack .ex-item:nth-child(5) { border-left-color: #d0743c; }
.explorer.stack .ex-item:nth-child(6) { border-left-color: #b8892a; }

/* Akış adımlayıcı (FlowStepper) */
.flow { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; position: relative; margin: 6px 0 14px; }
.flow-node {
  flex: 1 1 120px; min-width: 110px; position: relative; padding: 10px 10px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--surface); text-align: center; font-size: .86rem; font-weight: 600; line-height: 1.25;
  transition: border-color .3s, background .3s, transform .3s;
}
.flow-node .ico { font-size: 1.35rem; display: block; margin-bottom: 2px; }
.flow-node.active { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-3px); }
.flow-node.past { border-color: var(--brand); }
.flow-node .n { position: absolute; top: -9px; left: -7px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2);
  border: 1px solid var(--line); font-size: .72rem; display: grid; place-items: center; }
.flow-node.past .n, .flow-node.active .n { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

/* Uçan veri jetonu (animasyon yardımcısı) */
.token {
  position: absolute; z-index: 5; pointer-events: none; padding: 3px 9px; border-radius: 99px; font-size: .78rem; font-weight: 800;
  background: var(--accent); color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.25); white-space: nowrap;
  transition: transform .75s cubic-bezier(.45,.05,.3,1), opacity .2s; font-family: var(--mono);
}

/* Sıralama / eşleştirme oyunu */
.sort-item { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 10px 0; background: var(--surface); }
.sort-item .q { font-weight: 600; margin-bottom: 8px; }
.sort-opts { display: flex; flex-wrap: wrap; gap: 8px; }
.sort-opts button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; padding: 6px 14px; cursor: pointer; font-weight: 600; min-height: 40px; }
.sort-opts button:hover:not([disabled]) { border-color: var(--brand); }
.sort-opts button.right { background: var(--ok); color: #fff; border-color: var(--ok); }
.sort-opts button.wrong { background: var(--bad); color: #fff; border-color: var(--bad); }
.sort-fb { margin-top: 8px; font-size: .92rem; }
.score-pill { font-weight: 800; padding: 4px 12px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }

/* Form öğeleri */
label.field { display: block; font-size: .88rem; font-weight: 600; }
label.field:not([style]) > input:not([type="checkbox"]), label.field:not([style]) > select { display: block; width: 100%; margin-top: 4px; }
label.field[style] > input, label.field[style] > select { margin-left: 4px; }
.readout .v.sm { font-size: 1rem; }
input[type="number"], input[type="text"], select {
  font: inherit; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 42px;
}
input[type="range"] { width: 100%; accent-color: var(--brand); }

/* ---------- 9. Bilgi kartları (flip) ---------- */
.fc-wrap { max-width: 620px; margin: 0 auto; }
.fc-stats { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0 12px; }
.fc-stage { perspective: 1200px; }
.fc {
  display: grid; width: 100%; padding: 0; border: 0; background: none; cursor: pointer;
  transform-style: preserve-3d; transition: transform .6s cubic-bezier(.3,.7,.2,1); text-align: center;
}
.fc.flipped { transform: rotateY(180deg); }
.fc-face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  min-height: 230px; border-radius: 18px; padding: 26px 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  border: 2px solid var(--line); box-shadow: var(--shadow);
}
.fc-front { background: var(--surface); }
.fc-back { background: var(--brand-soft); border-color: var(--brand); transform: rotateY(180deg); }
.fc-face .lbl { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
.fc-face .txt { font-size: 1.15rem; font-weight: 650; line-height: 1.45; }
.fc-back .txt { font-size: 1.02rem; font-weight: 500; }
.fc-face .hint { font-size: .78rem; color: var(--muted); }
.fc-mark { position: absolute; }
.fc.known .fc-front { border-color: var(--ok); }

.btn.know { background: var(--ok); color: #fff; border-color: var(--ok); }

/* ---------- 10. Quiz ---------- */
.quiz { max-width: 720px; margin: 0 auto; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .88rem; color: var(--muted); }
.quiz-q { font-size: 1.12rem; font-weight: 650; margin: 14px 0; }
.quiz-type { font-size: .75rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }
.opts { display: grid; gap: 10px; }
.opt {
  display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
  padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; line-height: 1.4;
  transition: border-color .15s, background .15s;
}
.opt:hover:not([disabled]) { border-color: var(--brand); }
.opt .key { flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; background: var(--surface-2); border: 1px solid var(--line); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }

.opt.incorrect { border-color: var(--bad); background: var(--bad-soft); }

.feedback { margin-top: 14px; padding: 12px 14px; border-radius: 12px; }
.feedback.good { background: var(--ok-soft); border-left: 5px solid var(--ok); }

.result-hero { text-align: center; padding: 10px 0; }

@media (max-width: 560px) { .match-row { grid-template-columns: 1fr; gap: 4px; } }

.match-row.incorrect select { border-color: var(--bad); background: var(--bad-soft); }

/* ---------- 11. Modül 1–2 özel bileşenleri ---------- */
/* Bit laboratuvarı */
.bits { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin: 10px 0; }
.bit {
  display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 6px; border-radius: 10px;
  border: 2px solid var(--line); background: var(--surface-2); cursor: pointer; font-family: var(--mono);
  transition: background .2s, border-color .2s, transform .15s;
}
.bit .v { font-size: 1.5rem; font-weight: 800; line-height: 1.1; }
.bit .w { font-size: .7rem; color: var(--muted); }
.bit[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); transform: translateY(-2px); }

.readouts { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 12px; }
.readout { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); }
.readout .k { font-size: .75rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }

/* Getir–çöz–yürüt simülatörü */
.cpu-sim { position: relative; display: grid; gap: 14px; grid-template-columns: 1.1fr 1fr; }
@media (max-width: 700px) { .cpu-sim { grid-template-columns: 1fr; } }
.sim-panel { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--surface); }
.sim-panel h4 { margin: 0 0 8px; font-size: .9rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.regs { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px,1fr)); gap: 8px; }
.reg { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--surface-2); transition: background .3s, border-color .3s; }
.reg .k { font-size: .7rem; font-weight: 700; color: var(--muted); }

.alu { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 2px dashed var(--line); border-radius: 12px; margin-top: 8px; font-family: var(--mono); font-weight: 800; transition: border-color .3s, background .3s; }

/* Von Neumann / Harvard karşılaştırması */
.arch-demo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .arch-demo { grid-template-columns: 1fr; } }

/* Bellek hiyerarşisi piramidi */

/* Zaman çizelgesi */

/* Modül 3–4 animasyonları */

<!-- ===== Betikler: çekirdek motor → modüller → özel sayfalar → açılış ===== -->
<script>
/* ==================== engine.js ==================== */
/* =========================================================
   ÇEKİRDEK MOTOR
   - Yardımcılar, ilerleme kaydı (localStorage), animasyon yardımcıları
   - Ortak bileşenler: Explorer, FlowStepper, SortGame, Flashcards, Quiz
   - Router (#/ , #/m/<id>/<adım>, #/tekrar, #/sinav) ve sayfa çizimi
   ========================================================= */
'use strict';

/* ---------- 1. Küçük yardımcılar ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const fmt = (n, d = 2) => Number(n).toLocaleString('tr-TR', { maximumFractionDigits: d });
function fmtMin(min) {
  const h = Math.floor(min / 60), m = min % 60;
  return h ? `${h} sa ${m ? m + ' dk' : ''}`.trim() : `${m} dk`;
}
const LETTERS = ['A', 'B', 'C', 'D', 'E'];

/* ---------- 2. İlerleme kaydı (localStorage) ---------- */
const Store = {
  key: 'bilgisayar-donanimi-ders-v1',
  data: null,
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.key)); } catch (e) { d = null; }
    d = d && typeof d === 'object' ? d : {};
    d.modules = d.modules || {};
    d.settings = d.settings || {};
    d.exam = d.exam || { attempts: [] };
    d.review = d.review || {};
    d.last = d.last || null;
    this.data = d;
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* gizli mod vb. */ } },
  mod(id) {
    const m = this.data.modules;
    if (!m[id]) m[id] = { visited: [], cards: {}, quiz: null, done: false };
    return m[id];
  },
  reset() { try { localStorage.removeItem(this.key); } catch (e) {} this.load(); }
};

/* ---------- 3. Animasyon yardımcıları ---------- */
const Motion = {
  reduced() { return document.documentElement.classList.contains('reduce-motion'); },
  wait(ms) { return new Promise((r) => setTimeout(r, this.reduced() ? 0 : ms)); },
  apply() {
    const s = Store.data.settings.reduceMotion;
    const sys = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const on = (s === undefined || s === null) ? sys : !!s;
    document.documentElement.classList.toggle('reduce-motion', on);
    const b = $('#motionBtn');
    if (b) b.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
};
/* Sayfa değişince devam eden animasyonları durdurmak için jeton */
let NAV_TOKEN = 0;
const alive = (tok) => tok === NAV_TOKEN;

/* Bir öğeyi kısa süre vurgula */
function flash(el, ms = 900) {
  if (!el) return;
  el.classList.add('flash');
  setTimeout(() => el.classList.remove('flash'), Motion.reduced() ? 400 : ms);
}

/* Bir "veri jetonunu" iki öğe arasında uçur (konteyner position:relative olmalı) */
async function flyToken(container, fromEl, toEl, label) {
  if (!container || !fromEl || !toEl) return;
  if (Motion.reduced()) { flash(toEl); return; }
  const cr = container.getBoundingClientRect();
  const fr = fromEl.getBoundingClientRect();
  const tr = toEl.getBoundingClientRect();
  const t = document.createElement('div');
  t.className = 'token';
  t.setAttribute('aria-hidden', 'true');
  t.textContent = label;
  container.appendChild(t);
  const w = t.offsetWidth, h = t.offsetHeight;
  const x0 = fr.left - cr.left + fr.width / 2 - w / 2, y0 = fr.top - cr.top + fr.height / 2 - h / 2;
  const x1 = tr.left - cr.left + tr.width / 2 - w / 2, y1 = tr.top - cr.top + tr.height / 2 - h / 2;
  t.style.left = '0px'; t.style.top = '0px';
  t.style.transform = `translate(${x0}px, ${y0}px)`;
  t.getBoundingClientRect(); // yeniden akışı zorla
  t.style.transform = `translate(${x1}px, ${y1}px)`;
  await new Promise((r) => setTimeout(r, 780));
  flash(toEl);
  t.style.opacity = '0';
  setTimeout(() => t.remove(), 250);
}

/* ---------- 4. Ortak etkileşimli bileşenler ---------- */

/* Explorer: seçilebilir öğe listesi + ayrıntı paneli.
   opts: { items:[{label, sub, title, html}], layout:'stack'|'row'|'list', start:0 } */
function Explorer(el, opts) {
  const id = 'ex' + Math.random().toString(36).slice(2, 8);
  el.innerHTML = `
    <div class="explorer ${opts.layout || ''}">
      <ul class="ex-list" role="list">
        ${opts.items.map((it, i) => `<li><button type="button" class="ex-item" data-i="${i}" aria-pressed="false" aria-controls="${id}">
          ${it.label}${it.sub ? `<small>${it.sub}</small>` : ''}</button></li>`).join('')}
      </ul>
      <div class="ex-detail" id="${id}" aria-live="polite"></div>
    </div>`;
  const detail = $('#' + id, el);
  const btns = $$('.ex-item', el);
  function show(i) {
    btns.forEach((b, j) => b.setAttribute('aria-pressed', j === i ? 'true' : 'false'));
    const it = opts.items[i];
    detail.innerHTML = `<h4>${it.title || it.label}</h4>${it.html}`;
    if (opts.onShow) opts.onShow(i);
  }
  btns.forEach((b) => b.addEventListener('click', () => show(+b.dataset.i)));
  show(opts.start || 0);
  return { show };
}

/* FlowStepper: adım adım süreç animasyonu.
   opts: { nodes:[{ico, label}], steps:[{node, text, token}] , autoDelay } */
function FlowStepper(el, opts) {
  el.innerHTML = `
    <div class="flow-area" style="position:relative">
      <div class="flow" role="list">
        ${opts.nodes.map((n, i) => `<div class="flow-node" role="listitem" data-i="${i}"><span class="n">${i + 1}</span><span class="ico" aria-hidden="true">${n.ico || ''}</span>${n.label}</div>`).join('')}
      </div>
    </div>
    <div class="live" aria-live="polite"></div>
    <div class="btn-row">
      <button type="button" class="btn small" data-a="prev">◀ Geri</button>
      <button type="button" class="btn small primary" data-a="next">İleri ▶</button>
      <button type="button" class="btn small" data-a="play">⏵ Otomatik oynat</button>
      <button type="button" class="btn small ghost" data-a="reset">↺ Baştan</button>
      <span class="muted" style="font-size:.85rem" data-r="count"></span>
    </div>`;
  const area = $('.flow-area', el);
  const nodes = $$('.flow-node', el);
  const live = $('.live', el);
  const count = $('[data-r="count"]', el);
  let cur = -1, playing = false;
  const tok = NAV_TOKEN;
  function paint() {
    const st = opts.steps[cur];
    nodes.forEach((n, i) => {
      n.classList.toggle('active', !!st && st.node === i);
      n.classList.toggle('past', !!st && i < st.node);
    });
    live.innerHTML = st ? `<strong>Adım ${cur + 1}/${opts.steps.length}.</strong> ${st.text}` : (opts.intro || 'Başlamak için <b>İleri</b> düğmesine bas.');
    count.textContent = st ? `${cur + 1} / ${opts.steps.length}` : '';
  }
  async function go(i) {
    const prev = cur;
    cur = clamp(i, -1, opts.steps.length - 1);
    paint();
    const a = opts.steps[prev], b = opts.steps[cur];
    if (a && b && b.node !== a.node && cur > prev) {
      await flyToken(area, nodes[a.node], nodes[b.node], b.token || '•');
    }
  }
  async function play() {
    if (playing) return;
    playing = true;
    if (cur >= opts.steps.length - 1) await go(-1);
    while (playing && alive(tok) && cur < opts.steps.length - 1) {
      await go(cur + 1);
      await Motion.wait(opts.autoDelay || 1500);
    }
    playing = false;
  }
  el.addEventListener('click', (e) => {
    const a = e.target.closest('[data-a]');
    if (!a) return;
    const act = a.dataset.a;
    if (act !== 'play') playing = false;
    if (act === 'next') go(cur + 1);
    else if (act === 'prev') go(cur - 1);
    else if (act === 'reset') go(-1);
    else if (act === 'play') play();
  });
  paint();
}

/* SortGame: her öğe için doğru kategoriyi seç (anında geri bildirim).
   opts: { cats:['CPU','GPU'], items:[{text, cat, exp}], title } */
function SortGame(el, opts) {
  const items = opts.shuffle === false ? opts.items : shuffle(opts.items);
  let score = 0, answered = 0;
  el.innerHTML = `
    <p class="lab-hint">${opts.hint || 'Her görev için uygun birimi seç. Seçimin anında değerlendirilir.'}</p>
    <div class="btn-row"><span class="score-pill" aria-live="polite">Puan: 0 / ${items.length}</span></div>
    ${items.map((it, i) => `
      <div class="sort-item" data-i="${i}">
        <div class="q">${i + 1}. ${it.text}</div>
        <div class="sort-opts" role="group" aria-label="Seçenekler">
          ${opts.cats.map((c) => `<button type="button" data-c="${esc(c)}">${c}</button>`).join('')}
        </div>
        <div class="sort-fb" aria-live="polite"></div>
      </div>`).join('')}
    <div class="btn-row"><button type="button" class="btn small ghost" data-a="reset">↺ Yeniden oyna</button></div>`;
  const pill = $('.score-pill', el);
  $$('.sort-item', el).forEach((row) => {
    const it = items[+row.dataset.i];
    row.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-c]');
      if (!b || row.dataset.done) return;
      row.dataset.done = '1';
      const ok = b.dataset.c === it.cat;
      answered++; if (ok) score++;
      $$('button[data-c]', row).forEach((x) => {
        x.disabled = true;
        if (x.dataset.c === it.cat) x.classList.add('right');
      });
      if (!ok) b.classList.add('wrong');
      $('.sort-fb', row).innerHTML = `${ok ? '✅ <b>Doğru.</b>' : `❌ <b>Doğrusu: ${it.cat}.</b>`} ${it.exp || ''}`;
      pill.textContent = `Puan: ${score} / ${items.length}` + (answered === items.length ? (score === items.length ? ' — Mükemmel!' : ' — Bitti') : '');
    });
  });
  $('[data-a="reset"]', el).addEventListener('click', () => SortGame(el, opts));
}

/* ---------- 5. Bilgi kartları (flashcards) ---------- */
function Flashcards(el, mod) {
  const st = Store.mod(mod.id);
  const cards = mod.cards;
  let onlyAgain = false;
  let order = cards.map((_, i) => i);
  let pos = 0;

  el.innerHTML = `
    <div class="fc-wrap">
      <p class="lab-hint center">Karta tıkla (veya <kbd>Enter</kbd>/<kbd>Boşluk</kbd>) → çevir. Cevabı kendin söyledikten sonra işaretle. <kbd>←</kbd> <kbd>→</kbd> ile gezin.</p>
      <div class="bar" aria-hidden="true"><span></span></div>
      <div class="fc-stats" aria-live="polite"></div>
      <div class="fc-stage" tabindex="-1">
        <button type="button" class="fc" aria-describedby="fcPos">
          <span class="fc-face fc-front"><span class="lbl">Kavram / Soru</span><span class="txt"></span><span class="hint">Çevirmek için tıkla</span></span>
          <span class="fc-face fc-back"><span class="lbl">Cevap</span><span class="txt"></span></span>
        </button>
      </div>
      <p class="center muted" id="fcPos" style="font-size:.85rem;margin:8px 0 0"></p>
      <div class="fc-controls">
        <button type="button" class="btn small" data-a="prev" aria-label="Önceki kart">◀</button>
        <button type="button" class="btn small know" data-a="known">✓ Biliyorum</button>
        <button type="button" class="btn small again" data-a="again">↻ Tekrar et</button>
        <button type="button" class="btn small" data-a="next" aria-label="Sonraki kart">▶</button>
      </div>
      <div class="fc-controls">
        <button type="button" class="btn small ghost" data-a="shuffle">🔀 Karıştır</button>
        <button type="button" class="btn small ghost" data-a="filter" aria-pressed="false">Yalnızca “tekrar et” kartları</button>
        <button type="button" class="btn small ghost" data-a="clear">İşaretleri temizle</button>
      </div>
    </div>`;
  const fc = $('.fc', el), front = $('.fc-front .txt', el), back = $('.fc-back .txt', el);
  const stats = $('.fc-stats', el), posEl = $('#fcPos', el), barSpan = $('.bar > span', el);
  const filterBtn = $('[data-a="filter"]', el);

  function counts() {
    let k = 0, a = 0;
    cards.forEach((_, i) => { if (st.cards[i] === 'known') k++; else if (st.cards[i] === 'again') a++; });
    return { k, a, n: cards.length - k - a };
  }
  function visible() { return onlyAgain ? order.filter((i) => st.cards[i] === 'again') : order; }
  function render() {
    const vis = visible();
    const c = counts();
    stats.innerHTML = `<span class="chip ok">✓ Biliyorum: ${c.k}</span><span class="chip accent">↻ Tekrar: ${c.a}</span><span class="chip">Bakılmadı: ${c.n}</span>`;
    barSpan.style.width = `${Math.round(((c.k + c.a) / cards.length) * 100)}%`;
    fc.classList.remove('flipped', 'known', 'again');
    if (!vis.length) {
      front.textContent = onlyAgain ? 'Tekrar edilecek kart kalmadı 🎉' : 'Kart yok';
      back.textContent = '';
      posEl.textContent = '';
      fc.disabled = true;
      return;
    }
    fc.disabled = false;
    pos = clamp(pos, 0, vis.length - 1);
    const i = vis[pos];
    front.innerHTML = cards[i].q;
    back.innerHTML = cards[i].a;
    if (st.cards[i]) fc.classList.add(st.cards[i]);
    posEl.textContent = `Kart ${pos + 1} / ${vis.length}` + (st.cards[i] ? ` · İşaret: ${st.cards[i] === 'known' ? 'Biliyorum' : 'Tekrar et'}` : '');
    fc.setAttribute('aria-label', `Kart ${pos + 1}. Ön yüz: ${front.textContent}. Çevirmek için Enter.`);
  }
  function mark(v) {
    const vis = visible();
    if (!vis.length) return;
    st.cards[vis[pos]] = v;
    Store.save();
    if (onlyAgain && v === 'known') { render(); return; }
    pos = (pos + 1) % vis.length;
    render();
  }
  fc.addEventListener('click', () => {
    fc.classList.toggle('flipped');
    const flipped = fc.classList.contains('flipped');
    fc.setAttribute('aria-label', flipped ? `Cevap: ${back.textContent}` : `Ön yüz: ${front.textContent}`);
  });
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    const a = b.dataset.a, n = visible().length || 1;
    if (a === 'prev') { pos = (pos - 1 + n) % n; render(); }
    else if (a === 'next') { pos = (pos + 1) % n; render(); }
    else if (a === 'known') mark('known');
    else if (a === 'again') mark('again');
    else if (a === 'shuffle') { order = shuffle(order); pos = 0; render(); }
    else if (a === 'filter') { onlyAgain = !onlyAgain; filterBtn.setAttribute('aria-pressed', String(onlyAgain)); pos = 0; render(); }
    else if (a === 'clear') { st.cards = {}; Store.save(); render(); }
  });
  el.addEventListener('keydown', (e) => {
    if (e.target.matches('input,select,textarea')) return;
    if (e.key === 'ArrowRight') { $('[data-a="next"]', el).click(); }
    else if (e.key === 'ArrowLeft') { $('[data-a="prev"]', el).click(); }
  });
  render();
}

/* ---------- 6. Quiz motoru ----------
   Soru biçimi:
   { id, type:'mc'|'tf'|'match', q, options:[..], answer:<index>|true|false, pairs:[[sol,sağ],..], exp, mod }
   Mod 'mini': tek seferde bir soru, anında geri bildirim, sonunda skor ve "yanlışları tekrar çöz". */
function prepQuestion(q) {
  if (q.type === 'tf') return { ...q, view: [{ t: 'Doğru', ok: q.answer === true }, { t: 'Yanlış', ok: q.answer === false }] };
  if (q.type === 'match') return { ...q, rights: shuffle(q.pairs.map((p) => p[1])) };
  return { ...q, view: shuffle(q.options.map((t, i) => ({ t, ok: i === q.answer }))) };
}
function typeLabel(q) { return q.type === 'tf' ? 'Doğru / Yanlış' : q.type === 'match' ? 'Eşleştirme' : 'Çoktan seçmeli'; }

function MiniQuiz(el, questions, opts = {}) {
  let list = questions.map(prepQuestion);
  let idx = 0;
  let results = []; // {q, ok}
  const total0 = questions.length;

  function header() {
    const pct = Math.round((idx / list.length) * 100);
    return `<div class="quiz-top"><span>Soru ${idx + 1} / ${list.length}${list.length !== total0 ? ' (tekrar turu)' : ''}</span><span>Doğru: ${results.filter((r) => r.ok).length}</span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${list.length}" aria-valuenow="${idx}" aria-label="Quiz ilerlemesi"><span style="width:${pct}%"></span></div>`;
  }
  function renderQ() {
    const q = list[idx];
    let body = '';
    if (q.type === 'match') {
      body = `<div class="match">${q.pairs.map((p, i) => `
        <div class="match-row" data-i="${i}"><span>${p[0]}</span>
          <select aria-label="${esc(p[0])} için eşleşme"><option value="">— seç —</option>${q.rights.map((r) => `<option>${esc(r)}</option>`).join('')}</select></div>`).join('')}
        <div class="btn-row"><button type="button" class="btn primary" data-a="check">Kontrol et</button></div></div>`;
    } else {
      body = `<div class="opts" role="group" aria-label="Seçenekler">${q.view.map((o, i) => `
        <button type="button" class="opt" data-i="${i}"><span class="key">${q.type === 'tf' ? (i ? 'Y' : 'D') : LETTERS[i]}</span><span>${o.t}</span></button>`).join('')}</div>`;
    }
    el.innerHTML = `<div class="quiz">${header()}
      <div class="quiz-type">${typeLabel(q)}</div>
      <div class="quiz-q" id="qText" tabindex="-1">${q.q}</div>
      ${body}
      <div class="fb-slot" aria-live="polite"></div>
    </div>`;
    $('#qText', el).focus({ preventScroll: true });
  }
  function feedback(ok, q) {
    const last = idx === list.length - 1;
    $('.fb-slot', el).innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}"><strong>${ok ? '✅ Doğru!' : '❌ Yanlış.'}</strong>${q.exp}</div>
      <div class="btn-row"><button type="button" class="btn primary" data-a="next">${last ? 'Sonucu gör' : 'Sonraki soru ▶'}</button></div>`;
    results.push({ q, ok });
    $('[data-a="next"]', el).focus();
  }
  function finish() {
    const ok = results.filter((r) => r.ok).length;
    const n = results.length;
    const wrong = results.filter((r) => !r.ok);
    const isFirst = list.length === total0;
    if (opts.onFinish) opts.onFinish({ score: ok, total: n, wrongIds: wrong.map((r) => r.q.id), full: isFirst });
    const pct = Math.round((ok / n) * 100);
    const passBox = !opts.threshold || !isFirst ? '' : (ok / n >= opts.threshold
      ? `<div class="box summary"><div class="box-title">✅ Modül tamamlandı</div><p>%${Math.round(opts.threshold * 100)} eşiğini geçtin. Skorun kaydedildi.</p></div>`
      : `<div class="box warn"><div class="box-title">↻ Tekrar önerilir</div><p>Modülü “tamamlandı” saymak için en az <b>%${Math.round(opts.threshold * 100)}</b> gerekiyor (bu deneme: %${pct}). Yanlışları tekrar çöz veya kartlara dön; istersen yine de sonraki modüle geçebilirsin. Skorun kaydedildi.</p></div>`);
    const msg = pct === 100 ? 'Harika! Hepsi doğru.' : pct >= 70 ? 'Güzel iş. Yanlışlara bir göz at.' : 'Sorun değil; yanlışları tekrar çöz, kartlara dön.';
    el.innerHTML = `<div class="quiz">
      <div class="result-hero"><div class="muted">${isFirst ? 'Quiz sonucu' : 'Tekrar turu sonucu'}</div>
        <div class="big" tabindex="-1" id="qRes">${ok} / ${n}</div><p>%${pct} · ${msg}</p>
        <p><span class="chip ok">Doğru: ${ok}</span> <span class="chip accent">Yanlış: ${n - ok}</span></p></div>
      ${passBox}
      ${wrong.length ? `<h3>Yanlış yaptıkların</h3><ul class="wrong-list">${wrong.map((r) => `<li><b>${r.q.q}</b><br><span class="muted">${r.q.exp}</span></li>`).join('')}</ul>` : ''}
      <div class="btn-row" style="justify-content:center">
        ${wrong.length ? `<button type="button" class="btn primary" data-a="retry">↻ Yanlışları tekrar çöz (${wrong.length})</button>` : ''}
        <button type="button" class="btn" data-a="restart">Baştan çöz</button>
        ${opts.afterHtml || ''}
      </div></div>`;
    $('#qRes', el).focus({ preventScroll: true });
    el.querySelector('[data-a="retry"]')?.addEventListener('click', () => {
      list = shuffle(wrong.map((r) => prepQuestion(questions.find((q) => q.id === r.q.id))));
      idx = 0; results = []; renderQ();
    });
    el.querySelector('[data-a="restart"]').addEventListener('click', () => {
      list = questions.map(prepQuestion); idx = 0; results = []; renderQ();
    });
  }
  el.addEventListener('click', (e) => {
    const q = list[idx];
    const opt = e.target.closest('.opt');
    if (opt && !opt.disabled && el.contains(opt)) {
      const i = +opt.dataset.i;
      const ok = q.view[i].ok;
      $$('.opt', el).forEach((b, j) => {
        b.disabled = true;
        if (q.view[j].ok) b.classList.add('correct');
      });
      if (!ok) opt.classList.add('incorrect');
      feedback(ok, q);
      return;
    }
    const a = e.target.closest('[data-a]');
    if (!a) return;
    if (a.dataset.a === 'check' && q && q.type === 'match') {
      let allOk = true;
      $$('.match-row', el).forEach((row) => {
        const i = +row.dataset.i, s = $('select', row);
        const good = s.value === q.pairs[i][1];
        row.classList.add(good ? 'correct' : 'incorrect');
        if (!good) allOk = false;
        s.disabled = true;
      });
      a.disabled = true;
      feedback(allOk, q);
    } else if (a.dataset.a === 'next') {
      if (idx < list.length - 1) { idx++; renderQ(); } else finish();
    }
  });
  renderQ();
}

/* ---------- 7. Modül kaydı ---------- */
const MODULES = [];
function registerModule(m) {
  m.steps = m.steps || [];
  m.ready = m.ready !== false;
  MODULES.push(m);
  MODULES.sort((a, b) => a.no - b.no);
}
/* İçerik adımlarına bilgi kartı + quiz adımlarını ekle */
function allSteps(m) {
  if (!m.ready) return [];
  return m.steps.concat([
    { id: 'kartlar', tag: 'Bilgi kartları', title: 'Bilgi kartları', minutes: m.cardMinutes || 3, type: 'cards' },
    { id: 'quiz', tag: 'Mini quiz', title: 'Mini quiz', minutes: m.quizMinutes || 4, type: 'quiz' }
  ]);
}
function moduleMinutes(m) { return m.ready ? allSteps(m).reduce((s, x) => s + (x.minutes || 0), 0) : (m.minutes || 0); }
const EXTRA_MIN = { intro: 3, review: 15, exam: 30 }; // sınav: 25 dk + 5 dk sonuç inceleme
function totalMinutes() { return MODULES.reduce((s, m) => s + moduleMinutes(m), 0) + EXTRA_MIN.intro + EXTRA_MIN.review + EXTRA_MIN.exam; }

const PASS_RATIO = 0.6; // modül tamamlama eşiği: quizde en az %60
const quizPassed = (q) => !!q && q.total > 0 && q.best / q.total >= PASS_RATIO;
function moduleStatus(m) {
  const st = Store.data.modules[m.id];
  if (!st) return 'new';
  if (st.done) return 'done';
  if (st.quiz && !quizPassed(st.quiz)) return 'retry';
  return st.visited.length ? 'started' : 'new';
}
function checkDone(m) {
  const st = Store.mod(m.id);
  const ids = allSteps(m).map((s) => s.id);
  const allVisited = ids.every((id) => st.visited.includes(id));
  const done = allVisited && quizPassed(st.quiz); // kilit yok: yalnızca "tamamlandı" etiketini belirler
  if (st.done !== done) { st.done = done; Store.save(); }
}
function globalProgress() {
  const units = MODULES.length + 2;
  let done = MODULES.filter((m) => moduleStatus(m) === 'done').length;
  if (Store.data.review.visited) done++;
  if (Store.data.exam.attempts.length) done++;
  return Math.round((done / units) * 100);
}

  const stIcon = (m) => ({ done: 'Tamamlandı', started: 'Devam ediyor', retry: 'Tekrar önerilir', new: '' }[moduleStatus(m)]);

function pageModule(m, stepIdx) {
  if (!m.ready) {
    return `<div class="container"><div class="module-head"><span class="chip brand">Modül ${m.no}</span><span>Kaynak: ${m.source}</span><h1>${m.title}</h1></div>
      <div class="card placeholder"><div class="big" aria-hidden="true">🛠️</div><h2>Bu modül hazırlanıyor</h2>
      <p>Modül ${m.no} içeriği bir sonraki teslimde eklenecek.</p>
      <p class="muted">Planlanan konular: ${m.blurb}</p>
      <div class="btn-row" style="justify-content:center"><a class="btn primary" href="#/">Modül haritasına dön</a></div></div></div>`;
  }
  const steps = allSteps(m);
  const st = Store.mod(m.id);
  const s = steps[stepIdx];
  const prev = steps[stepIdx - 1], next = steps[stepIdx + 1];
  const nextMod = MODULES.find((x) => x.no === m.no + 1);
  const nextHref = next ? `#/m/${m.id}/${stepIdx + 1}` : (nextMod ? `#/m/${nextMod.id}` : '#/tekrar');
  const nextLabel = next ? next.title : (nextMod ? `Modül ${nextMod.no}: ${nextMod.short || nextMod.title}` : 'Sınavdan önce tekrar');
  let body = '';
  if (s.type === 'cards') body = `<p>Bu modülde ${m.cards.length} kart var. Önce cevabı kendin hatırlamaya çalış, sonra kartı çevir.</p><div id="fcHost"></div>`;
  else if (s.type === 'quiz') body = `<p>${m.quiz.length} soru. Her cevaptan sonra kısa açıklama gelecek. Sonunda skorunu ve yanlışlarını göreceksin. Modülün “tamamlandı” sayılması için en az <b>%60</b> gerekir (kilit yok; altında kalırsan “tekrar önerilir” uyarısı görürsün).</p>${st.quiz ? `<p><span class="chip">Önceki en iyi skor: ${st.quiz.best}/${st.quiz.total}</span></p>` : ''}<div id="quizHost"></div>`;
  else body = (stepIdx === 0 ? `<div class="card"><h3 class="mt0">🎯 Öğrenme hedefleri</h3><p class="muted mt0">Bu modül sonunda…</p><ul class="objectives">${m.objectives.map((o) => `<li>${o}</li>`).join('')}</ul></div>` : '') + s.html;
  return `<div class="container">
    <div class="module-head"><span class="chip brand">Modül ${m.no} / ${MODULES.length}</span><span>⏱ ${moduleMinutes(m)} dk</span><span>Kaynak: ${m.source}</span>
      ${st.done ? '<span class="chip ok">✓ Tamamlandı</span>' : (st.quiz && !quizPassed(st.quiz) ? `<span class="chip accent">↻ Tekrar önerilir (en iyi quiz: ${st.quiz.best}/${st.quiz.total})</span>` : '')}<h1>${m.title}</h1></div>
    <nav class="stepper" aria-label="Modül adımları">
      ${steps.map((x, i) => `<button type="button" data-step="${i}" class="${st.visited.includes(x.id) ? 'visited' : ''}" ${i === stepIdx ? 'aria-current="step"' : ''}><span class="dot" aria-hidden="true"></span>${i + 1}. ${x.title}</button>`).join('')}
    </nav>
    <div class="bar" aria-hidden="true"><span style="width:${Math.round(((stepIdx + 1) / steps.length) * 100)}%"></span></div>
    <article class="step" aria-labelledby="stepTitle">
      <div class="step-head"><div><div class="step-tag">${s.tag}</div><h2 id="stepTitle" tabindex="-1">${s.title}</h2></div><span class="chip">⏱ ~${s.minutes} dk</span></div>
      ${body}
    </article>
    <nav class="step-nav" aria-label="Adım gezinmesi">
      ${prev ? `<a class="btn" href="#/m/${m.id}/${stepIdx - 1}">◀ <span class="t">${prev.title}</span></a>` : '<span></span>'}
      <a class="btn primary" href="${nextHref}"><span class="t">${nextLabel}</span> ▶</a>
    </nav>
  </div>`;
}
function initModule(main, m, stepIdx) {
  if (!m.ready) return;
  const steps = allSteps(m);
  const s = steps[stepIdx];
  const st = Store.mod(m.id);
  if (!st.visited.includes(s.id)) st.visited.push(s.id);
  Store.data.last = { id: m.id, step: stepIdx };
  Store.save();
  checkDone(m);
  $('.stepper', main).addEventListener('click', (e) => {
    const b = e.target.closest('[data-step]');
    if (b) location.hash = `#/m/${m.id}/${b.dataset.step}`;
  });
  const cur = $('.stepper [aria-current]', main);
  if (cur) cur.scrollIntoView({ block: 'nearest', inline: 'center' });
  if (s.type === 'cards') Flashcards($('#fcHost', main), m);
  else if (s.type === 'quiz') {
    MiniQuiz($('#quizHost', main), m.quiz, {
      threshold: PASS_RATIO,
      afterHtml: `<a class="btn" href="#/m/${m.id}/${stepIdx - 1}">Kartlara dön</a>`,
      onFinish(r) {
        if (!r.full) return;
        const q = st.quiz || { best: 0, total: r.total, attempts: 0 };
        q.best = Math.max(q.best, r.score); q.last = r.score; q.date = new Date().toISOString(); q.total = r.total; q.attempts = (q.attempts || 0) + 1; q.wrong = r.wrongIds;
        st.quiz = q;
        Store.save();
        checkDone(m);
        renderSidebar(parseRoute());
        const head = $('.module-head', main);
        if (head) { const old = head.querySelector('.chip.ok, .chip.accent'); if (old) old.remove(); head.querySelector('h1').insertAdjacentHTML('beforebegin', st.done ? '<span class="chip ok">✓ Tamamlandı</span>' : `<span class="chip accent">↻ Tekrar önerilir (en iyi quiz: ${q.best}/${q.total})</span>`); }
      }
    });
  } else if (s.init) {
    s.init(main);
  }
}

/* Sınav ve tekrar sayfaları son teslimde doldurulur; şimdilik yer tutucu */
const SPECIAL_PAGES = {
  review: {
    html: () => `<div class="container"><h1>Sınavdan 10–15 dakika önce</h1><div class="card placeholder"><div class="big" aria-hidden="true">⚡</div><h2>Bu bölüm hazırlanıyor</h2><p>Tek sayfalık özet, sık karıştırılan kavramlar tablosu, 10 kritik nokta ve 5 soruluk hızlı tur son teslimde eklenecek.</p><a class="btn primary" href="#/">Modül haritasına dön</a></div></div>`,
    init: () => {}
  },
  exam: {
    html: () => `<div class="container"><h1>Vize simülasyonu</h1><div class="card placeholder"><div class="big" aria-hidden="true">📝</div><h2>Bu bölüm hazırlanıyor</h2><p>20 soruluk, 25 dakikalık vize provası son teslimde eklenecek.</p><a class="btn primary" href="#/">Modül haritasına dön</a></div></div>`,
    init: () => {}
  }
};

/* ---------- 10. Router ---------- */
function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'm' && parts[1]) {
    const m = MODULES.find((x) => x.id === parts[1]);
    if (m) {
      const n = allSteps(m).length;
      return { name: 'module', id: m.id, m, step: clamp(parseInt(parts[2] || '0', 10) || 0, 0, Math.max(0, n - 1)) };
    }
  }
  if (parts[0] === 'tekrar') return { name: 'review' };
  if (parts[0] === 'sinav') return { name: 'exam' };
  return { name: 'home' };
}
function route() {
  // ana sayfadaki #harita gibi sayfa içi çapalar
  if (location.hash === '#harita' && $('#harita')) { const h = $('#harita'); h.focus(); h.scrollIntoView(); return; }
  NAV_TOKEN++;
  const r = parseRoute();
  const main = $('#main');
  if (r.name === 'module') { main.innerHTML = pageModule(r.m, r.step); initModule(main, r.m, r.step); document.title = `Modül ${r.m.no}: ${r.m.short || r.m.title} · Bilgisayar Donanımı`; }
  else if (r.name === 'review' || r.name === 'exam') {
    const p = SPECIAL_PAGES[r.name];
    main.innerHTML = p.html(); p.init(main);
    document.title = (r.name === 'review' ? 'Sınavdan önce tekrar' : 'Vize simülasyonu') + ' · Bilgisayar Donanımı';
  } else { main.innerHTML = pageHome(); initHome(main); document.title = 'Bilgisayar Donanımı · Etkileşimli Ders'; }
  renderSidebar(r);
  $('#sidebar').classList.remove('open');
  $('#menuBtn').setAttribute('aria-expanded', 'false');
  window.scrollTo(0, 0);
  if (location.hash === '#harita') { const h = $('#harita'); if (h) { h.focus(); h.scrollIntoView(); } return; }
  const focusEl = $('#stepTitle', main) || $('h1', main);
  if (focusEl) { focusEl.setAttribute('tabindex', '-1'); focusEl.focus({ preventScroll: true }); }
}

/* ---------- 11. Açılış ---------- */
function boot() {
  Store.load();
  Motion.apply();
  $('#brandIcon').innerHTML = BRAND_SVG;
  $('#motionBtn').addEventListener('click', () => {
    const on = !document.documentElement.classList.contains('reduce-motion');
    Store.data.settings.reduceMotion = on; Store.save(); Motion.apply();
  });
  $('#menuBtn').addEventListener('click', () => {
    const sb = $('#sidebar');
    const open = !sb.classList.contains('open');
    sb.classList.toggle('open', open);
    $('#menuBtn').setAttribute('aria-expanded', String(open));
    if (open) { const a = $('a', sb); if (a) a.focus(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#sidebar').classList.contains('open')) { $('#sidebar').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); $('#menuBtn').focus(); }
  });
  window.addEventListener('hashchange', route);
  route();
}

      </div>`;
    const R = (k) => $(`[data-r="${k}"]`, host);
    function paint() {
      $$('.bit', host).forEach((b) => {
        const on = (val >> +b.dataset.b) & 1;
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        $('.v', b).textContent = on;
      });
      const bin = val.toString(2).padStart(8, '0');
      R('bin').textContent = bin.slice(0, 4) + ' ' + bin.slice(4);
      R('dec').textContent = val;
      R('hex').textContent = val.toString(16).toUpperCase().padStart(2, '0');
      const parts = [7, 6, 5, 4, 3, 2, 1, 0].filter((b) => (val >> b) & 1).map((b) => 1 << b);
      R('sum').innerHTML = parts.length
        ? `${parts.join(' + ')} = <b>${val}</b> · Nibble’lar: ${bin.slice(0, 4)} → ${(val >> 4).toString(16).toUpperCase()}, ${bin.slice(4)} → ${(val & 15).toString(16).toUpperCase()} · yani <b>${val.toString(16).toUpperCase().padStart(2, '0')}₁₆</b>`
        : 'Tüm bitler 0 → değer <b>0</b>.';
      R('asnum').textContent = val;
      R('aschar').innerHTML = val >= 32 && val <= 126 ? `“${esc(String.fromCharCode(val))}”` : (val > 127 ? '<span style="font-size:.85rem">ASCII dışı (ASCII 128 kod tanımlar: 0–127)</span>' : '<span style="font-size:.85rem">yazdırılamayan kontrol kodu</span>');
      R('sw').style.background = `rgb(${val},${val},${val})`;
      R('swv').textContent = `${val} / 255`;
      if (document.activeElement !== R('in')) R('in').value = val;
      if (!solved && val === task.v) {
        solved = true;
        R('taskres').innerHTML = '<span class="task-ok">✅ Başardın! ' + task.v + ' = ' + bin + '₂</span>';
      }
    }
    function newTask() {
      const pool = TASKS.filter((t) => t !== task);
      task = pool[Math.floor(Math.random() * pool.length)];
      solved = false;
      R('task').innerHTML = `Bitleri açıp kapatarak ${task.t} oluştur.`;
      R('taskres').textContent = '';
      if (val === task.v) paint();
    }
    host.addEventListener('click', (e) => {
      const b = e.target.closest('.bit');
      if (b) { val ^= (1 << +b.dataset.b); paint(); return; }
      const a = e.target.closest('[data-a]');
      if (!a) return;
      if (a.dataset.a === 'zero') val = 0;
      if (a.dataset.a === 'ones') val = 255;
      if (a.dataset.a === 'newtask') { newTask(); return; }
      paint();
    });
    R('in').addEventListener('input', (e) => {
      const n = parseInt(e.target.value, 10);
      if (!isNaN(n)) { val = clamp(n, 0, 255); paint(); }
    });
    R('task').innerHTML = `Bitleri açıp kapatarak ${task.t} oluştur.`;
    paint();
  }

  /* ---------- Etkileşim 5: Birim hesaplayıcı (SI ↔ IEC) ---------- */
  function initUnitCalc(root) {
    const host = $('#m1Units', root);
    const U = [
      ['B', 1, 'byte'], ['kB', 1e3, 'SI'], ['MB', 1e6, 'SI'], ['GB', 1e9, 'SI'], ['TB', 1e12, 'SI'],
      ['KiB', 2 ** 10, 'IEC'], ['MiB', 2 ** 20, 'IEC'], ['GiB', 2 ** 30, 'IEC']
    ];
    host.innerHTML = `
      <p class="lab-hint">Bir miktar ve birim seç; aynı byte sayısının ondalık (SI) ve ikili (IEC) birimlerdeki karşılığını gör.</p>
      <div class="grid cols-2">
        <label class="field">Miktar <input type="number" min="0" step="any" value="1" data-r="amt"></label>
        <label class="field">Birim <select data-r="unit">${U.map((u) => `<option ${u[0] === 'TB' ? 'selected' : ''}>${u[0]}</option>`).join('')}</select></label>
      </div>
      <div class="btn-row"><span class="muted" style="font-size:.85rem">Hazır örnekler:</span>
        <button type="button" class="btn small" data-p="1,TB">1 TB disk</button>
        <button type="button" class="btn small" data-p="256,GB">256 GB SSD</button>
        <button type="button" class="btn small" data-p="4,GiB">4 GiB (32 bit adres alanı)</button>
        <button type="button" class="btn small" data-p="1,KiB">1 KiB</button>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Birim</th><th>Aile</th><th>Değer</th></tr></thead>
        <tbody data-r="rows"></tbody></table></div>
      <p class="live" data-r="msg" aria-live="polite"></p>`;
    const amt = $('[data-r="amt"]', host), unit = $('[data-r="unit"]', host);
    function nice(v) {
      if (v === 0) return '0';
      if (v >= 0.0001) return fmt(v, v < 10 ? 4 : 2);
      return v.toExponential(3).replace('.', ',');
    }
    function paint() {
      const a = Math.max(0, parseFloat(amt.value) || 0);
      const u = U.find((x) => x[0] === unit.value);
      const bytes = a * u[1];
      $('[data-r="rows"]', host).innerHTML = U.map((x) => `<tr ${x[0] === u[0] ? 'style="background:var(--accent-soft)"' : ''}><td><b>${x[0]}</b></td><td>${x[2]}${x[1] > 1 ? ` (${x[2] === 'SI' ? '10' + '<sup>' + Math.round(Math.log10(x[1])) + '</sup>' : '2' + '<sup>' + Math.round(Math.log2(x[1])) + '</sup>'} B)` : ''}</td><td class="mono">${nice(bytes / x[1])}</td></tr>`).join('');
      let msg = `<b>${fmt(a, 4)} ${u[0]}</b> = <b>${fmt(bytes, 0)} byte</b>.`;
      if (u[0] === 'TB' && a === 1) msg += ' İşte bu yüzden 1 TB’lık disk, işletim sisteminde yaklaşık <b>931,3 GiB</b> görünür. Kimse seni kandırmadı; iki farklı birim ailesi kullanılıyor!';
      if (u[0] === 'GiB' && a === 4) msg += ' 32 bitlik adres alanı 2³² farklı byte adresine, yani yaklaşık 4 GiB’a karşılık gelir.';
      $('[data-r="msg"]', host).innerHTML = msg;
    }
    amt.addEventListener('input', paint);
    unit.addEventListener('change', paint);
    host.addEventListener('click', (e) => {
      const b = e.target.closest('[data-p]');
      if (!b) return;
      const [n, un] = b.dataset.p.split(',');
      amt.value = n; unit.value = un; paint();
    });
    paint();
  }

      /* ---- Adım 5: Sayı sistemleri ---- */
      { id: 'sayilar', tag: 'Temel kavramlar', title: 'Bit, byte, ikili ve onaltılık', minutes: 4, html: `
        <p>Bilgisayarlar fiziksel düzeyde elektriksel sinyallerle çalışır; ama <b>mantıksal düzeyde</b> veri, ikili (binary) sistemin <b>0 ve 1</b> değerleriyle temsil edilir. Bir ikili rakama <span class="term">bit</span> (binary digit) denir.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Kavram</th><th>Tanım</th><th>Örnek</th></tr></thead>
          <tbody>
            <tr><td><b>Bit (b)</b></td><td>0 veya 1 değerini alır.</td><td>1 bit iki farklı durumu temsil eder.</td></tr>
            <tr><td><b>Nibble</b></td><td>4 bitlik grup.</td><td>1111₂ = F₁₆</td></tr>
            <tr><td><b>Byte (B)</b></td><td>8 bitlik grup.</td><td>1 B = 8 bit</td></tr>
            <tr><td><b>Word</b></td><td>İşlemcinin doğal veri genişliğiyle ilişkili terim.</td><td>Mimariye göre 16, 32 veya 64 bit.</td></tr>
            <tr><td><b>Binary</b></td><td>Taban 2 sayı sistemi.</td><td>42₁₀ = 101010₂</td></tr>
            <tr><td><b>Hexadecimal</b></td><td>Taban 16; 0–9 ve A–F kullanır.</td><td>42₁₀ = 2A₁₆; 255₁₀ = FF₁₆</td></tr>
          </tbody></table></div>
        <p>İkili sistemde her basamak 2’nin bir kuvvetidir (…, 8, 4, 2, 1). Örneğin onluk <b>13 = 8 + 4 + 1</b>; bunlar 2³, 2² ve 2⁰ olduğundan <b>13₁₀ = 1101₂</b>. Onaltılık gösterim programcılıkta çok sevilir, çünkü <b>4 bit tam olarak 1 hex basamağına</b> denk gelir; uzun bit dizileri kısa yazılır.</p>
        <div class="box analogy"><div class="box-title">💡 Günlük hayattan: Işık anahtarları</div>
          <p>8 tane lamba anahtarı düşün; her biri açık (1) ya da kapalı (0). Soldan sağa anahtarların “değeri” 128, 64, 32, 16, 8, 4, 2, 1. Açık olanların değerlerini toplayınca sayıyı bulursun.</p>
          <span class="limit">Gerçek devrelerde 0 ve 1, “akım var / yok” gibi basit bir anahtar değildir. Belirlenmiş gerilim aralıkları, manyetik yönelimler, elektrik yükü ya da optik durumlar 0 veya 1 olarak <b>yorumlanır</b>; mantık seviyeleri teknolojiye göre tanımlanır.</span></div>
        <div class="box note"><div class="box-title">ℹ️ Not: Ders notları arasında fark</div>
          <p>Hafta 2 notunda dijital sinyal için “akım geçiyorsa 1, geçmiyorsa 0” denir. Hafta 1 notu ise bunun <b>yalnızca kaba bir benzetme</b> olduğunu, gerçek devrelerde mantık seviyelerinin gerilim aralıklarıyla tanımlandığını vurgular. Sınavda “bit’in fiziksel karşılığı tek ve evrensel değildir” düşüncesini esas al.</p></div>
        <h3>Aynı bitler, farklı anlamlar</h3>
        <p><code>01100001</code> dizisi bir sayıyı, bir karakter kodunu ya da bir resimdeki renk bileşenini temsil edebilir. <b>Bit dizisine anlam kazandıran, kodlama ve yorumlama kuralıdır.</b> Yanlış yorumlama, bitler değişmediği hâlde anlamsız sonuç üretir.</p>
        <ul>
          <li><b>Metin:</b> Karakterler kodlamalarla temsil edilir. ASCII temel olarak 128 kod tanımlar. Unicode farklı yazı sistemlerindeki karakterlere <i>kod noktası</i> atar; UTF-8 bunları 1–4 byte’lık dizilere çevirir. Latin “A” UTF-8’de 1 byte’tır; Türkçe karakterlerin bazıları 2 veya daha fazla byte gerektirir.</li>
          <li><b>Görüntü:</b> Her pikselin parlaklık ve renk bileşenleri sayılarla ifade edilir.</li>
          <li><b>Ses:</b> Analog dalga belirli aralıklarla <i>örneklenir</i>; her örnek bir sayıya çevrilir.</li>

        <h3>Byte katları: MB mi, MiB mi?</h3>

          </tbody></table></div>
        <div class="box note"><div class="box-title">ℹ️ Not: Hafta 6 notunda farklı kullanım</div>
          <p>Hafta 1 ve Hafta 4 notları SI/IEC ayrımını yapar (1 kB = 1000 B, 1 KiB = 1024 B). Hafta 6 (bellek) notu ise RAM kapasitesi için “1 KB = 1024 Byte, 1 GB = 1024 MB” yazar. Bu, günlük kullanımdaki alışkanlıktır; <b>standart tanıma göre</b> 1024 tabanlı değerlerin doğru adı KiB/MiB/GiB’dir. Sınavda soru “SI” veya “IEC” derse buna göre cevapla.</p></div>

        <div class="box warn"><div class="box-title">⚠️ Dikkat</div><p>“64 bit işlemci, 32 bit işlemciden iki kat hızlıdır” <b>yanlıştır</b>. Bit genişliği adres alanı, yazmaç yapısı ve ISA yetenekleriyle ilgilidir. Gerçek performans mikromimari, çekirdek sayısı, IPC (çevrim başına komut), bellek sistemi, saat frekansı, güç sınırları ve iş yüküne bağlıdır.</p></div>` },

  /* ---------- Etkileşim 2: Von Neumann vs Harvard ---------- */

    host.innerHTML = `

      <div class="arch-demo">
        <div class="arch-col"><h4>Von Neumann</h4>
          <svg class="arch-svg" viewBox="0 0 240 235" role="img" aria-label="Von Neumann: tek ortak bellek ve tek yol">

        <div class="arch-col"><h4>Harvard</h4>

            <path class="path" d="M62 58 V 170"/><path class="path" d="M178 58 V 170"/>

            ${pk('hvK', 62, 158, 'K', '#a24e07')}${pk('hvV', 178, 158, 'V', '#1f4fbf')}

    const P = (id) => $('#' + id, host);
    const up = (el, on) => { el.style.transform = on ? 'translateY(-110px)' : 'translateY(0)'; el.style.opacity = on ? '1' : '.95'; };
    let busy = false;
    $('[data-a="run"]', host).addEventListener('click', async () => {

      const tok = NAV_TOKEN;

      ['vnK', 'vnV', 'hvK', 'hvV'].forEach((i) => up(P(i), false));

      vn.textContent = 'Zaman adımı: 0'; hv.textContent = 'Zaman adımı: 0';
      await Motion.wait(200);

        up(P('hvK'), true); up(P('hvV'), true); th++; hv.textContent = `Zaman adımı: ${th} — K ve V aynı anda geldi`;

        await Motion.wait(1100); if (!alive(tok)) break;
        up(P('vnK'), false); up(P('hvK'), false); up(P('hvV'), false);

        up(P('vnV'), true); tv++; vn.textContent = `Zaman adımı: ${tv} — veri (V) aynı yolu bekledi, şimdi geliyor`;
        if (c === 1) hv.textContent = `Zaman adımı: ${th} — bitti ✓`;
        await Motion.wait(1100); if (!alive(tok)) break;
        up(P('vnV'), false);
        await Motion.wait(250);
      }
      vn.textContent = `Toplam: ${tv} zaman adımı`; hv.textContent = `Toplam: ${th} zaman adımı`;
      res.innerHTML = 'Von Neumann’da komut ve veri <b>aynı yolu sırayla</b> kullandı; Harvard’da <b>aynı anda</b> geldi. İşte darboğaz fikri bu!';
      busy = false;
    });

        <button type="button" class="btn primary small" data-a="step">▶ Sonraki aşama</button>
        <button type="button" class="btn small" data-a="play">⏵ Otomatik</button>
        <button type="button" class="btn small ghost" data-a="reset">↺ Sıfırla</button>
        <span class="muted" data-r="prog" style="font-size:.85rem"></span>
      </div>`;
    const area = $('[data-r="area"]', host);
    const reg = (k) => $(`[data-reg="${k}"]`, host);
    const memRow = (k) => $(`[data-m="${k}"]`, host);
    const log = $('[data-r="log"]', host);
    function reset() {
      playing = false;
      A = clamp(parseInt($('[data-r="inA"]', host).value, 10) || 0, 0, 99);
      B = clamp(parseInt($('[data-r="inB"]', host).value, 10) || 0, 0, 99);
      st = { p: 0, PC: 0, IR: '', R1: null, R2: null, R3: null, C: null };
      paint();
      log.innerHTML = 'Hazır. PC = 00 → ilk komutun adresi. <b>Sonraki aşama</b>’ya bas.';
      $('[data-r="alu"]', host).textContent = '—';
    }
    function paint() {
      $('.v', reg('PC')).textContent = '0' + st.PC;
      $('.v', reg('IR')).textContent = st.IR || '—';
      ['R1', 'R2', 'R3'].forEach((r) => { $('.v', reg(r)).textContent = st[r] === null ? '—' : st[r]; });
      $('[data-v="A"]', host).textContent = A;
      $('[data-v="B"]', host).textContent = B;
      $('[data-v="C"]', host).textContent = st.C === null ? '— (henüz boş)' : st.C;
      $$('.memrow', host).forEach((r) => r.classList.toggle('pc', r.dataset.m === String(st.PC) && st.p < 12));
      const ph = st.p < 12 ? PH[st.p % 3] : '';
      $$('[data-ph]', host).forEach((s) => s.classList.toggle('on', s.dataset.ph === ph));
      $('[data-r="prog"]', host).textContent = st.p < 12 ? `Komut ${Math.floor(st.p / 3) + 1}/4 · Sıradaki aşama: ${ph}` : 'Program tamamlandı';
    }
    async function step() {
      if (busy || st.p >= 12) return;
      busy = true;
      const i = Math.floor(st.p / 3), phase = st.p % 3, p = PROG[i];
      const cu = $('.v', reg('CU'));
      if (phase === 0) {
        log.innerHTML = `<b>GETİR:</b> PC = 0${i}, yani sıradaki komutun adresi. Komut bellekten alınıp <b>IR</b>’ye kopyalanıyor; PC bir sonraki komutu (0${i + 1}) gösterecek şekilde ilerliyor.`;
        cu.textContent = 'Komut getiriliyor…';
        await flyToken(area, memRow(i), reg('IR'), 'komut');
        st.IR = p.txt; st.PC = i + 1; flash(reg('PC'));
      } else if (phase === 1) {
        log.innerHTML = `<b>ÇÖZ:</b> ${p.dec}`;
        cu.innerHTML = p.kind === 'add' ? 'Çözüldü: ADD → ALU' : p.kind === 'load' ? 'Çözüldü: LOAD' : 'Çözüldü: STORE';
        flash(reg('CU'));
        await Motion.wait(400);
      } else {
        if (p.kind === 'load') {
          const v = p.src === 'A' ? A : B;
          log.innerHTML = `<b>YÜRÜT:</b> Bellek sistemi ${p.src} adresindeki <b>${v}</b> değerini sağlıyor; değer <b>${p.dst}</b> yazmacına yükleniyor.`;
          await flyToken(area, memRow(p.src), reg(p.dst), String(v));
          st[p.dst] = v;
        } else if (p.kind === 'add') {
          log.innerHTML = `<b>YÜRÜT:</b> Kontrol birimi R1 ve R2’yi okutuyor, <b>ALU</b> toplamayı yapıyor ve sonucu <b>R3</b>’e yönlendiriyor.`;
          await flyToken(area, reg('R1'), reg('ALU'), String(st.R1));
          await flyToken(area, reg('R2'), reg('ALU'), String(st.R2));
          const sum = st.R1 + st.R2;
          $('[data-r="alu"]', host).textContent = `${st.R1} + ${st.R2} = ${sum}`;
          flash(reg('ALU'));
          await Motion.wait(300);
          await flyToken(area, reg('ALU'), reg('R3'), String(sum));
          st.R3 = sum;
        } else {
          log.innerHTML = `<b>YÜRÜT:</b> R3 içeriği (<b>${st.R3}</b>) <b>C</b> adresindeki bellek konumuna yazılıyor. Program bitti: <b>C = ${A} + ${B} = ${st.R3}</b> 🎉`;
          await flyToken(area, reg('R3'), memRow('C'), String(st.R3));
          st.C = st.R3;
        }
        cu.textContent = 'Yürütüldü ✓';
      }
      st.p++;
      paint();
      busy = false;
    }
    async function play() {
      if (playing) return;
      playing = true;
      const tok = NAV_TOKEN;
      if (st.p >= 12) { reset(); playing = true; }
      while (playing && alive(tok) && st.p < 12) {
        await step();
        await Motion.wait(900);
      }
      playing = false;
    }
    host.addEventListener('click', (e) => {
      const a = e.target.closest('[data-a]');
      if (!a) return;
      if (a.dataset.a === 'step') { playing = false; step(); }
      else if (a.dataset.a === 'play') play();
      else if (a.dataset.a === 'reset') { if (!busy) reset(); }
    });
    $$('input', host).forEach((inp) => inp.addEventListener('change', () => { if (!busy) reset(); }));
    reset();
  }

  /* ---------- Etkileşim 4: Bellek hiyerarşisi piramidi ---------- */
  function initPyramid(root) {
    const host = $('#m2Pyr', root);
    const L = [
      { n: 'Yazmaçlar', c: '#a24e07', task: 'CPU’nun o anda kullandığı operand (işlenecek değer) ve durum bilgisini tutar.', prop: 'En hızlı; çok küçük; uçucu (elektrik kesilince silinir).' },
      { n: 'L1 önbellek', c: '#b8612a', task: 'Sık veya yakın zamanda gerekecek komut ve veriyi CPU’ya en yakın yerde tutar. Modern CPU’larda çoğu zaman komut (L1I) ve veri (L1D) için ayrıdır.', prop: 'Önbellek seviyelerinin en küçüğü ve en hızlısı; çekirdeğe özel; uçucu.' },
      { n: 'L2 / L3 önbellek', c: '#0f766e', task: 'L1’de bulunamayan komut ve veriler için daha büyük ara katmanlar. L3 (son seviye önbellek) çoğu tasarımda çekirdekler arasında paylaşılır.', prop: 'Alt seviyelerde kapasite artar, gecikme de artar; uçucu.' },
      { n: 'Ana bellek (RAM)', c: '#0d6b53', task: 'Çalışan programların kodunu ve aktif verisini tutar.', prop: 'GB düzeyinde kapasite; önbellekten yavaş; uçucu.' },
      { n: 'Kalıcı depolama (SSD/HDD)', c: '#3f4f5f', task: 'Program, dosya ve kalıcı veriyi uzun süre saklar.', prop: 'En yüksek kapasite; RAM’den çok daha yüksek gecikme; kalıcı. <i>Not: Teknik olarak “bellek” değil depolamadır; şemada yaşam döngüsünü göstermek için en alta konur.</i>' }
    ];
    const W = 500, H = 300, h = 56, g = 3;
    const svg = L.map((l, i) => {
      const y = i * (h + g) + 4, t = 36 + i * 46, b = 36 + (i + 1) * 46, cx = W / 2;
      return `<g class="lvl" tabindex="0" role="button" data-i="${i}" aria-label="${l.n}">
        <polygon points="${cx - t},${y} ${cx + t},${y} ${cx + b},${y + h} ${cx - b},${y + h}" fill="${l.c}"/>
        <text x="${cx}" y="${y + h / 2 + 5}" text-anchor="middle">${l.n}</text></g>`;
    }).join('');
    host.innerHTML = `
      <p class="lab-hint">Bir katmana tıkla (veya Tab ile gelip Enter’a bas). Yukarı çıktıkça hız artar, kapasite azalır, bayt başına maliyet artar.</p>
      <div class="pyramid"><svg viewBox="0 0 ${W} ${H}" role="group" aria-label="Bellek hiyerarşisi piramidi">${svg}</svg>
        <div class="pyr-axis"><span>▲ daha hızlı · daha küçük · daha pahalı</span><span>▼ daha büyük · daha yavaş · daha ucuz</span></div></div>
      <div class="ex-detail" data-r="d" aria-live="polite" style="margin-top:12px"></div>`;
    const d = $('[data-r="d"]', host);
    function show(i) {
      $$('.lvl', host).forEach((x) => x.classList.toggle('sel', +x.dataset.i === i));
      const l = L[i];
      d.innerHTML = `<h4>${i + 1}. ${l.n}</h4><p><b>Temel görev:</b> ${l.task}</p><p class="mt0"><b>Göreli özellik:</b> ${l.prop}</p>`;
    }
    $$('.lvl', host).forEach((x) => {
      x.addEventListener('click', () => show(+x.dataset.i));
      x.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(+x.dataset.i); } });
    });
    show(0);
  }

  registerModule({
    id: 'm2', no: 2,
    title: 'Bilgisayar Mimarisi ve Modern Sistemler',
    short: 'Bilgisayar mimarisi',
    source: 'Hafta 1 ders notu, §1.6–1.16',
    blurb: 'ISA ve mikromimari, stored-program ve Von Neumann, Harvard, getir–çöz–yürüt, bellek hiyerarşisi, veri yolları ve PCIe, CPU/GPU/NPU, SoC ve chiplet, performans ölçütleri.',
    objectives: [
